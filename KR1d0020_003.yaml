body:
  text: 周禮纂訓卷三安溪李鍾倫撰酒正掌酒之政令以式法授酒材注式法作酒之法式作酒既有米麴之數又有功沽之巧疏酒正辨四飲則漿之政令亦掌之漿之法式及漿材亦授之矣功沽謂善惡凡為公酒者亦如之注謂鄉射飲酒以公事作酒者亦以式法及酒材授之使自釀之疏言鄉射飲酒者謂鄉飲酒鄉射飲酒皆為國行禮不可斂民故得公酒其百家為族不得公酒族祭步神之時合錢飲酒辨五齊之名一曰泛齊二曰醴齊三曰盎齊四曰緹齊五曰沈齊泛芳劒反盎烏浪反緹音體注泛者成而滓浮泛泛然醴猶體也成而汁滓相將盎猶翁也成而翁翁然蔥白色緹者成而紅赤沈者成而滓沈自醴以上尤濁盎以下差清古之法式未可盡聞杜子春讀齊皆為粢玄謂齊者每有祭祀以度量節作之疏醴齊者醴猶體也此齊熟時上下一體汁滓相將也五齊三酒及鬯酒所以異者五齊三酒俱用秫稻麴蘖又三酒味厚人所飲者五齊味薄所以祭者其鬯酒春官鬯人所造自用黑黍為之與此别也辨三酒之物一曰事酒二曰昔酒三曰清酒注鄭司農云事酒有事而飲也昔酒無事而飲也玄謂事酒酌有事者之酒其酒則今之醳酒也昔酒今之酋久白酒所謂舊醳者也清酒今中山冬釀接夏而成疏有事而飲者謂於祭祀之時卑賤執事之人祭末並得飲之無事而飲者謂羣臣陪位不行事者祭末並得飲之後鄭云酌有事者之酒謂祭末酌酒與有事之人雖不當祭亦酌酒與之足先鄭義也云即今之醳酒者事酒冬釀春成以漢時醳酒況之云昔酒今之酋久白酒者昔為久酋亦逺久之義云舊醳者對事酒為新醳也云清酒今冬釀接夏而成者以昔酒為久冬釀接春清酒久於昔酒自然接夏也辨四飲之物一曰清二曰醫三曰漿四曰酏醫於己反酏以支反注清謂醴之泲者醫內則所謂或以酏為醴凡醴濁釀酏為之則少清矣漿今之酨漿也酏今之粥內則有黍酏酏飲粥稀者之稱也疏漿人六飲中有水涼酒正不辨之者無厚薄之齊言清謂醴之泲者據漿人所云醴即此所云清也云醫即內則所謂以酏為醴者彼以酏為醴在清糟下此醫亦在清下也云酨漿者酨之言載米汁相載也酨音再竹代切掌其厚薄之齊以共王之四飲三酒之饌及后世子之飲與其酒注后世子不言饌其饋食不必具設之五齊用醴為飲者取醴恬與酒味異也其餘四齊味皆似酒疏言掌其厚薄之齊者從五齊以下非酒正所造並是酒人漿人所作酒正直辨其厚薄之齊而已訓鄭云后世子饋食不必具設之者謂后世子之饋食但共飲與酒而不必備四飲三酒之數也凡祭祀以法共五齊三酒以實八尊大祭三二中祭再二小祭一二皆有酌數唯齊酒不二皆有器量注酌器所用注尊中者數量之多少未聞大祭者王服大裘袞冕所祭中祭王服鷩冕毳冕所祭小祭王服希冕玄冕所祭三二再二一二者謂就三酒之尊而益之也禮運曰澄酒在下澄酒是三酒也益之者以飲諸臣若今常滿尊也杜子春云齊酒不二謂五齊以祭不益也三酒人所飲者益也疏五齊三酒據正尊故云八尊若五齊加明水三酒加玄酒則為十六尊也天地宗廟並有大祭次祭小祭三等按司服祀天大裘祭地當亦如之天之次祀不見衣服其羣小祀注以為山林川澤之屬雖不言風師雨師等然可兼之若宗廟小祭則馬融以為祭殤是也趙商問禮運注澄是沈齊此注澄酒是三酒何鄭答云可去澄字然則有澄字者誤也訓法謂祭祀應共齊酒多寡不同以祭之大小為差據注疏之説冬至祀天及宗廟大祫用五齊元日祈穀及宗廟禘祭用四齊醴盎緹沈五時迎氣及宗廟時祭用二齊醴盎而已天之次祀疏以為不見衣服案四望家君子以為日月星辰然則天之次祀即服毳冕是也酌數器量謂注酒於尊有一定之升數也酌與器即所用以注酒者此亦所謂法也共賓客之禮酒共后之致飲于賓客之禮醫酏糟皆使其士奉之注禮酒王所致酒也王致酒后致飲夫婦之義糟醫酏不泲者泲曰清不泲曰糟后致飲無醴醫酏不清者與王同體屈也士謂酒人漿人奄士疏言禮酒謂饗燕之酒王有故不親饗燕則使人致酒於客館也若酒人所云陳酒謂若致饔餼列陳于客館中者也言后無醴醫酏不清者對漿人共夫人致飲于賓客醫酏糟上加之以清醴后既無清醴醫酏當清今皆不清以與王同體故屈也凡王之燕飲酒共其計酒正奉之注共其計者獻酬多少度當足也疏謂王與羣臣燕飲之酒以其共王故酒正自奉之凡饗士庶子饗耆老孤子皆共其酒無酌數訓士庶子耆老孤子注見外饔掌酒之賜頒皆有法以行之注法尊卑之差凡有秩酒者以書契授之注所秩者謂老臣王制曰九十日有秩疏秩常也酒正之出日入其成月入其要小宰聽之注出謂授酒材及用酒之多少也受用酒者日言其計於酒正酒正月盡言於小宰疏言授酒材謂酒正職首所言者用酒之多少謂若共五齊三酒以下云受用酒者謂酒人也嵗終則會唯王及后之飲酒不會以酒式誅賞注誅賞作酒之善惡者疏不言世子則世子之飲酒當會之酒人掌為五齊三酒祭祀則共奉之以役世婦注世婦謂宫卿之官掌女宫之宿戒及祭祀比其具酒人共酒因留與其奚為世婦役亦官聨共賓客之禮酒飲酒而奉之注酒正使之也禮酒饗燕之酒飲酒食之酒王不親饗燕不親食而使人各以其爵以酬幣侑幣致之則從而以酒往疏酒正云共賓客之禮酒使其士奉之士即此酒人也彼不言飲酒者禮酒中兼之云禮酒食之酒謂食時有酒者曲禮云酒漿處右此非獻酬酒是酳口之酒也云使人各以其爵以酬幣侑幣致之者案聘禮不親食以侑幣致之致饗以酬幣雖無燕法當與饗同云各以其爵者諸侯來朝遣三公致饗卿來聘遣卿大夫致饗云從而以酒往者謂酒人從使人欲往客館者以酒授賓客也凡事共酒而入于酒府注入于酒正之府者是王燕飲之酒酒正當奉之疏酒正所奉者謂王之燕飲酒并四飲三酒之饌凡祭祀共酒以往注不言奉小祭祀疏對上祭祀則共奉之是大祭次祭賓客之陳酒亦如之注謂若歸饔餼之酒亦自有奉之者以酒從往疏云有奉之者案聘禮云卿韋辨歸饔餼牲牢是也漿人掌共王之六飲水漿醴涼醫酏入于酒府注王之六飲亦酒正當奉之醴醴清也涼今寒粥若糗飯雜水也酒正不辨水涼者無厚薄之齊訓內則云飲重醴稻醴清糟黍醴清糟粱醴清糟或以酏為醴黍酏漿水濫即漿人六飲但內則所謂重醴謂兼清與糟設之漿人云醴但用清耳然則內則有水有漿即漿人之水漿也重醴即酒正之清漿人之醴也濫即漿人之涼也以酏為醴即漿人之醫也黍酏即漿人之酏也六飲謂水涼無清糟以其無厚薄之齊漿醴醫酏皆有清有糟故內則孔疏有十飲之文謂漿醴醫酏各有清糟為八并水涼而十也及其用之則或宜重或宜清或宜糟皆有法以共之矣共賓客之稍禮注稍禮非飱饔之禮留間王稍所給賓客者漿人所給亦六飲而已疏言留間者謂賓未去留間也訓酒人不共稍禮則稍禮宜有漿而無酒共夫人致飲于賓客之禮清醴醫酏糟而奉之注亦酒正使之三物有清有糟夫人不體王得備之禮飲醴用柶者糟也不用柶者清也疏夫人謂三夫人致飲于賓客亦致於客館助王養賓也清醴謂醴之泲者醫酏糟謂醫酏之不泲者凡飲共之注謂非食時訓注言非食時謂非王日一舉常食之時常食疏以為上文共王之六飲是也凌人掌冰正嵗十有二月令斬冰三其凌注正嵗季冬火星中大寒冰方盛之時凌冰室三之者為消釋度也故書正為政鄭司農云掌冰政主藏冰之政也杜子春云政當為正謂夏正三其凌三倍其冰疏正嵗謂夏之建寅為正若據周正則十二月冰未堅厚故據夏也訓正當依故書作政讀屬上句三其凌蓋三重其冰室春始治鑑鑑胡暫反注鑑如甀大口以盛冰置食物于中以禦溫氣春始治之為二月將獻羔而啓冰疏春謂正月甀直偽反與縋音同凡外內饔之膳羞鑑焉凡酒漿之酒醴亦如之注酒醴見溫氣亦失味酒漿酒人漿人也疏下文有祭祀此經直言膳羞明非祭祀祭祀共冰鑑賓客共冰注不以鑑往嫌使停膳羞疏云不以鑑往嫌使停膳羞者冰有鑑則不消食得停久也大喪共夷槃冰注夷之言尸也實冰于夷槃中置之尸牀之下所以寒尸尸之槃曰夷槃牀曰夷牀衾曰夷衾移尸曰夷于堂皆依尸而為言者也疏喪大記云君設大槃大夫設夷槃彼諸侯名大槃大夫卑不嫌與天子同名其制則小此但舉王喪實后世子三夫人以下亦共之其世婦以上有冰與大夫同女御無冰與士同見賜乃有也夏頒冰掌事注以冰頒賜則主為之疏掌事為主賜冰多少合得不合得之事訓頒冰有二喪祭用冰者惟卿大夫以上為然若尋常用冰則遍及庶民故左傳曰火出而畢賦自命夫婦至老疾無不受冰火出建辰之月言夏頒冰者蓋時近之秋刷刷所劣反注刷清也鄭司農云刷除冰室籩人掌四籩之實注籩竹器如豆者其容實皆四升朝事之籩其實麷蕡白黑形鹽膴鮑魚鱐麷音豐敷空切蕡符文反膴火吳反鱐所求反注蕡枲實也鄭司農云熬麥曰麷麻曰蕡稻曰白黍曰黑玄謂以司尊彝參之朝事謂祭宗廟薦血腥之事形鹽鹽之似虎者鮑者於楅室中糗乾之出於江淮王者備物近者腥之逺者乾之因其宜也疏朝事謂二祼之後祝延尸於户外後薦此八籩八籩者麷熬麥一也蕡麻子二也白熬稻三也黑熬黍四也形鹽五也膴以魚肉為大臠六也鮑以魚於楅室糗乾之七也鱐乾魚八也言楅室者謂楅土為室饋食之籩其實棗栗桃乾䕩榛實栗古栗字䕩音老盧皓切榛側巾反祼古亂反注饋食薦熟也今吉禮存者特牲少牢諸侯之大夫士祭禮也不祼不薦血腥而自薦熟始是以皆云饋食之禮乾䕩乾梅也有桃諸梅諸是其乾者榛似栗而小疏此謂朝踐薦腥後堂上更體其犬豕牛羊烹熟之時后薦饋食之籩八棗一也栗二也桃三也乾䕩四也榛實五也乾䕩既為乾梅則經中桃是濕者有濕桃須有濕梅有乾梅須有乾桃增前五者為七梅桃有乾濕棗亦須有乾濕復取一添前為八也鄭云特牲少牢是諸侯之大夫士禮者天子之大夫則用太牢也加籩之實蓤芡栗脯蓤芡栗脯蓤音陵芡音險注加籩謂尸既食后亞獻尸所加之籩重言之者以四物為八籩蓤芰也芡雞頭也栗與饋食同羞籩之實糗餌粉餈餌而志反餈昨資反注羞籩謂若少牢主人酬尸宰夫羞房中之羞于尸侑主人主婦皆右之者鄭司農云糗熬大豆與米也粉豆屑也玄謂此二物皆粉稻米黍米所為也合蒸曰餌餅之曰餈糗者搗糗熬大豆為餌餈之黏著以粉之耳餌言糗餈言粉互相足疏案有司徹上大夫當曰賓尸正祭不設內羞故於賓尸設之此天子之禮賓尸在明日則祭祀日當設之案少牢下大夫不賓尸者賓長致爵受酢宰夫羞房中之羞司士羞庶羞于尸祝主人主婦天子之禮亦當賓長酬酢後設此內羞庶羞于尸祝及王與后然鄭不引不賓尸而引賓尸者以其設內羞同故引其一但正祭設于祝賓尸設於侑又賓尸主人酬尸後正祭賓長受酢後為異耳糗與粉為一物云互相足者糗謂熬之亦粉之粉謂搗之亦糗之也訓上三節在九獻之中此內羞一節在九獻之外上三節籩豆各八此一節籩止於糗餌粉餈豆止於酏食糝食上三節薦豆籩皆主婦親之此薦內羞則少牢所謂宰夫司士等為之也薦內羞之時亦兼有庶羞內羞穀物庶羞牲物內羞則籩人醢人共之庶羞當內饔等共之內羞即所謂房中之羞者庶羞在豆其隆殺各有等見掌客品未詳九獻見司尊彛凡祭祀共其籩薦羞之實注未食未飲曰薦既食既飲曰羞疏未食未飲曰薦據朝事饋食之籩是也既食既飲曰羞者據尸食後酳尸訖所進羞也喪事及賓客之事共其薦籩羞籩注喪事之籩謂殷奠時疏殷奠朔月月半薦新祖奠遣奠之類也為王及后世子共其內羞疏言王后世子飲食之時用房中之羞也凡籩事掌之醢人掌四豆之實朝事之豆其實韭菹醓醢昌本麋臡菁菹鹿臡苑菹麇臡韭音久菹莊魚反醓吐感反本又作或一音昌審反臡音泥奴低反苑音卯北人音栁麋音麏居筠切注醓肉汁昌本昌蒲根切之四寸為菹臡亦醢也作醢者必先膊乾其肉乃後莝之雜以粱麴及鹽漬以美酒塗置瓶中百日則成矣有骨為臡無骨為醢菁蔓菁也苑鳬葵也凡菹醢皆以氣味相成其狀未聞疏言醓肉汁者以肉為之醓汁即肉汁云作醢必先膊乾其肉者案王制云一為乾豆脯非豆實亦謂作醢始得在豆與此義合也饋食之豆其實葵菹螺醢脾析蠯醢蜃蚳醢豚拍魚醢螺力禾反脾婢支反析星歷反蠯蒲佳反蜃市軫反拍音博廣韻音魄普伯切蚳音移注鄭司農云脾析牛百葉鄭大夫杜子春皆以拍為膊謂脅也或曰豚拍肩也加豆之實芹菹兔醢深蒲醓醢箈菹鴈醢筍菹魚醢芹音勤徐又音謹説文作近箈音逮爾雅作箈同筍息尹反注芹楚葵也深蒲蒲始生水中子箈箭萌筍竹萌疏箭萌一名篠竹萌一名簜萌皆新生者也羞豆之實酏食糝食食音嗣糝素感反注酏􅊡也內則曰取稻米舉糔溲之小切狼臅膏以與稻米為􅊡又曰糝取牛羊豕之肉三如一小切之為稻米稻米二肉一合以為餌煎之訓上加籩有糗餌彼餌無肉則入籩此餌米肉俱有名之為糝即入豆豆之品數甚多膳夫職有八珍當亦在豆然皆當於薦庶羞時共之此則內羞也其籩人所掌籩則止有此數豆則凡生人飲酒皆有籩惟祭祀及饗禮有之故曰享有昌歜白黑形鹽是也其燕禮或未必具蓋享有九獻則所謂朝獻饋獻之屬一與祭祀同也凡祭祀共薦羞之豆實賓客喪紀亦如之為王及后世子共其內羞王舉則共醢六十甕以五齊七醢七菹三臡實之齊子西反下同注齊當為齏五齏昌本脾析蜃豚拍深蒲也七醢醓螺蠯蚳魚兔雁醢七菹韭菁苑葵芹箈筍菹三臡麋鹿麇臡也凡醢醬所和細切為齏全物若䐑為菹少儀曰麋鹿為菹野豕為軒皆䐑而不切麇為辟雞兔為宛脾皆䐑而切之切蔥若薤實之醯以柔之由此言之則齏菹之稱菜肉通疏王舉以下與籩人異以具王舉不共籩實唯有豆實但共醢者以醢為主其實有五齏七菹等賓客之禮共醢五十甕注致饔餼時疏案掌客上公醯醢百二十甕侯伯百甕子男八十甕此據侯伯之禮醯醢共為百甕舉中言之凡事共醢醯人掌共五齊七菹凡醯物以共祭祀之齊菹凡醯醬之物賓客亦如之齊子兮反注齊菹醬屬醯人者皆須醯成味疏醯人連言醬者并豆醬亦掌此言賓客據饗食致之下文賓客之禮據饗餼王舉則共齊菹醯物六十甕共后及世子之醬齊菹賓客之禮共醯五十甕凡事共醯疏此王舉共醯物并醢人六十甕即膳夫醬用百有二十甕也鹽人掌鹽之政令以共百事之鹽訓政令謂出入也祭祀共其苦鹽散鹽苦音盬工户反注杜子春讀苦為盬玄謂散鹽煮水為鹽疏盬鹽出於鹽池散鹽煮水為之出於東海賓客共其形鹽散鹽王之膳羞共飴鹽后及世子亦如之注飴鹽鹽之恬者今戎鹽有焉疏戎鹽即石鹽凡齊事煮盬以待戒令齊才細反煮與煮同注齊事和五味之事煮盬湅治之幂人掌共巾幂幂莫歷反疏秪覆物巾兼以拭物祭祀以疏布巾幂八尊注以疏布者天地之神尚質疏云八尊據正尊言若五齊加明水三酒加玄酒則十六尊舉天地則四望山川社稷林澤皆用疏布皆是尚質之義以畫布巾幂六彝注宗廟可以文畫者畫其雲氣與疏六彝謂雞彝鳥彝斚彝黃彝虎彝蜼彝此六彝皆盛鬱鬯對八尊無鬱鬯以見宗廟有之其實天地亦有秬鬯之彝用疏布宗廟亦有八尊用畫布互舉以明義也訓凡天地之禮有鬱而無鬯有尊彝而無玉爵有獻而無祼惟宗廟則備之凡王巾皆黼黼音甫注四飲三酒皆畫黼疏言凡非一四飲三酒之外籩豆爼簋之屬皆用之宫人掌王之六寢之修注六寢者路寢一小寢五路寢以治事小寢以時燕息焉疏天子六寢諸侯當三寢路寢一燕寢一側室一內則所云是也為其井匽除其不蠲去其惡臭匽音偃蠲音涓古玄切又音圭注井漏井所以受水潦匽豬為霤下之池受畜水而流之者共王之沐浴疏沐用潘浴用湯凡寢中之事掃除執燭共爐炭凡勞事四方之舍事亦如之注從王適四方及會同所舍掌舍掌王之會同之舍設梐枑再重梐步禮反枑戶故反注杜子春云梐枑謂行馬玄謂行馬再重者以周衛有內外列疏此梐枑所施唯據下文車宫壝宫止宿而言其帷宫無宫暫止之間未必有梐枑也訓注釋梐枑為行馬行馬者交互其木以為遮欄虎賁氏居遮欄內以衛王故其職曰舍則守王間注云間梐枑也設車宫轅門注謂王行止宿阻險之處備非常次車以為藩則仰車以其轅表門疏鄭知在險阻之處者下文為壇壝宫是平地有土可掘則為壝宫此山間險阻無土可掘則為車宫也為壇壝宫棘門壝唯季反注謂王行止宿平地築壇又委壝土起堳埒以為宫鄭司農云棘門以戟為門疏云委壝土起堳埒者止宿之間不可築作墻壁故掘地為宫土在堳畔而髙則堳埒也訓築土為壇壇邊低垣圍繞曰壝埒亦卑垣也堳亦埒也為帷宫設旌門注謂王行晝止有所展肆若食息張帷為宫則樹旌以表門疏案司常云會同賓客置旌門然則轅門之等皆他官置之掌舍直主當取之也訓上二者不見何官置之或在司空也無宫則共人門注謂王行有所逢遇若住逰觀陳列周衛則列長大之人以表門疏此是暫駐之事非久停止非如上三者為宫也凡舍事則掌之注王行所舍止幕人掌帷幕幄帟綬之事幄烏學反帟音亦注王出宫則有是事在旁曰帷在上曰幕幕或在地展陳于上帷幕皆以布為之四合象宫室曰幄王所居之帳也帟主在幕若幄中坐上承塵幄帟皆以繒為之凡四物者以授連繫焉疏幕人掌此五者王出宫則送與掌次張之云幕或在地展陳于上者案聘禮云管人布幕官陳幣史展幣皆於幕上云帟主在幕者掌次有張幕設重帟之文是幕中有帟也云幄中有帟者掌次又有張大次小次設重帟之文次即幄是幄中有帟也訓帷幕在外幄帟在內在外故知以布為之在內故知以繒為之凡朝覲會同軍旅田役祭祀共其帷幕幄帟綬注共之者掌次當以張大喪共帷幕帟綬注為賓客飾也帷以帷堂或與幕張之於庭帟在柩上疏鄭云帷以帷堂者案喪大記及士喪禮始死帷堂小斂徹之及殯在堂亦帷之也云或與幕張於庭者案尚書顧命出綴衣于庭鄭云連綴小斂大斂之衣於庭中爾時在庭應設帷幕無正文故云或也三公及卿大夫之喪共其帟注唯士無帟王有惠則賜之檀弓曰君於士有賜帟疏掌次凡喪事張帟言諸侯孤卿大夫不及三公此云三公卿大夫不云諸侯與孤者三公與諸侯同孤與卿大夫同掌次掌王次之法以待張事注法大小丈尺王大旅上帝則張氊案設皇邸邸當禮反注大旅上帝祭天於圓丘國有故而祭亦曰旅此以旅見祀也張氊案以氊為牀於幄中鄭司農云皇羽覆上邸後版也玄謂後版屏風與染羽象鳳凰羽色以為之疏知是祭天者下别云祀五帝則此是昊天上帝也案牀也據鄭云為牀於幄中則知不徒設氊案皇邸而已并有大次小次之幄與下祀五帝互之也後版謂為大方版於坐後畫為斧文染羽以為之覆於版上不云黼扆者此不在寢廟無扆故别名皇邸也朝日祀五帝則張大次小次設重帟重案合諸侯亦如之朝直遙反重直龍反注朝日春分拜日於東門之外祀五帝於四郊次謂幄也大幄初往所止居也小幄謂接祭退俟之處祭義曰周人祭日以朝及暗雖有強力孰能支之是以退俟與諸臣代有事焉合諸侯於壇王亦以時休息重帟復帟重案牀重席也疏祀五帝謂四時迎氣幄在幕中既有幄明有幕可知不言氊及皇邸亦有可知上氊案不言重席亦有可知互見為義訓愚意大次帷幕也小次幄也古者行禮無自朝至暗之事方氏謂祭日或於朝或於暗蓋日初起時赤將昏時赤周人尚赤故用之也師田則張幕設重帟重案注不張幄者於是臨誓衆王或回顧瞻察疏不言帷者亦有可知諸侯朝覲會同則張大次小次注大次亦初往所止居小次即宫待事之處疏此謂與諸侯張之四時常朝則在國內今為會同而來故在國外宫即司儀所云宫方三百步初往止居謂宫外即宫應是宫內師田則張幕設案注諸侯從王而師田者疏不言重案僅有單席孤卿有邦事則張幕設案注有邦事謂以事從王若以王命出也孤王之孤三人副三公論道者不言公公如諸侯禮從王祭祀合諸侯張大次小次師田亦張幕設案疏鄭云以事從王者亦謂上祭祀會同師田數事以王命出謂若攝行祭祀及諸侯使臣時聘殷俯王不親行則使羣臣於國外受之也凡喪王則張帟三重諸侯再重孤卿大夫不重注張帟柩上承塵疏此諸侯謂三公王子母弟若畿外諸侯掌次不張之凡喪后與王同世子三夫人與侯同九嬪世婦與孤卿大夫同御妻與士同也几祭祀張其旅幕張尸次注旅衆也公卿以下即位所祭祀之門外以待事為之張大幕尸則有幄鄭司農云尸次祭祀之尸所居更衣帳疏祭祀之門外謂若廟有廟門外神則有壝宫之門門外並有立位更衣帳者未祭時服常服至祭所乃更之服祭服也射則張耦次注耦俱升射者次在洗東大射曰遂命三耦取弓矢于次疏天子大射六耦在西郊賓射六耦在朝燕射三耦在寢此六耦三耦據諸侯若衆耦則多但無常數耳鄭引大射者證次中有弓矢其耦立位在次北西面至射乃入次取弓矢也鄉射士禮則無次也掌凡邦之張事大府掌九貢九賦九功之二以受其貨賄之入頒其貨于受藏之府頒其賄于受用之府藏才浪反注九功謂九職也受藏之府若內府也受用之府若職內也或言受藏或言受用又雜言貨賄皆互文疏金玉曰貨布帛曰賄訓吉甫丘氏曰受藏之府內府也受用之府外府也家君子謂九功者畿內九職之民所貢閭師所掌者也內諸侯亦應各以九職所出為貢皆所謂九功也但其貢甚輕且微蓋王畿千里自農田關市山澤雜稅兵車牛馬征役之外復有此數以其輕微故冢宰不載而於大府載之稽其所入亦但以充府庫而已國之經費不藉此也凡官府都鄙之吏及執事者受財用焉疏此謂有事須用官物者皆來於大府處受財用訓愚意謂此疑即百官之廩祿也其不列於九式何也百官之祿出於公田公田則三等都鄙皆有之不可指定何賦以待祿廩故不載於九式也執事府史胥徒也凡頒財以式法授之關市之賦以待王之膳服邦中之賦以待賓客四郊之賦以待稍秣家削之賦以待匪頒邦甸之賦以待工事邦縣之賦以待幣帛邦都之賦以待祭祀山澤之賦以待喪紀幣餘之賦以待賜豫秣音末訓家君子曰邦都之賦以待祭祀邦中之賦以待賓客山澤之賦以待喪紀關市之賦以待膳服皆賦之最多者也邦縣之賦以待幣帛家削之賦以待匪頒邦甸之賦以待工事皆賦之次多者也四郊之賦以待稍秣幣餘之賦以待賜豫皆費之差少者也蓋邦中以外其地漸逺漸大自甸稍縣都以內其賦漸近漸輕至於關市山澤幣餘皆逐末趨利者故又增重賦焉然王城之內人民聚集故賦雖輕而得亦多先王之世専利有禁故斥幣雖賦重而得亦少其所待不同以此也歷觀周官之職凡祭祀賓客喪紀諸大事自邦中以至郊野莫敢不共然則某賦以待某事者計其所出約略足以供之耳讀周禮者宜善觀之凡邦國之貢以待弔用注弔用凶禮之五事凡萬民之貢以充府庫疏即上九功也府庫即內府外府充府庫者所謂三九之蓄內府外府何以専職萬民之貢曰貢賦之入皆內外府職之但經費所餘不過此數耳其取於萬民之貢何也給國家經費之外約其所留不過如此自此以上皆內府外府之事餘財以共玩好則玉府之事凡式貢之餘財以共玩好之用注謂先給九式及弔用足府庫而有餘財乃可以共玩好明玩好非治國之用言式言貢互文凡邦之賦用取具焉注賦用用賦嵗終則以貨賄之入出會之訓大府職貢賦入出之二與頒財之式法無府庫之掌玉府掌王之金玉玩好兵器凡良貨賄之藏注此物皆式貢之餘財所作共王之服玉佩玉珠玉注佩玉王所帶者玉藻曰天子佩白玉而玄組綬詩傳曰佩玉上有蔥衡下有雙璜衡牙蠙珠以納其間鄭司農云服玉冠飾十二玉疏詩傳云佩玉上有蔥衡者謂蔥玉為衡梁下有雙璜衡牙者謂以組懸於衡兩頭兩組之末皆有半璧曰璜又以一組懸衡中央末著衡牙使前後觸璜案詩傳又有琚瑀琚瑀所置當於懸衝牙組中央又以二組穿琚瑀內角斜繫於衡兩頭組末繫於璜又云蠙珠以納其間者組繩有五皆穿珠其間云冠飾十二玉者案辨師五冕衮冕十二旒鷩冕九旒毳冕七旒絺冕五旒玄冕三旒皆十二玉又有皮辨韋辨冠辨亦皆十二玉也王齊則共食玉注玉是陽精之純者食之以禦水氣鄭司農云王齊當食玉屑大喪共含玉復衣裳角枕角柶含户暗反注角枕以枕尸鄭司農云復招魂也衣裳生時服招魂復魄於太廟至四郊角柶角七以楔齒令可飯含玄謂復於四郊以綏疏含玉璧形而小不言飯玉贈玉者文不備復衣裳不在司服者司服所掌是尋常衣服玉府所掌其衣服之美者鄭司農云招魂復魄於太廟者王有七廟及寢皆復焉獨言太廟語不足又言至四郊後鄭不從之訓愚謂玉府掌王常服司服掌禮服故下文燕衣服亦玉府掌之掌王之燕衣服衽席牀笫凡褻器衽而甚反笫側美反笫簀也鄭司農云褻器清器虎子之屬疏案內豎及葬執褻器彼注與此不同彼死者不用清器故為頮沐之器若合諸侯則共珠槃玉敦敦音對注敦槃類珠玉以為飾古者以槃盛血以敦盛食合諸侯必割牛耳取血以盟珠槃以盛牛耳尸盟者執之疏合諸侯謂時見曰會按左傳盟小國執牛耳歃血則大國先若諸侯相與盟則戎右執牛耳也凡王之獻金玉兵器文織良貨賄之物受而藏之織音志又如字注謂百工為王所作可以獻遺諸侯古者致物於人尊之則曰獻通行曰饋文織畫及繡錦疏知非獻金玉於王者四方之幣獻入內府不得在此也鄭弟子答王肅之難引禮記君洗玉爵獻卿是王於諸侯可云獻也凡王之好賜共其貨賄訓玉府所云食貨皆王之所御者與內府掌凡邦之食貨賄不同內府掌受九貢九賦九功之貨賄良兵良器以待邦之大用注大用朝覲之頒賜訓大用即九式之屬其小用則外府共之凡四方之幣獻之金玉齒革兵器凡良貨賄入焉注諸侯朝聘所獻國珍疏此因朝聘而貢先入于掌貨賄入其要於大府乃始通於內府也凡適四方使者共其所受之物而奉之注王所以遺諸侯者疏此即王之獻金玉兵器以下是也彼據藏之此據用之凡王及冢宰之好賜豫則共之注冢宰待四方賓客之小治或有所善亦賜豫之外府掌邦布之入出以共百物而待邦之用凡有法者注布泉也其藏曰泉其行曰布取名於水泉其流行無不遍共百物者或作之或買之有法百官之公用也訓待邦之用內􅊶九式諸條蓋貢賦所入其貴貨內府掌之其泉布外府掌之泉布之外尤廣故外府所共諸用多於內府也共王及后世子之衣服之用凡祭祀賓客喪紀會同軍旅共其財用之幣齎賜豫之財用齎音咨即夷切又子兮切注齎行道之財用也聘禮曰問幾月之齎此服用亦謂當用布者也訓祭祀有行道之財者因王外出而舉者如過大川則用事焉之類賓客則出聘列邦之類喪紀則行弔侯國之類皆有行道之財也此等皆泉布所共其目與九式稍異此賜豫亦謂泉布凡邦之小用皆受焉注皆來受嵗終則會唯王及后之服不會司會掌邦之六典八法八則之二以逆邦國都鄙官府之治以九貢之法致邦國之財用以九賦之法令田野之財用以九功之法令民職之財用以九式之法均節邦之財用訓貢言致賦功言令者貢彼自貢之賦功則有徵斂之事故言令也賦曰田野者舉多者為主也功曰民職但凡民有職者皆令貢也掌國之官府郊野縣都之百物財用凡在書契版圖者之二以逆羣吏之治而聽其會計注郊四郊去國百里野甸稍也甸去國二百里稍三百里縣四百里都五百里疏此不言邦中而言官府者以官府在邦中故舉官府以表邦中也訓百物財用即司書所知民財器械以下之數凡載財物者曰書契載人民土地者曰版圖百物財用之在書契版圖者司書掌其正而藏之以待考司會掌其二以逆羣吏之治而賞罰之必以書契版圖逆羣吏之治者恐有橫取於民者也此一節承賦式言鈎考畿內之事以參互考日成以月要考月成以嵗會考嵗成以周知四國之治以詔王及冢宰廢置注參互謂司書之要二與職內之入職嵗之出訓此一節承典法則言兼鈎考四國之事羣吏亦以典法則考之四國亦以貢法考之互舉見義也曰計謂之參互其義未達司書掌邦之六典八法八則九職九正九事邦中之版土地之圖正音征注九正謂九賦九貢正稅也九事謂九式變言之者重其職明本而掌之非徒相副二也訓此數者皆邦籍之大者司書主藏之以周知入出百物以敘其財受其幣使入于職幣注敘猶比次也謂鉤考其財幣所給及其餘見為之簿書受其幣謂受録其餘幣而為之簿書使之入于職幣幣物當以時用之久藏將朽蠧訓百物之出謂九事百物之入謂九正職幣所入是為幣餘九正之屬凡上之用財用必考于司會注上謂王與冢宰王雖不會亦當知多少而闕之司會以九式均節邦之財用訓上之用財用是為羞服九事之屬此二者别為出入之要上之用財考于司會者總知其一嵗多少而已不考之於膳夫司裘諸官使之日會月要者所謂惟王不會也三嵗則大計羣吏之治以知民之財器械之數以知田野夫家六畜之數以知山林川澤之數以逆羣吏之徵令注械猶兵也山林川澤童枯則不稅疏司書知民之財器已下川澤已上恐羣吏濫徵斂萬民故知此本數乃逆受鈎考其徵令也訓上文但言版圖此有器械六畜之屬非版圖所載上文不具之者舉版圖以該之大司徒鄉遂州縣之官以嵗時登其夫家之衆寡六畜車輦之稽三嵗大比蓋以其書上之司書司書得以知土地人民財物之數而迎受其徵令以與司會互考焉蓋民財器械之屬有盛衰耗息之不同其徵令亦當與為繁簡是以考其治狀也稅斂之法在於司稼故其職云以年之上下出斂法凡稅斂掌事者受法焉及事成則入要二焉注法猶數也應當稅者之數成猶畢也疏稅斂掌事者謂若地官閭師旅師徴斂之官訓此承徵令而言稅斂之常數有一定之書是所謂法要二謂稅斂之治狀入之者候三年大比考其于法依否蓋司書執版圖以稽土地人民之數以土地人民之數為稅斂之法以稅斂之法逆徵令之書凡簿書之事司書掌之會計之事司會掌之凡邦治考焉注考其法于司書訓邦治掌典法則以下考於司書者其籍在焉職內掌邦之賦入辨其財用之物而執其總以二官府都鄙之財入之數以逆邦國之賦用注辨財用之物處之使種類相從總謂簿書之種别與大凡官府之有財入若關市之屬疏都鄙之財入謂三等采地采地之稅四之一逆邦國之賦用者鈎考用賦多少知其得失訓賦入謂九正二謂二司書也邦國之賦用職嵗掌其二凡受財者受其二令而書之注受財受於職內以給公用者二令若今御史所寫下本奏王所可者書若言某月某日某甲詔書出某物若干給某官某事及會以逆職嵗與官府財用之出而敘其財以待邦之移用注亦鉤考今藏中餘見為之簿移用謂轉運給他職嵗掌邦之賦出以二官府都鄙之財出賜之數以待會計而考之疏職內職嵗二官一入一出共相鈎考故職內云以逆邦國之賦用職嵗云待會計而考之訓賦出謂九事二亦二司書此二官皆佐司書掌財用出入之籍而無府庫之守者出謂羣吏之出財用賜謂上之賜豫也凡官府都鄙羣吏之出財用受式法于職嵗注百官之公用式法多少職嵗掌出之舊用事存焉凡上之賜豫以敘與職幣授之注敘受賜者之尊卑及會以式法贊逆會注助司會鉤考羣吏之計訓內外府只言邦用職內職嵗言羣吏之出入財用有異同乎又自大府以下言賜豫者甚多不知何故職幣掌式法以斂官府都鄙與凡用邦財者之幣注幣謂給公用之餘凡用邦財者謂軍旅訓官府都鄙謂羣吏之出財用也用邦財者謂凡九式所不具者振掌事者之餘財注振猶拯也撿也掌事謂以王命有所作為先言斂幣後言振財互之拯音拯皆辨其物而奠其録以書楬之以詔上之小用賜豫楬其列反注奠定也杜子春云定其録籍鄭司農云楬之若今時為書以著其幣疏以書楬之謂各為一牌書知善惡價數多少此小用賜豫是常賜豫玉府內府所云好賜是非常賜外府賜豫與此職幣同嵗終則會其出凡邦之會事以式法贊之疏贊之亦謂贊司會會之事也司裘掌為大裘以共王祀天之服注鄭司農云大裘黑羔裘服以祀天示質疏案鄭志大裘之上又有玄衣與裘同色亦無文采中秋獻良裘王乃行羽物中音仲注良善也中秋鳥獸毛毨因其良時而用之鄭司農云良裘王所服也行羽物以賜羣吏玄謂良裘玉藻所謂黼裘與此羽物小鳥鶉雀之屬鷹所擊者中秋鳩化為鷹中春鷹化為鳩順其始殺與其將止而大班羽物疏云順其始殺與其將止者羅氏中春亦行羽物季秋獻功裘以待頒賜注功裘人功微粗謂狐青麛裘之屬鄭司農云功裘卿大夫所服疏案玉藻有羔裘豹褎麛裘青犴褎及羔裘狐裘四種之裘君臣同有但君則用純大夫則褎用雜然則功裘之內兼有君臣所服裘故言以待頒賜也王大射則共虎侯熊侯豹侯設其鵠諸侯則共熊侯豹侯卿大夫則共麋侯皆設其鵠注大射者謂祭祀射王將有郊廟之事以射擇諸侯及羣臣與邦國所貢之士可以與祭者諸侯謂三公及王子弟封於畿內者卿大夫亦皆有采地焉其將祀其先祖亦與羣臣射以擇之凡大射各於其射宫侯者其所射也以虎熊豹麋之皮飾其側又方制之以為􅙯本亦作凖謂之鵠著於侯中所謂皮侯王之大射虎侯王所自射熊侯諸侯所射豹侯卿大夫以下所射諸侯之大射熊侯諸侯所自射豹侯羣臣所射卿大夫之大射麋侯君臣共射焉凡此侯道虎九十弓熊七十弓豹麋五十弓列國之諸侯大射大侯亦九十糝七十犴五十逺尊得伸可同耳所射正謂之侯者天子中之則能服諸侯諸侯以下中之則得為諸侯凡侯中之大小取數於侯道鄉射記曰弓二寸以為侯中則九十弓者侯中廣丈八尺七十弓者侯中廣丈四尺五十弓者侯中廣一丈考工記曰梓人為侯廣與崇方參分其廣而鵠居一焉然則侯中丈八尺者鵠方六尺侯中丈四尺者鵠方四尺六寸大半寸侯中一丈者鵠方三尺三寸少半寸謂之鵠者取名於鳱鵠鳱鵠小鳥而難中是以中之為雋亦取鵠之言較較者直也射所以直已志用虎熊豹麋之皮示服猛討迷惑者士不大射士無臣祭無所擇疏云凡大射各於其射宫者謂天子諸侯大夫大射各於其西郊小學之中云侯者其所射者以其雖有正鵠之别侯其總名云以虎熊豹麋之皮飾其側者侯上下俱有布一幅夾之所飾者唯有兩旁之側云列國之諸侯大射大侯亦九十糝七十犴五十者大侯謂熊侯也糝侯者豹鵠而麋飾糝雜也畿外諸侯與天子同但用皮别耳云示服猛者虎豹是猛獸示能伏之云討迷惑者謂麋者迷也云士不大射者士自無大射禮得與天子大射者以其得助祭也是以鄭注云豹侯卿大夫以下所射已下士也至於賓射士又自為賓射不得與天子賓射也故射人云士犴侯二正是也大喪廞裘飾皮車注皮車遣車之革路廞興也若詩之興謂象似而作之凡為神之偶衣物必沽而小耳疏興謂象生時物而作之謂明器中之裘皮車亦謂明器之車以皮飾之云為神之偶衣物必沽而小者偶謂俑衣謂送死之衣沽粗也凡邦之皮事掌之嵗終則會唯王之裘與其皮事不會掌皮掌秋斂皮冬斂革春獻之注皮革踰嵗乾久乃可用獻之獻其良者於王以入司裘給王用疏許氏説文獸皮治去其毛曰革秋斂皮者鳥獸毛毨之時其皮善革乃須治用功深故冬斂之訓凡諸禽獸羽毛齒革之賦貢皆在玉府掌皮蓋以時取而治之以共用遂以式法頒皮革于百工注式法作物所用多少故事疏百工冬官之屬若裘氏韋氏函人之類用皮者也共其毳毛為氈以待邦事毳尺稅反注當用氈則共之毳毛毛細縟者疏云當用氈者謂若掌次張氈案則掌皮共毳毛與冬官使作氈與掌次也嵗終則會其財齎注財斂財本數及餘見者齎所給與人以物曰齎疏言斂財本數及餘見者謂四方所入皮革之數與出給不盡者齎有兩義上外府注行道曰齎皮革非行道所用故以給豫人物解之財齎二者並據皮革而言也周禮纂訓卷三
