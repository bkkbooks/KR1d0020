body:
  text: 周禮纂訓卷二十安溪李鍾倫撰職金掌凡金玉錫石丹青之戒令注青空青也疏此與地官丱人異者彼官主其取此官主其藏受其入征者辨其物之􅍇惡與其數量楬而璽之入其金錫于為兵器之府入其玉石丹青于守藏之府楬音竭璽音徙注入征者謂主受采金玉錫石丹青者之租稅也楬而璽者楬書其數量以著其物也璽者印也為兵器者攻金之工六也守藏者玉府內府也入其要注要凡數也入之於大府訓愚謂上言入其物此言入其要皆謂為兵器及守藏之府也掌受士之金罰貨罰入于司兵注給治兵及工直也貨泉貝也罰罰贖也疏受士之金罰貨罰者謂斷獄訟者有疑即使出金為贖或無金即出貨以當金直也旅于上帝則共其金版饗諸侯亦如之注鉼金謂之版此版所施未聞鉼必領反凡國有大故而用金石則掌其令注主其取之令也用金石者作槍雷椎椁之屬疏槍雷椎椁皆謂守城捍禦之具司厲掌盜賊之任器貨賄辨其物皆有數量賈而楬之入于司兵賈音嫁注任器貨賄謂盜賊所用傷人兵器及所盜財物也其奴男子入于罪𨽻女子入于舂稿稿古老反注謂坐為盜賊而為奴者輸于罪𨽻舂人槀人之官也由是觀之今之為奴婢古之罪人也故書曰豫則奴戮汝春秋傳曰斐豹𨽻也著于丹書請焚丹書我殺督戎耻為奴欲禁其籍也凡有爵者與七十者與未齓者皆不為奴齓音襯初覲切又初謹切注有爵謂命士以上也齓毁齒也男八嵗女七嵗而毁齒犬人掌犬牲凡祭祀共犬牲用牷物伏瘞亦如之牲音全本亦作全瘞於例反徐烏計反注牷純也物色也伏謂伏犬以王車轢之瘞謂埋祭也疏伏謂伏犬以王車轢之者此謂王將祭而出國軷道之祭即大馭所云是也凡幾珥沈辜用駹可也駹亡江反注幾讀為刉珥當為衈刉衈釁禮之事大宗伯職曰以埋沈祭山林川澤以罷辜祭四方百物駹謂不純色也罷孚逼反凡相犬牽犬者屬焉掌其政治相息亮反注犬有三種一為田犬二為吠犬三為食犬若田犬吠犬觀其善惡若食犬觀其肥瘦皆當相之牽犬者謂呈見之少儀云犬則執紲是也司圜掌收教罷民凡害人者弗使冠飾而加明刑焉任之以事而收教之能改者上罪三年而舍中罪二年而舍下罪一年而舍其不能改而出圜土者殺雖出三年不齒注罷民謂惡人不從化為百姓所患苦而未入五刑者也故曰害人弗使冠飾者著墨幪若古之象刑與疏此罷民入圜土者不坐嘉石朝士坐嘉石者不入圜土云著墨幪者案孝經緯云三皇無文五帝畫象三王肉刑畫象者上罪墨象赭衣雜屨中罪赭衣雜屨下罪雜屨而已訓按幪巾也著墨巾無冠飾也凡圜土之刑人也不虧體其罰人也不虧財注言其刑人但加以明刑其罰人但任之以事而已此圜土所收教者過失害人麗於法者掌囚掌守盜賊凡囚者上罪梏拲而桎中罪桎梏下罪梏王之同族拲有爵者桎以待弊罪梏古毒反張揖云參著曰梏偏著曰桎說文云梏手械也所以告天桎足械也所以質地拲劉云姜奉反又居辱反韋昭音拱李竒音恐桎之實反注凡囚者謂非盜賊自以他罪拘者也拲者兩手共一木在手曰梏在足曰桎中罪不拲手足各一木耳下罪又去桎王同族及命士以上雖有上罪或拲或桎而已疏此謂五刑罪人古者五刑不入圜土故使身居三木掌囚守之及刑殺告刑于王奉而適朝士加明梏以適市而刑殺之注告刑于王其死罪則曰某之罪在大辟其刑罪則曰某之罪在小辟奉而適朝者重刑為王欲有所赦且當以付士士鄉士也鄉士加明梏者謂書其姓名及其罪於梏而著之也疏云士鄉士者以經云適市刑殺市在國若遂士以下則各就其處刑殺也掌囚掌守賊囚及欲刑殺則還付士凡有爵者與王之同族奉而適甸師氏以待刑殺注適甸師氏亦由朝乃往也待刑殺者掌戮將自市來也掌戮掌斬殺賊諜而搏之諜音牒搏注作膊同普博反注斬以鈇鉞若今要斬也殺以刀刃若今棄市也諜謂姦冦反間者賊與諜罪大者斬之小者殺之搏當為膊諸城上之膊謂去衣磔之凡殺其親者焚之殺王之親者辜之注親緦服以內也焚燒也辜謂磔之凡殺人者踣諸市肆之三日刑盜于市踣音蔔蒲北切又音仆注踣僵尸也肆猶申也陳也凡言刑盜罪惡莫大焉疏除上三者之外皆陳尸于市凡罪之麗於法者亦如之唯王之同族與有爵者殺之于甸師氏注罪二千五百條上附下附刑五而已疏云亦如之者合入死者亦踣之合入四刑者雖不踣亦刑之在市凡軍旅田役斬殺刑戮亦如之注戮謂膊焚辜肆疏案士師大師戮犯禁者鄉士遂士凡國有大事皆戮其犯命不使掌戮者此等權宜之事臨時即决不假掌戮也墨者使守門劓者使守關宫者使守內刖者使守囿注斷足驅衛禽獸無急行髠者使守積髠苦門反積子賜反注此出五刑之中而髠者必王之同族不宫者髠頭而已司𨽻掌五𨽻之法辨其物而掌其政令注五𨽻謂罪𨽻四翟之𨽻也物衣服兵器之屬帥其民而搏盜賊役國中之辱事為百官積任器凡囚執人之事注民五𨽻之民也百官所當任用之器物此官主為積聚之邦有祭祀賔客喪紀之事則役其煩辱之事掌帥四翟之𨽻使之皆服其邦之服執其邦之兵守王宫與野舍之厲禁注野舍王行所止舍也厲遮列也罪𨽻掌役百官府與凡有守者掌使令之小事訓愚按有守者如士庶子守王宫與其守城郭溝池𣗳渠之固者凡封國若家牛助為牽倣倣步浪反注封國若家謂建諸侯立大夫家也牛助國以官牛助轉徙也罪𨽻牽倣之在前曰牽在旁曰倣其守王宫與其厲禁者如蠻𨽻之事訓按凡言如者皆於上文見義此獨於下文見義者以司𨽻有帥四𨽻之文不言罪𨽻故此雖義取下文實承上文也蠻𨽻掌役校人養馬其在王宫者執其國之兵以守王宫在野外則守厲禁閩𨽻掌役畜養鳥而阜蕃教擾之掌子則取𨽻焉注杜子春云子當為祀𤣥謂掌子者王立世子置臣使掌其家事而以閩𨽻役之訓愚謂掌子凡掌士庶子之有守者取閩𨽻以役之如罪𨽻所謂役百官府與有守者是也夷𨽻掌役牧人養牛馬與鳥言注夷狄之人或曉鳥獸之言故春秋傳曰介葛盧聞牛鳴曰是生三犧皆用之矣疏經云與鳥言鄭意解鳥言者亦解獸言故兼言之其守王宫者與其守厲禁者如蠻𨽻之事貉𨽻掌役服不氏而養獸而教擾之掌與獸言注不言阜蕃者猛獸不可服又不生乳于圈檻也其守王宫者與其守厲禁者如蠻𨽻之事布憲掌憲邦之刑禁正月之吉執旌節以宣布于四方而憲邦之刑禁以詰四方邦國及其都鄙達于四海注憲表也謂縣之也刑禁者國之五禁所以左右刑罰者爾雅曰九夷八蠻六戎五狄謂之四海訓案先言邦國後都鄙者明邦國亦有都鄙也國中之刑禁則士師徇以木鐸縣于門閭者是也此所憲者邦國都鄙之禁也凡邦之大事合衆庶則以刑禁號令禁殺戮掌司斬殺戮者凡傷人見血而不以告者攘獄者遏訟者以告而誅之注司猶察也察此四者告于司冦罪之也斬殺戮謂吏民相斬相殺相戮者攘猶卻也卻獄者言不受也遏訟者遏止欲詮者也疏不受獄者謂人有罪過官有文書追攝不肯受也禁暴氏掌禁庶民之亂暴力正者嬌誣犯禁者作言語而不信者以告而誅之嬌居表反注力正以力强得正也凡國聚衆庶則戮其犯禁者以徇凡奚𨽻聚而出入者則司牧之戮其犯禁者奚𨽻女奴男奴也其聚出入有所使野廬氏掌達國道路至于四畿注達謂巡行通之使不陷絶也去王城五百里曰畿疏國之道路使其地之人治之野廬氏直巡行不通之處比國郊及野之道路宿息井𣗳注比猶校也宿息廬之屬賔客所宿及晝止者也井共飲食𣗳為蕃蔽若有賔客則令守涂地之人聚柝之有相翔者誅之柝音託注守涂地之人道所出廬宿旁民也相翔猶昌翔觀伺者也聚柝之聚擊柝以宿衛之也凡道路之舟車轚互者叙而行之轚音激古歷切又音計注舟車轚互謂於迫隘處也其過之者使以次叙之凡有節者及有爵者至則為之辟注辟辟行人亦使守涂地者禁野之橫行徑踰者注皆為防姦也橫行妄由田中徑踰射邪趨疾越隄渠也凡國之大事比修除道路者注比校治道者名掌凡道禁注禁若今絶蒙布巾持兵杖之屬邦之大師則令掃道路且以幾禁行作不時者不物者注不時謂不夙則暮者也不物謂衣服操持非比常人也幾禁之者備姦人內賊及反間蠟氏掌除胔蠟清預反胔似賜反注月令曰掩骼埋胔骨之尚有肉者也及禽獸之骨皆是凡國之大祭祀令州里除不蠲禁刑者任人及凶服者以及郊野大師大賔客亦如之蠲古𤣥反舊音圭潔也注任人司圜所收教罷民也此所禁除者皆為不欲見人所藏惡也若有死於道路者則令埋而置楬焉書其日月焉縣其衣服任器于有地之官以待其人掌凡國之胔禁楬音竭縣音𤣥雍氏掌溝瀆澮池之禁凡害於國稼者春令為阱擭溝瀆之利於民者秋令塞阱杜擭澮古外反阱在性反塹也擭胡化反注溝瀆澮田間通水者也池謂陂障之水道也害于國稼謂水潦及禽獸也阱穿地為塹擭柞鄂也堅地阱淺則設柞鄂于其中所以禦禽獸秋而塞之收刈之時為其陷害人也禁山之為苑澤之沈者注不得擅為苑囿於山也澤之沈者謂毒魚及水蟲之屬萍氏掌國之水禁注水禁謂水中害人之處及入水捕魚鱉不時幾酒注苛察沽買過多及非時者疏酒有時者謂若酒誥惟祀兹酒及昏禮為酒食以召鄉黨僚友是也謹酒注使民節用酒也禁川游者注備波洋卒至沈溺也司寤氏掌夜時注謂夜晚早以星分夜以詔夜士夜禁注夜士主行夜徼候者禦晨行者禁宵行者夜遊者注備其遭冦害及謀非公事晨先明也宵定昏也司烜氏掌以夫遂取明火於日以鑒取明水於月以共祭祀之明齍明燭共明水夫方符反司農音符齍音資注夫遂陽遂也鑒鏡屬取水者世謂之方諸取日之火月之水欲得隂陽之潔氣也明齍謂以明水修滌粢盛黍稷明燭以照饌陳明水以為𤣥酒凡邦之大事共墳燭庭燎墳扶云反燎力召反注墳大也𣗳於門外曰大燭於門內曰庭燎所以照衆為明疏庭燎在大寢庭按郊特牲注庭燎之差公蓋五十侯伯子男三十大戴禮文其百者天子禮中春以木鐸修火禁于國中中音仲注為季春將出火也火禁為用火之處及備風燥軍旅修火禁邦若屋誅則為明竁焉竁昌鋭反注屋如刑剭之剭剭誅謂不殺于市而以適甸師氏者也明竁若今揭頭明書其罪法也司烜掌明竁則罪人夜葬與條狼氏掌執鞭以趨辟王出入則八人夾道公則六人侯伯則四人子男則二人趨七須反辟婢亦反又音避疏按序官條狼氏下士六人今云天子八人蓋取胥徒中兼充也凡誓執鞭以趨於前且命之誓僕右曰殺誓馭曰車轘誓大夫曰敢不關鞭五百誓師曰三百誓邦之大史曰殺誓小史曰墨轘戶串反一音環注前謂所誓衆之行前也有司讀誓辭則大言其刑以警所誓也誓者謂出軍及將祭祀時也出軍之誓誓僕右及馭則書之甘誓備矣郊特牲說祭祀之誓曰卜之日王立于澤親聽誓命受教諫之義也車轘謂車裂也不關謂不關于君也大夫自受命以出則其餘事莫不復請師樂師也大史小史主禮事者疏誓自有大官若月令田獵師徒北靣誓之誓時此條狼氏則為之大言使衆聞知僕大僕也與王同車通右馭及王四乘也鄭云大夫受命以出則其餘事莫不請者欲見受命出征梱外之事將軍裁之不須復請其餘皆須請於君也按襄公十九年晉士丐帥師侵齊至榖聞齊侯環卒乃還公羊大其不伐喪謂大夫以君命出進退在大夫也榖梁曰還者事未畢之辭也善其不伐喪則何為未畢也君不尸小事臣不専大名士丐外専君命故非之也然則宜奈何宜墠帷而歸命乎介修閭氏掌比國中宿互柝者與其國粥而比其追胥者而賞罰之比毗志反粥音育注國中城中也宿謂宿衛也互謂行馬所以障互禁止人也柝謂行夜擊柝粥養也國所游養謂羡卒也訓愚按國粥粥與鬻通賣鬻于國中蓋市㕓之地亦有宿互柝也國中之宿互柝則民為之市㕓之宿互柝則賣粥者為之至於追胥於國中則共為之也禁徑踰者與以兵革趨行者與馳騁於國中者注皆為其惑衆訓愚按徑踰於國中謂門也古者合二十五家而為之門二十五家即閭也故修閭比互柝而禁徑踰皆於門焉設之邦有故則令守其閭互唯執節者不幾注令者令其閭胥里宰之屬疏注兼言閭胥里宰者修閭所掌雖主六鄉其實兼六遂也冥氏掌設孤張冥音覓注弧張罿罦之屬所以扃絹禽獸為阱擭以攻猛獸以靈鼓驅之驅丘于反注靈鼓六面鼓驅之使驚趨阱擭若得其獸則獻其皮革齒須備注須直謂頥下須備謂搔也搔音瓜庶氏掌除毒蠱以攻說禬之嘉草攻之庶章預反蠱音古禬劉音潰注毒蠱蟲物而病害人者賊律曰敢蠱人及教令者棄市攻說祈名祈其神求去之也嘉草藥物其狀未聞攻之謂燻之疏攻說禬之據去其神也嘉草攻之據去其身也凡驅蠱則令之比之穴氏掌攻蟄獸各以其物火之注蟄獸熊羆之屬冬藏者也將攻之必先燒其所食之物於穴外以誘出之乃可得之以時獻其珍異皮革翨氏掌攻猛鳥各以其物為媒而掎之掎音踦居綺切注猛鳥鷹隼之屬置其所食之物於絹中鳥來下則掎其腳以時獻其羽翮柞氏掌攻草木及林麓柞側百反麓音鹿注林人所養者山足曰麓疏注云林人所養者若林衡所掌未必人所養此乃人所攻治以擬種植者也夏日至令刋陽木而火之冬日至令剝隂木而水之刋苦干反注刋剝互言耳皆謂斫去其皮生山南為陽木生山北為隂木火之水之則使其肄不生疏山虞取其堅刃冬斬陽夏斬隂此欲死之故夏陽木冬隂木若欲其化也則春秋變其水火注化猶生也謂時以種榖也變其水火者乃所火則水之所水則火之則其土和美疏變之者謂夏至火之至秋則以水漬之冬日至水之至後春以火燒之凡攻木者掌其政令剃氏掌殺草春始生而萌之夏日至而夷之秋繩而芟之冬日至而耜之繩音孕芟所銜反注萌之者以茲其斫其生者夷之以鉤鎌迫地芟之也含實曰繩芟其繩則實不成熟耜之以耜側凍土剗之若欲其化也則以水火變之注謂以火燒其所芟萌之草已而水之則其土亦和美矣掌凡殺草之政令硩蔟氏掌覆夭鳥之巢覆芳復反夭音妖注夭鳥惡鳴之鳥若梟鵩以方書十日之號十有二辰之號十有二月之號十有二嵗之號二十有八星之號縣其巢上則去之縣音𤣥注方版也日謂從甲至癸辰謂從子至亥月謂從娵至荼嵗謂從攝提格至赤奮若星謂從角至軫翦氏掌除蠹物以攻禜攻之以莽草熏之蠹丁故反禜音詠莽亡蕩反注蠹物穿食人器物者蠹魚亦是也攻禜祈名莽草藥物殺蟲者以熏之則死凡庶蠱之事注庶除毒蠱者蠱蠹之類赤犮氏掌除牆屋以蜃炭攻之以灰灑毒之蜃市軫反灑色買反注除牆屋者除蟲豸藏逃其中者蜃大蛤也搗其炭以坌之則走淳之以灑之則死坌蒲悶反疏淳即沃也謂灑沃以汁凡隙屋除其貍蟲貍莫皆反劉莫拜反注貍蟲䗪肌蛷之屬䗪草夜反蛷音求蟈氏掌去蛙黽焚牡蘜以灰灑之則死蛙戶媧反黽莫辛反牡莫口反蘜弓六反注牡蘜蘜不華者齊魯之間謂蛙為蟈黽耿黽也蟈與耿黽尤怒鳴為聒人耳去之以其煙被之則凡水蟲無聲壺涿氏掌除水蟲以泡土之鼓驅之以焚石投之炮步交反注水蟲狐蜮之屬炮土之鼓瓦鼓也焚石投之使驚去若欲殺其神則以牡橭午貫象齒而沈之則其神死淵為陵橭杜讀為枯音姑即山榆也注神謂水神龍罔象橭榆木名庭氏掌射國中之夭鳥若不見其鳥獸則以救日之弓與救月之矢射之射食亦反注不見鳥獸謂夜來嗚呼為怪者獸狐狼之屬救日之弓救月之矢謂日月食所作弓矢日月之食隂陽相勝之變也於日食則射太隂月食則射太陽與若神也則以大隂之弓與枉矢射之注神謂非鳥獸之聲若或叫于宋太廟者太隂之弓救月之弓枉矢救日之矢與不言救月之弓與救日之矢者互言之救日用枉矢則救月以恆矢可知也疏太隂之弓與上救日之弓對故知是救月之弓枉矢與救月之矢相對則是救日之矢可知欲見弓矢之名故互見其文知救月用恆矢不用庳矢者以其庳矢弩所用銜枚氏掌司囂國之大祭祀令禁無囂囂五羔反注令主祭祀者軍旅田役令銜枚注為其言語以相誤禁􅑧呼歎嗚於國中者行歌哭于國中之道者􅑧音叫注為其惑衆伊耆氏掌國之大祭祀共其杖咸注咸讀為函老臣雖杖於朝事鬼神尚敬去之有司以此函藏之既事乃授之軍旅授有爵者杖注别吏卒且以扶尊者將軍杖鉞共王之齒杖注王之所以賜老者之杖王制曰五十杖於家六十杖於鄉七十杖於國八十杖於朝疏既共王之齒杖明皆據王所賜者而言若不得王賜者自拄之也訓按不得王賜杖者當是庶人之老大行人掌大賔之禮及大客之儀以親諸侯注大賔要服以內諸侯大客謂其孤卿疏言要服以內諸侯者對要服以外為小賔世一見者是也云大客謂孤卿者對小行人所云小客則受其幣聽其辭者是也按大國得立孤一人侯伯無孤殷聘使卿時聘使大夫士雖不得時聘為介來亦入客中春朝諸侯而圖天下之事秋覲以比邦國之功夏宗以陳天下之謨冬遇以協諸侯之慮時㑹以發四方之禁殷同以施天下之政朝直遙反比毗志反注此六事者以王見諸侯為文圖比陳協皆考績之言王者春見諸侯則圖其事之可否秋見諸侯則比其功之髙下夏見諸侯則陳其謀之是非冬見諸侯則合其慮之異同六服以其朝嵗四時分來更迭如此而遍時㑹即時見也無常期諸侯有不順服者王將有征討之事則既朝王命為壇於國外合諸侯而發禁命事焉禁謂九伐之法殷同即殷見也王十二嵗一巡守若不巡守則殷同殷同者六服盡朝既朝王亦命為壇於國外合諸侯而命其政政謂邦國之九法殷同四方四時分來嵗終則遍矣九伐九法皆在司馬職疏春夏秋冬雖相對為文及其受之處所則春夏受摯於朝受享于廟秋冬一受之於廟注云六服以其朝嵗者以下文依服數來朝則有不朝之嵗故云以其朝嵗也云既朝王命為壇於國外者諸侯有不當朝嵗者則就國外壇朝而已是以司儀與覲禮有壇朝之法若諸侯來者次當朝之嵗者則於國內依常朝之法既朝乃向外就壇行盟載之禮也鄭知王不巡守即行殷同者下文云十有二嵗王巡守殷國殷國與巡守連文明同是十二嵗若王巡守何須殷同明不巡守乃殷同也十二年唯衛服不當朝歲其餘侯甸男采要皆當朝歲當朝歲者亦朝於國乃更於壇朝不當朝歲者亦朝於壇如時㑹然時聘以結諸侯之好殷眺以除邦國之慝眺通弔反慝吐得反注此二事者以王見諸侯之臣使來者為文也時聘者亦無常期天子有事諸侯使大夫來聘親以禮見之禮而遣之所以結其恩好也天子無事則已殷眺謂一服朝之歲也一服朝之歲五服諸侯皆使卿以聘禮來眺天子天子以禮見之命以政禁之事所以除其惡行疏注云天子有事諸侯使大夫來聘者此謂時㑹之年當方有諸侯不順服當方諸侯來㑹餘方諸侯身不來使大夫來聘亦有兵至助王討逆若無事則不來也云殷眺在一服朝之歲者按宗伯注云一服朝在元年七年十一年以其朝者少聘者多故亦得稱殷殷衆也間問以諭諸侯之志歸脤以交諸侯之福賀慶以贊諸侯之喜致禬以補諸侯之烖間間厠之間脤上忍反音腎禬音㑹注此四者王使臣於諸侯之禮也間問者間歲一問諸侯謂存省之屬諭諸侯之志者諭言語諭書名其類也交或往或來也贊助也致禬凶禮之弔禮禬禮也疏注云間問謂存省之屬者按下文歲遍存三歲遍俯五歲遍省七歲屬象胥九歲屬瞽史十有一歲達瑞節並是間歲之事云交謂往來者欲見臣有祭祀亦得歸胙於王按宗伯云脤膰本施同姓尊二代之後亦得之按宗伯凶禮有五此唯言弔者此行人唯主弔法餘禮蓋自有人主之隱元年宰咺來歸惠公仲子之賵是宰夫主賻賵之事也訓愚謂凶禮之弔禮固見于行人矣至於喪荒禬恤四禮亦當在間問之內同掌於行人故存省之屬皆有事而存省之也致禬所以别言之者以其有歸財之法與四禮異諸侯有喪荒敗亂之事王亦必待間嵗乃問之者以侯國多其事亦多不過依間問之期而遍存遍省之而已以九儀辨諸侯之命等諸臣之爵以同邦國之禮而待其賔客上公之禮執桓圭九寸繅藉九寸冕服九章建常九斿樊纓九就二車九乘介九人禮九牢其朝位賔主之間九十步立當車軹擯者五人廟中將幣三享王禮再祼而酢饗禮九獻食禮九舉出入五積三問三勞諸侯之禮執信圭七寸繅藉七寸冕服七章建常七斿樊纓七就二車七乘介七人禮七牢朝位賔主之間七十步立當前疾擯者四人廟中將幣三享王禮一祼而酢饗禮七獻食禮七舉出入四積再問再勞諸伯執躬圭其他皆如諸侯之禮諸子執榖璧五寸繅藉五寸冕服五章建常五斿樊纓五就二車五乘介五人禮五牢朝位賔主之間五十步立當車衡擯者三人廟中將幣三享王禮一祼不酢饗禮五獻食禮五舉出入三積一問一勞諸男執蒲璧其他皆如諸子之禮繅音藻藉在夜反斿音留樊畔于反乘繩證反介音界軹之氏反或居氏反擯必刃反祼古亂反酢才洛反食禮音嗣積子賜反勞老報反信音申後信圭同注繅藉以五采韋衣板若奠玉則以藉之冕服著冕所服之衣也九章者自山龍以下七章者自華蟲以下五章者自宗彞以下也常旌旗也斿其屬幓垂者也樊纓馬飾也以罽飾之每一處五采備為一就二副也介輔已行禮者也禮大禮饔餼也三牲備為一牢朝位謂大門外賔下車及王車出迎所立處也王始立大門內交擯三辭乃乘車而迎之齊僕為之節上公立當軹侯伯立當疾子男立當衡王立當軫與前疾謂駟馬車轅前胡下垂柱地者廟受命祖之廟也三享皆束帛加璧庭實惟國所有朝士儀曰奉國地所出重物而獻之明臣職也朝先享不言朝者朝正禮不嫌有等也王禮王以鬱鬯禮賔也鬱人職曰凡祭祀賔客之祼事和鬱鬯以實彞而陳之禮者使宗伯攝酌圭瓚而祼王既拜送爵又攝酌璋瓚而祼后又拜送爵是為再祼再祼賔乃酢王也禮侯伯一祼者祼賔賔酢王而已后不祼也禮子男則祼賔而已不酢王也不酢之禮聘禮禮賔是與九舉舉牲體九飯也出入謂從來訖去也每積有牢禮米禾芻薪凡數不同者皆降殺問問不恙也勞謂勞倦之也皆有禮以幣致之疏桓圭之等此主行朝禮於朝所執其服則皮辨若行三享則執璧瑞樊馬腹帶纓馬鞅二車九乘者按覲禮記云偏駕不入王門鄭云左傍與己同曰遍同姓金路異姓象路四衛革路蕃國本路據王玉路不賜諸侯是王所乘為正諸侯左傍與己同曰偏此等不入王門舍於館乘墨車龍旗以朝彼雖覲禮此春夏受贄在朝無迎法亦應偏駕不入至朝後行三享在廟天子親迎乃申上服得乘金路之等若不申上服車何得有樊纓九就之屬但二車所飾無文未知諸侯二車得與上車同否二車及介陳於大門外賔北靣時介皆西北陳之禮九牢是饔餼大禮朝享後乃陳於館以數有九故進之在上朝位者王未迎之時在大門內與賔相去之數也車軹謂轂末車轅北向在西邉亦去大門九十步公在車東東西相望當轂末也擯者五人大宗伯為上擯小行人為承擯嗇夫為末擯其餘二人是士廟中將幣三享此是朝訖在廟行享乃有迎賔之禮也王禮與下為目已下皆王之禮也饗禮九獻者謂後日王速賔賔來就廟中行亨烹太牢設几而不倚爵盈而不飲九獻者王酢獻賔賔酌主人主人酬賔酬後更八獻是為九獻食禮亦太牢無酒出入五積謂在路供賔來有積去有積皆五積三問與三勞所行應同處三勞者按小行人逆勞于畿覲禮云至于郊王使人皮辨用璧勞聘禮則勞以幣但璧則兼幣也但覲禮注郊是近郊近郊與畿大小行人勞逺郊無文按書𫝊略說云天子太子年十八授孟侯孟侯者四方諸侯來迎于郊或逺郊當使世子勞三問之處亦當在近郊逺郊與畿也按王與諸侯行禮與諸侯待諸侯同司儀云諸公相為賔將幣交擯三辭車逆注云既三辭則主君乘車出大門而迎賔若聘禮則無出迎法也必知天子與諸侯敵禮者按下文大國之孤視小國之君唯不交擯則諸侯于天子交擯矣交擯是敵禮也注云饗設盛禮者有酒有食兼食與燕也訓云前疾謂駟馬車轅前胡下垂拄地者謂若輈人輈深四尺七寸軾前曲中是也云朝先享不言朝者自冕服九章以下唯言享不見朝禮云朝正禮不嫌有等者朝屬路門外無九十七十五十步差等相迎之法既無等故不言之云不酢之禮與聘禮之賔同者聘禮之賓用醴一祼不酢約同之但子男祼以鬱鬯不用醴則别云九舉舉牲體九飯者見特牲饋食禮尸食舉尸三飯佐食舉肝尸又三飯舉骼及獸魚王日一舉亦是生人食有舉法故知舉是舉牲體也凡大國之孤執皮帛以繼小國之君出入三積不問一勞朝位當車前不交擯廟中無相以酒禮之其他皆視小國之君注此以君命來聘者也孤尊既聘享更自以其贄見執束帛而已豹皮表之為飾繼小國之君言次之也朝聘之禮每一國畢乃前不交擯者不使介𫝊辭交于王之擯親自對擯者也廟中無相介皆入門西上而立不前相禮者聘之介是與以酒禮之酒謂齊酒也和之不用鬱鬯耳其他謂二車及介牢禮賓主之間擯者將幣祼酢饗食之數疏按典命上公立孤一人侯伯已下則無故云大國之孤也趙商問大國之孤既視小國之君以五為節下云諸侯之卿各下其君二等以下注云公使卿亦七侯伯亦五子男三不審大國孤五而卿七何答曰卿七介是奉君命孤五介是特見又繼小國之君非私覿也然則諸侯之大夫以時接見天子或可有私覿結其恩情但無文耳趙商又問孤出入三積亦是視小國之君何須特云三積與例似錯答曰三積卿亦然非獨孤也故不在視小國之中然則一勞者亦是卿亦然然則孤聘天子既以聘使受禮又自得禮如是孤法再重受禮矣鄭知孤執皮帛是既聘享更自以其贄見者若行正聘則執瑑圭璋八寸以行聘何得執皮帛也侯伯已下臣來但執圭璋行聘無此更見法矣云豹皮表之為飾者宗伯注云天子之孤飾贄以虎皮公之孤飾贄以豹皮云不使介𫝊辭交于王之擯而親自對擯者則聘禮賓來在末介下東靣上擯亦至末擯下親相與言是也凡諸侯之卿其禮各下其君二等以下及其大夫士皆如之注此亦以君命來聘者也所下其君者介與朝位賓主之間也其餘則自以其爵聘義曰上公七介侯伯五介子男三介是謂使卿之聘之數也朝位則上公七十步侯伯五十步子男三十步與疏云及其大夫士皆如之者大夫又各自下卿二等士無介與步數而言如之者指牢禮之等又降殺大夫也邦畿方千里其外方五百里謂之侯服嵗一見其貢祀物又其外方五百里謂之甸服二嵗一見其貢嬪物又其外方五百里謂之男服三嵗一見其貢器物又其外方五百里謂之采服四嵗一見其貢服物又其外方五百里謂之衛服五嵗一見其貢材物又其外方五百里謂之要服六嵗一見其貢貨物嬪婢人反注要服蠻服也此六服去王城三千五百里相距方七千里公侯伯子男封焉其朝貢之嵗四方各四分趨四時而來或朝春或宗夏或覲秋或遇冬祀貢者犧牲之屬嬪物絲枲也器物尊彞之屬服物𤣥纁絺纊也材物八材也貨物龜貝也疏此因朝而貢與太宰九貢及下小行人春入貢者别彼二者是嵗之常貢也太宰四曰幣貢此中無幣貢者因朝而貢三享中已有幣故不别貢幣也九州之外謂之蕃國世一見各以其所貴寶為摯注九州之外夷服鎮服蕃服也曲禮曰其在東夷北狄西戎南蠻雖大曰子然則九州之外其君皆子男也無朝貢之嵗父死子立及嗣王即位乃一來耳各以其所貴寶為摯則蕃國之君無執玉瑞者是以謂其君為小賓臣為小客所貴寶見𫝊者若犬戎獻白狼白鹿是也其餘則周書王㑹備焉王之所以撫邦國諸侯者嵗偏存三嵗遍眺五嵗遍省七嵗屬象胥諭言語協辭命九嵗屬瞽史諭書名聽聲音十有一嵗達瑞節同度量成牢禮同數器修法則十有二嵗王巡守殷國屬音束反注撫猶安也存眺省者王使臣於諸侯之禮所謂間問也嵗者巡守之明嵗以為始也屬猶聚也自五嵗以後遂間嵗遍省也七嵗省而召其象胥九嵗省而召其瞽史皆聚于天子之宫教習之也象胥譯官也王制曰五方之民言語不通嗜欲不同達其志通其欲東方曰寄南方曰象西方曰狄鞮北方曰譯此官正為象者周始有越重譯而來獻是因通言語之官為象胥云胥謂象之有才智者也辭命六辭之命也瞽樂師也史太史小史也書名書之字也古曰名聘禮曰百名以上至十一嵗又遍省焉度丈尺也量豆區釡也數器銓衡也法則八法八則也達同成修皆謂齎其法式行至則齊等之也成平也平其僭踰者也王巡守諸侯㑹者各以其時之方書曰遂覲東后其殷國則四方四時分來如平時疏注云自五嵗之後遂間嵗遍省也者但經一嵗與三嵗五嵗云存眺省至七嵗九嵗十一嵗不云省者以五嵗已言省義可知云書名古曰名者明今世曰字也云數器銓衡也者謂銖兩之等云八法八則者侯國有都鄙官府以此法則治之云殷國四方四時分來如平時者謂如六服盡來時即與平時别也凡諸侯之王事辨其位正其等協其禮賓而見之注王事以王之事來也疏辨其位謂九十七十五十步之位等謂冕服旌旗二車之類皆有等級協其禮謂牢禮饗燕積膳之禮若有大喪則詔相諸侯之禮疏諸侯為天子斬其有哭位周旋劈踊進退皆有禮法須助而告教之若有四方之大事則受其幣聽其辭注四方之大事謂國有兵冦諸侯來告急者禮動不虛皆有贄幣以崇敬也受之以其事入告王也聘禮曰若有言則以束帛如享禮疏引聘禮者彼雖是諸侯相告明告天子亦然凡諸侯之邦交嵗相問也殷相聘也世相朝也注小聘曰問殷中也父死子立曰世凡君即位大國朝焉小國聘焉疏言諸侯邦交謂同方嶽者小聘曰問者聘禮文故彼云小聘曰問不享是也大聘使卿小聘使大夫王制曰比年一小聘三年一大聘按左𫝊文元年公孫敖如齊𫝊曰凡君即位卿出並聘謂已卿往聘他他卿來聘已云大國朝焉謂已是小國朝于大國小國聘焉謂已是大國聘於小國周禮纂訓卷二十
