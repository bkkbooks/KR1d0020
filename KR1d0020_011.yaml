body:
  text: 周禮纂訓卷十一安溪李鍾倫撰天府掌祖廟之守藏與其禁令注始祖后稷之廟其寶物世傳守之若魯寶玉大弓者疏始祖之廟以其最尊故寶物藏焉凡國之玉鎮大寶器藏焉若有大祭大喪則出而陳之既事藏之注玉鎮大寶器玉瑞玉器之美者禘祫及大喪陳之以華國也疏玉瑞玉器典瑞掌之其美者别入天府玉瑞鎮圭之屬玉器蒼璧禮天之屬訓此蓋不徒寶玩之物皆先世所藏之重器也以為玉瑞玉器之美者恐非鎮亦非鎮圭也凡官府鄉州及都鄙之治中受而藏之以詔王察羣吏之治注治中謂治職簿書之要訓治尚其中故簿書以治中為名上春釁寶鎮及寶器注上春孟春也釁謂殺牲以血血之凡吉凶之事祖廟之中沃盥執燭注吉事四時祭也凶事后王喪朝于祖廟之奠疏此謂在祖廟中有事夙興沃盥則天府執燭為明其餘祭祀非祖廟事則不與執燭也凶事朝于祖廟者將葬朝六廟後乃朝祖廟祖廟中日側為祖奠厥明將去為大遣奠皆有沃盥之事季冬陳玉以貞來嵗之媺惡注問事之正曰貞問嵗之媺惡謂問於龜太卜職大貞之屬陳玉陳禮神之玉龜有天地四方則玉有六器與言陳者既事藏之不必貍之也若遷寶則奉之疏謂王者遷都則寶亦遷若祭天之司民司祿而獻民數榖數則受而藏之注司民軒轅角也司祿文昌第六星或曰下能也祿之言榖也年榖登乃後制祿祭此二星者以孟冬既祭之而上民榖之數於天府疏此謂主民之吏及孟冬獻民數榖數小司冦受而獻之於王王登之於天府云司民軒轅角者軒轅十七星有兩角角有大民小民文昌有六星第一上將第二次將第三貴相第四司命第五司中第六司祿第曰下能者石氏星𫝊云上能司命為大尉中能司中為司徒下能司祿為司冦二處並有司祿也典瑞掌玉瑞玉器之藏辨其名物與其用事設其服飾注人執以見曰瑞禮神曰器瑞符信也服飾服玉之飾謂繅藉王晉大圭執鎮圭繅藉五采五就以朝日注繅有五采文所以薦玉木為中幹用韋衣而畫之就成也朝日者天子常春分朝日秋分夕月鄭司農云晉讀為搢紳之搢謂插於紳帶之間若帶劍也五就五匝也一匝為一就疏繅者雜采之名云木為中幹者用木版廣長與玉同然後以韋衣而畫之云搢紳者搢笏於紳亦在紳帶之間也凡帶有二大帶即紳也大夫以上用素士用練又有革帶所以佩玉插笏者插於紳之外革之內故云紳帶之間云若帶劍者劍亦在紳帶之間也云五就五匝者一采為一匝下云二采一就者據臣行聘不得與君同是以二采采為一行二行合為一就也訓按但言朝言以重言其餘祭祀可推若見諸侯則執瑁四寸也公執桓圭侯執信圭伯執躬圭繅皆三采三就子執榖璧男執蒲璧繅皆二采再就以朝覲宗遇會同于王信音身注三采朱白蒼二采朱緑也諸侯相見亦如之疏諸侯世相朝瑑圭璋璧琮繅皆二采一就以俯聘瑑音篆持兖切俯他弔反注璋以聘后夫人以琮享之也大夫衆來曰俯寡來曰聘瑑有折鄂瑑起疏此遣臣行聘問之所執者無桓信躬蒲榖之丈但瑑之而已遣臣聘法有聘天子有自相聘故兼言后夫人也圭以聘天子與諸侯而璧享之璋以聘后夫人而琮享之鄭以聘后夫人文隱故特言之也然子男之臣不得過本君用以圭璋則亦但用瑑璧琮而已訓注云瑑有圻鄂瑑起者於玉上刻為界線若篆文然也四圭有邸以祀天旅上帝邸丁禮反又音帝注於中央為璧圭著其四面一玉俱成爾雅曰邸本也圭本著于璧四圭有邸圭末四出也祀天夏正郊天也上帝五帝大宗伯職曰國有大故則旅上帝及四望疏有故而祭曰旅用玉與郊天同案宗伯青圭之等據常祭而言皆謂五方天帝兩圭有邸以祀地旅四望注兩圭僢而同邸疏僢謂兩足相向訓四圭兩圭其邸吳氏以為即蒼璧黃琮也祀天謂圜丘及祈榖上帝則五帝祀地謂方丘社稷蓋無禮神之玉四望家君子以為日月星辰然與地祗玉同者蓋有故而旅禮變常也下文圭璧以祀日月星辰則正祭所用矣祼圭有瓚以肆先王以祼賔客肆如字又他厯反注於圭頭為器可以挹鬯謂之瓚國語謂之鬯圭肆先王肆解牲體以祭因以為名爵行曰祼漢禮瓚槃大五升口徑八寸下有盤口徑一寸疏肆先王宗伯六享皆是祼賓客則上公再祼侯伯一祼之屬圭璧以祀日月星辰注圭其邸為璧取殺於上帝疏上文四圭兩圭及下璋邸鄭皆以邸為璧此圭璧不言邸故鄭還以邸解璧也璋邸射以祀山川以造贈賔客射食亦反注璋有邸而射取殺於四望射剡也土圭以致四時日月封國則以土地注以致四時日月度其景至不至以知其行得失也冬夏以致日春秋以致月土地猶度地也封諸侯以土圭度日景觀分寸長短以制其域所封也訓土圭說具司徒篇致至也土圭所以致日而得節氣之極節氣正而晦朔寒暑無不定矣故曰以致四時日月封國土地亦見司徒建邦國章曰以土圭土其地而制其域然亦大率之辭尺五寸之景南北有異而東西不差蓋度地則有度地之法如王制司空是也土圭蓋所執符信以往封國者且以此上下所言合之大抵皆符信之類珍圭以徴守以恤凶荒珍杜子春云當為鎮注珍圭王使之瑞節制大小當與琬琰相依王使人徴諸侯憂凶荒之國則授之執以往致王命如今使者持節矣恤者闓府庫振救之凡瑞節歸又執以反命疏案玉人職琬圭九寸珍圭不言故鄭約與琬琰相依牙璋以起軍旅以治兵守注牙璋瑑以為牙亦王使之瑞節兵守用兵所守若齊人戍遂諸侯戍周疏案玉人有牙璋中璋此云牙璋蓋亦兼之中璋比于牙璋但無文飾然則大軍旅當用牙璋小軍旅用中璋也璧羡以起度注羡長也此璧徑長尺以起度量其廣徑蓋八寸疏案爾雅肉倍好謂之璧則璧體圓矣今云璧羡是為長意云長尺廣八寸者蓋璧本徑九寸今言羡是减傍一寸以益上下駔圭璋璧琮琥璜之渠眉疏璧琮以斂尸駔音祖廣韻音粗徂古切斂力驗反注以斂尸者於大斂焉加之也駔與組同聲之誤也渠眉玉飾之溝瑑也以組穿聮六玉溝瑑之中以斂尸圭在左璋在首琥在右璜在足璧在背琮在腹疏璧琮者通於天地疏六玉與王為飾皆在衣裳之外故知在大斂後也云渠眉玉飾之溝瑑者此六玉兩頭皆有孔又於兩孔之間為溝渠於溝之兩畔稍髙為眉瑑也云圭在左以下約大宗伯青圭禮東方之等以尸南首置此六玉焉疏璧琮者蓋謂璧琮中央皆有孔所以逹天地之氣與榖圭以和難以聘女難乃旦反注榖圭亦王使瑞節榖善也其飾若粟文然難仇讐和之者若春秋宣公及齊侯平莒及郯其聘女則以納徴焉疏昏禮有六五禮用鴈納徴不用鴈以其有束帛可執媒氏職庶民用緇帛五兩士昏禮用三𤣥二纁天子加榖圭諸侯加大璋大夫與士同納徴春秋謂之納幣琬圭以治德以結好注琬圭無鋒芒亦王使瑞節諸侯有德王命賜之及諸侯使大夫來聘既而為壇㑹之使大夫執以命事焉大行人職曰時聘以結諸侯之好疏時聘使大夫來王還使大夫往㑹焉琰圭以易行以除慝注琰圭有鋒芒亦王使瑞節易行易惡行令為善除慝謂於諸侯使大夫來俯既而使大夫執而命事於壇大行人職殷俯以除邦國之慝疏治德易行是諸侯自有善行惡行王使人就本國治易之結好除慝皆諸侯使大夫來而王亦使大夫為壇命之也大祭祀大旅凡賔客之事共其玉器而奉之注此結璋邸射以上大喪共飯玉含玉贈玉飯扶晚反含户暗反注飯玉碎玉以雜米也含玉柱左右及在口中者雜記曰含者執璧則是璧形而小耳贈玉蓋璧也贈有束帛六幣璧以帛疏此不見后世子大喪中兼之雜記天子飯九貝諸侯七大夫五士三鄭云同用貝者夏時禮周時天子諸侯用玉含玉案士喪禮用三然則天子用九諸侯用七大夫用五若然大夫以上不徒柱左右與中央也贈玉者案既夕禮棺入坎贈用𤣥纁束帛明天子加以玉案玉府已云共含玉此又言者玉府主作之此官主其成事而共之也訓此非玉器故别言之凡玉器出則共奉之注玉器出謂王所好賜也奉之送以往逺則送於使者疏逺則送於使者謂王遣使就國賜之典命掌諸侯之五儀諸臣之五等之命注五儀公侯伯子男之儀五等謂孤以下四命三命再命一命不命也或言儀或言命互文也疏此諸臣在諸侯下據諸侯之臣而言上公九命為伯其國家宫室車旗衣服禮儀皆以九為節侯伯七命其國家宫室車旗衣服禮儀皆以七為節子男五命其國家宫室車旗衣服禮儀皆以五為節注上公謂王之三公有德者加命為二伯二王之後亦為上公國家國之所居謂城方也公之城蓋方九里宫方九百步侯伯城蓋方七里宫方七百步子男城蓋方五里宫方五百步大行人職則有諸侯圭藉冕服建常樊纓二車介牢禮朝位之數焉疏云公之城蓋方九里云云則天子城方十二里也匠人營國方九里據夏殷異代法王之三公八命其卿六命其大夫四命及其出封皆加一等其國家宫室車旗衣服禮儀亦如之注四命中下大夫也出封出畿內封於八州之中加一等褒有德也其在朝廷則亦如命數耳王之上士三命中士再命下士一命疏云四命中下大夫者序官惟有中下大夫也凡諸侯之適子誓於天子攝其君則下其君之禮一等未誓則以皮帛繼子男注誓猶命也言誓者天子命為之嗣樹子不易也公之子如侯伯而執圭侯伯之子如子男而執璧子男之子與未誓者皆次小國之君執皮帛而朝㑹焉其賓之皆以上卿之禮疏云賓之以上卿之禮者據春秋曹世子射姑來朝賓之以上卿是擯介依諸侯法其饔餼饗一與卿同也公之孤四命以皮帛視小國之君其卿三命其大夫再命其士一命其宫室車旗衣服禮儀各視其命之數侯伯之卿大夫亦如之子男之卿再命其大夫一命其士不命其宫室車旗衣服禮儀各視其命之數注視小國之君者列於卿大夫之位而禮如子男也九命上公得置孤卿一人春秋傳列國之卿當小國之君固周制也王制曰大國三卿皆命於天子下大夫五人上士二十七人次國三卿二卿命於天子一卿命於其君下大夫五人上士二十七人小國二卿皆命於其君下大夫五人上士二十七人疏孤執皮帛者既聘饗更自以其贄見若正聘當以圭璋也引春秋傳者孤亦得名卿故匠人云九卿朝焉是六卿與三孤為九卿以其命數同也王制所云據夏殷法大國三卿上卿則天子三命中卿天子再命己君一命下卿天子一命己君一命在周則己君加二命為三命也次國三卿上卿天子二命中卿天子一命己君一命下卿天子不命己君二命故云一卿命於其君周則次國卿竝三命與大國同云小國二卿者文誤實亦三卿一卿受天子一命二卿受己君一命周則一卿受天子一命己君一命其二卿竝受己君二命下大夫五人不著命數夏殷時竝不得天子命但己君加一命周則大國次國之大夫再命小國之大夫一命士在夏殷時竝皆不命周則大國次國之士一命小國之士不命也諸侯之大夫一命已上可有二車士雖一命亦無二車天子之士再命已上可有二車也訓案王制次國之上卿位當大國之中云云是大國次國小國竝有三卿故鄭氏謂小國二卿之文疑有脫誤以此也又上中下三卿位次不同則命亦當有異故疏分别三卿命數亦據此文而己又知夏殷之士不命者據大國之卿不過三命下卿再命小國之卿與下大夫一命不著士命數又大夫既一命士當降大夫不命也然典命新掌應是天子之命則此經諸侯之臣自一命已上者皆謂命於天子者也姑詳之司服掌王之吉凶衣服辨其名物與其用事注用事祭祀視朝甸凶弔之事王之吉服祀昊天上帝則服大裘而冕祀五帝亦如之享先王則袞冕享先公饗射則鷩冕祀四望山川則毳冕祭社稷五祀則希冕祭羣小祀則𤣥冕鷩音鱉并列切又必滅反劉府弊反毳昌鋭反劉清嵗反注先公謂后稷之後太王之前不窟至諸盩饗射饗食賓客與諸侯射也羣小祀林澤墳衍四方百物之屬大裘羔裘也衮卷龍衣也書曰豫欲觀古人之象日月星辰山龍華蟲作繢宗彝藻火粉米黼黻希繡此古先王冕服十二章王者相變至周而以日月星辰畫於旌旗所謂三辰旗旗昭其明也而冕服九章登龍於山登火於宗彝尊其神明也九章初一曰龍次二曰山次三曰華蟲次四曰火次五曰宗彝皆畫以為繢次六曰藻次七曰粉米次八曰黼次九曰黻皆希以為繡則衮之衣五章裳四章凡九也鷩畫以雉謂華蟲也其衣三章裳四章凡七也毳畫虎蜼謂宗彝也其衣三章裳二章凡五也希刺粉米無畫也其衣一章裳二章凡三也𤣥者衣無文裳𤣥黼而已凡冕服皆𤣥衣纁裳疏云饗食賓客者即大行人三饗三食之等云與諸侯射者此大射在西郊虞庠中若燕射在寢則朝服若賔射在朝則皮辨服云羣小祀林澤墳衍四方百物者此地之小祀若天之小祀風師雨師等亦是宗彝是宗廟彝尊非蟲獸之號而言宗彝者以虎蜼畫於宗彝因號虎蜼為宗彝也黼以白黑為斧文近刃白近上黑黼以黑與青畫兩已相背云希刺粉米無畫者衣是陽陽至輕浮畫亦輕浮故衣畫裳繡但粉米不可畫雖在衣亦刺之然則毳冕之粉米亦刺之也知𤣥衣纁裳者見易繫垂衣裳蓋取諸乾坤乾天色𤣥坤地色黃土位託於南方火赤色赤與黃為纁也訓大裘冕無旒衮冕十二旒鷩冕九旒毳冕五旒絺冕五旒𤣥冕三旒凡兵事韋辨服注韋辨以韎韋為辨又以為衣裳疏韎是舊染謂赤色以赤色韋為辨案聘禮卿韋辨歸饔餼注云韎布為衣而素裳非兵事故變用韎布為衣而素裳也視朝則皮辨服注視朝視內外朝之事皮辨之服十五升白布衣積素以為裳王受諸侯朝覲於廟則衮冕疏天子三朝皆用皮辨云受朝覲於廟則衮冕者春夏受贄在朝則是視朝皮辨服也其受享於廟與覲同衮冕故于廟連言朝也凡甸冠辨服甸音田注甸田獵也冠辨委貌其服緇布衣亦積素以為裳諸侯以為視朝之服王卒食而居則𤣥端疏委貌以色言則曰𤣥冠云諸侯視朝之服者玉藻天子𤣥冕以視朔皮辨以日視朝諸侯皮辨以視朔朝服以日視朝是也云王卒食則𤣥端者𤣥端與朝服但異其裳朝服素裳𤣥端之裳君朱大夫素上士𤣥裳中士黃裳下士雜裳凡凶事服辨服注服辨喪冠也其服斬衰齊衰疏天子諸侯絶傍期正統之期猶不降故兼云齊衰其正服大功亦似不降故大功章適婦注云適子之婦𫝊曰何以大功也不降其適也既無所指斥眀關之天子諸侯也又服問云君所主夫人妻太子嫡婦既言君所主明服不降也如是則嫡孫婦又當小功今注只云斬衰齊衰者舉重言然則王為適子斬衰為適孫適曽孫適𤣥孫孫來孫則皆齊衰不杖禮適孫𫝊曰何以期也不敢降其適也有適子者無適孫孫婦亦如之又喪服𫝊始封之君不臣諸父昆弟封君之子不臣諸父而臣昆弟天子義亦當然若庶人起為天子蓋亦不臣諸父昆弟而有服也凡弔事辨絰服注辨絰者如爵辨而素加環絰絰大如緦之絰其服錫衰緦衰疑衰諸侯及卿大夫亦以錫衰為弔服喪服小記曰諸侯弔必皮辨錫衰則變其冠耳喪服舊說以為士弔服素委貌冠朝服此近庶人弔服而衣猶非也士當事辨絰疑衰變其裳以素耳國君於其臣辨絰他國之臣則皮辨大夫士有朋友之恩亦辨絰疏云辨絰如爵辨者爵辨之形以木為體廣八寸長尺六寸以三十升布染為爵頭色辨絰亦然但不用爵色布而用素耳云環絰者五服之絰皆兩股絞之今環絰只以一股麻為體糾而橫纒之如環然云如緦之絰者五服絰惟緦最小弔服絰亦如之云諸侯及卿大夫亦以錫衰為弔服者案服問云君為卿大夫錫衰當事則辨絰大夫相為亦然引喪服小記諸侯弔必皮辨錫衰者不言君而言諸侯則是弔異國之臣法不著辨絰而變皮辨也引喪服舊說而破之者士與庶人弔服同冠辨則異庶人素冠委貌疑衰素裳士服亦同但冠皮辨之絰為異耳云國君於其臣辨絰者服問云當事辨絰是也云他國之臣則皮辨者喪服小記文是也云大夫士有朋友之恩亦辨絰者喪服記云朋友麻此謂大夫於士士自相於若大夫相於則不假朋友恩以服問云卿大夫相為錫衰辨絰不言朋友也天子弔服具於此下文矣諸侯弔服亦應三衰俱有據服問云為卿大夫錫衰又據文王世子注同姓之士緦衰異姓之士疑衰大夫以錫衰為弔服者以大夫雖已降服仍有小功降至緦麻則既不得以緦衰為弔疑衰亦不可為故以錫衰也士不用錫衰者避大夫用疑衰不用疑裳者避諸侯凡弔服皆施於小斂後既葬除之凡喪為天王斬衰為王后齊衰注王后諸侯為之不杖期疏此謂諸侯諸臣皆為王與后服也諸臣亦為后期鄭獨言諸侯者明諸臣亦同其卿大夫適子為君夫人亦與諸臣同諸侯世子不為天子服服問注云逺嫌也與畿外之民同服士之子賤無服當從庶人禮王為三公六卿錫衰為諸侯緦衰為大夫士疑衰其首服皆辨絰注君為臣服弔服也錫麻之滑易者十五升去其半有事其布無事其縷緦亦十五升去其半有事其縷無事其布疑衰十四升衰無事其縷衰在內無事其布衰在外疑之言擬也擬於吉疏君為臣服弔服者君於臣無服直弔服既葬除之而已布八十縷為升十五升千二百縷去其半則六百縷有事其布有事其縷皆謂以水濯治去其垢也凡婦人弔服與夫同其首服即喪服注云吉笄無首素總是也大札大荒大烖素服注大札疫病也大荒飢饉大烖水火為害君臣素服縞冠若晉伯宗哭梁山之崩公之服自衮冕而下如王之服侯伯之服自鷩冕而下如公之服子男之服自毳冕而下如侯伯之服孤之服自希冕而下如子男之服卿大夫之服自𤣥冕而下如孤之服其凶服加以大功小功士之服自皮辨而下如大夫之服其凶服亦如之其齊服有𤣥端素端齊側皆反注自公之衮冕至卿大夫之𤣥冕皆其朝聘天子及助祭之服諸侯非二王後其餘皆𤣥冕而祭於己雜記曰大夫冕而祭於公辨而祭於己士辨而祭於公冠而祭於己大夫爵辨自祭家廟唯孤爾其餘皆𤣥冠與士同𤣥冠自祭其廟者其服朝服𤣥端諸侯自相朝聘皆皮辨服此天子日視朝之服喪服天子諸侯齊斬而已卿大夫加以大功小功士亦如之又加緦焉士齊有素端者亦為札荒有所禱請變素服言素端者眀異制端者取其正也士之衣袂皆二尺二寸而屬幅是廣袤等也其袪尺二寸大夫以上侈之侈之蓋半而益一焉半而益一則其袂三尺三寸袪尺八寸疏此陳諸侯及其臣之服貴賤不同上得兼下下不得僭上大夫云凶服加以大功小功者天子諸侯自旁期以下皆絶而不為服大夫為本服大功小功者其服降一等小功降服緦緦則降而無服士助祭服爵辨不言者爵辨服惟承天變時及天子哭諸侯服之所服非常故列天子吉服不言之但皮辨亦是士助君視朔之服也鄭知諸侯非二王後皆𤣥冕而祭於己者按玉藻云諸侯𤣥冕以祭惟二王後及魯得與天子同然惟祭受命王得用兖冕其餘廟亦用𤣥冕故眀堂之以禘禮祀周公於太廟是也云𤣥冠自祭其廟服用朝服𤣥端者朝服據少牢大夫禮𤣥端據特牲士禮云諸侯自相朝聘則皮辨服者見聘禮主君及賓皆皮辨明朝禮亦皮辨可知云士之衣袂皆二尺二寸而屬幅是廣袤等者衣謂袂中是𤣥端之身長二尺二寸兩邉各屬一幅幅長二尺二寸上下亦廣二尺二寸故云廣袤等袤長也云大夫以上侈之侈大也訓袂袖也袪袖口也衣身也袂與衣相從袂侈則衣亦如之凡大祭祀大賔客共其衣服而奉之注奉猶送也送之於王所大喪共其復衣服斂衣服奠衣服廞衣服皆掌其陳序斂力驗反廞虛今反注奠衣服今坐上魂衣也廞衣服所藏於槨中疏復衣服案雜記云復天子十二人諸侯九人七人五人大夫士亦依命數人執一領天子衮冕已下上公亦皆用助祭上服斂衣服者小斂皆同十九稱大斂則士三十稱大夫五十稱諸侯皆百稱天子蓋百二十稱案下守祧掌遺衣服鄭云大斂之餘至祭祀時則出而陳於坐上即此奠衣服也廞衣服則明器之衣服是也典祀掌外祀之兆守皆有域掌其禁令注外祀謂所祀於四郊者疏掌其禁令者謂遮列不得有人來入域中若以時祭祀則帥其屬而修除徴役于司𨽻而役之注其屬胥徒也修除芟掃之徴召也及祭帥其屬而守其厲禁而蹕之蹕音畢疏厲是遮列蹕是止行人守祧掌先王先公之廟祧其遺衣服藏焉注廟謂太祖之廟及三昭三穆遷主所藏曰祧先公之遷主藏於后稷之廟先王之遷主藏於文武之廟遺衣服大斂之餘也此王者之宫而有先公謂太王以前為諸侯疏案王肅之義二祧乃髙祖之父髙祖之祖皆次第而遷文武為祖宗不毁鄭義則以文武為二祧以其守祧有奄八人守七廟并姜嫄廟則足矣若益二祧則十廟矣奄八人何以配之云遺衣服大斂之餘者案士喪禮小斂十九稱不必盡服則小斂亦有餘衣必知據大斂者小斂之餘至大斂更用之大斂餘乃留之訓案廟者其總名祧則指遷主所藏也若將祭祀則各以其服授尸注尸當服卒者之上服以象生時疏凡尸皆服死者大斂遺衣其不服者以為奠衣服其廟則有司修除之其祧則守祧黝堊之黝於糾反司農音幽堊烏路反或烏洛反本或作惡同廣韻音惡烏各切注廟祭此廟也祧祭遷主有司宗伯也修除黝堊互言之有司恆主修除守祧恆主黝堊黝讀為幽幽黑也堊白也爾雅曰地謂之黝墻謂之堊疏云祧祭遷廟主者案司尊彝有追享注云追祭遷主謂禱祈是也既祭則藏其隋與其服隋音妥他果切又許恙反劉相恙反世婦掌女宫之宿戒及祭祀比其具注女宫刑女給宫中事者宿戒當給事豫告之齊戒也比次也具所濯溉及粢盛之㸑疏此世婦是宫卿之官云宿戒者祭前十日戒之使齊祭前三日又宿之詔王后之禮事注薦徹之節帥六宫之人共齍盛齍音咨注帥世婦女御疏云帥世婦女御者案世婦職帥女宫為齍盛女御職贊世婦是也相外內宗之禮事注同姓異姓之女有爵佐后者疏鄭以同姓異姓之女有爵解外內宗者案序官云內宗凡內女之有爵者外宗凡外女之有爵者故知之也知相是佐后者案外宗云佐后薦徹籩豆內宗云佐𫝊豆籩是外內宗佐后此官相之也大賓客之饗食亦如之注此帥詔相其事同疏此謂王同姓及二王之後來朝覲為賓客者王后亦有助王禮賓之法亦如之者總上所云比帥詔相也大喪比外內命婦之朝莫哭不敬者而苛罰之莫音暮苛胡何反注苛譴也疏王喪殯後有朝夕哭外命婦卿大夫妻內命婦九嬪以下凡王后有􅉔事於婦人則詔相􅉔古拜字注鄭司農云謂爵婦人𤣥謂拜拜謝之也喪大記曰夫人亦拜寄公夫人于堂上疏先鄭意不連上大喪為義謂天子命其臣后亦命其婦受爵命時有拜謝王后也後鄭則連上大喪是為大喪而拜故引喪大記諸侯禮為證主人拜寄公於門西夫人亦拜寄公于堂上明王喪世子拜二主後於堂下后亦拜二王后夫人於堂上故左𫝊皇武子對鄭伯曰宋於周為客天子有喪拜焉若然二王後夫人得有赴王喪者或家在畿內來歸寧值王喪則弔也凡內事有逹於外官者世婦掌之注主通之使相共授內宗掌宗廟之祭祀薦加豆籩注加爵之豆籩疏比謂尸既食后亞獻尸為加即醢人籩人加籩加豆是也訓此不言佐蓋內宗自薦之以其是同姓之婦獨言加豆籩者朝事饋食之豆籩后薦之內宗蓋佐之及以樂徹則佐𫝊豆籩𫝊直専反注佐𫝊佐外宗疏后於神徹𫝊與外宗外宗𫝊與內宗內宗𫝊與外者賓客之饗食亦如之王后有事則從大喪序哭者注次序外內宗及命婦哭王疏饗食俱在廟亦后徹外內宗佐𫝊哭諸侯亦如之凡卿大夫之喪掌其弔臨注王后弔臨諸侯而已是以言掌卿大夫云疏此諸侯來朝薨於王國王為之緦衰者也若檀弓以爵辨純衣哭諸侯謂薨於本國王遙哭之則婦人不哭之云掌卿大夫之弔臨者惟諸侯為賓王后弔臨卿大夫王后不弔遣內宗弔之喪大記諸侯夫人弔臨卿大夫諸侯臣少故也外宗掌宗廟之祭祀佐王后薦玉豆視豆籩及以樂徹亦如之注視其實疏凡王豆籩皆以玉飾之餘文不云玉者文略王后以樂羞齍則贊疏齍黍稷也黍稷言贊不言徹則后薦而不徹楚茨詩云諸宰君婦廢徹不遲則黍稷宰徹之凡王后之獻亦如之注獻酒於尸王后不與則贊宗伯注后有故不與祭宗伯攝其事疏祼獻豆籩簠簋等宗伯盡攝之小祭祀掌事賓客之事亦如之注小祭祀謂在宫中疏知在宫中者后無外事惟有宫中七祀又七祀中惟有門户竈其行中霤司命大厲是外神后亦不與大喪則叙外內朝莫哭者哭諸侯亦如之注內內外宗及外命婦疏云內外宗及外命婦者內中兼外宗外中不兼內命婦以其內命婦九嬪叙之冢人掌公墓之地辨其兆域而為之圖先王之葬居中以昭穆為左右注公君也圖謂畫其地形及丘壟所處而藏之先王造塋者昭居左穆居右夾處東西疏先王造塋者謂玉者有遷都之法所都而葬即是造塋者也凡諸侯居左右以前卿大夫士居後各以其族注子孫各就其所出王以尊卑處其前後而亦併昭穆疏此諸侯卿大夫士謂先王子孫為畿內諸侯王朝卿大夫士若出封畿外者則因彼國葬而為造塋之主云各以其族者謂次第假令同昭穆兄當近王墓弟則逺王墓鄭云併昭穆謂昭與昭併穆與穆併訓案下文墓大夫有國民族葬注以各從其親解之謂親者共為一所此族當亦如之蓋分封畿外則彼自造塋而各為祖今畿內之臣既同在先王墓左右之前後則不得自為塋域但親者相近為别耳凡死於兵者不入兆域注戰敗無勇投諸塋外以罰之凡有功者居前注居王墓之前處昭穆之中央疏此皆總上諸侯卿大夫士以爵等為丘封之度與其樹數注别尊卑也王公曰丘諸臣曰封漢律列侯墳髙四丈關內侯以下至庶人各有差疏别尊卑者尊者丘髙樹多卑者封下樹少云王公曰丘諸臣曰封者爾雅云土之髙者曰丘聚土曰封案春秋緯云天子墳髙三仞樹以松諸侯半之樹以柏大夫八尺樹以藥草士四尺樹以槐庶人無墳樹以楊柳王制又云庶人不封不樹春秋緯或說異代故鄭不引也大喪既有日請度甫竁遂為之尸度待洛反注甫始也請量度所始竁之處為尸者成葬為祭墓地之尸也鄭司農云既有日既有葬日也始竁時祭以告后土冢人為之尸疏冢人為尸據葬畢乃祭墓故小宗伯云成葬而祭墓為位先鄭意以始穿地時祭墓無此事故引之在下及竁以度為丘隧共喪之窆器窆彼驗反又補鄧反注隧羡道也度丘與羡道廣袤所至窆器下棺豐碑之屬喪大記曰凡封用綍去碑負引君封以衡大夫以咸疏天子有隧諸侯有羡道隧與羡道有異隧道上有負土羡道上無負土而鄭以隧即羡道者散文通豐碑斫大木為碑執紼者負紼背碑而下棺案喪大記注咸讀為緘棺束也君則橫木棺傍繫而下之大夫則繫于棺束而下之及葬言鸞車象人注鸞車巾車所飾遣車也亦設鸞旗言猶語也語之者告當行於是巾車行之孔子謂為芻靈者善謂為俑者不仁非作象人者不殆於用生乎疏遣車明器之車亦有和鸞旌旗天子九乘諸侯七乘大夫五乘及窆執斧以涖疏與鄉師兩官俱涖匠師遂入藏凶器注凶器眀器正墓位蹕墓域守墓禁注位謂丘封所居前後禁所為塋限訓此所謂王墓未及諸侯諸臣凡祭墓為尸注祭墓為尸或禱祈焉凡諸侯及諸臣葬于墓者授之兆為之蹕均其禁訓此蓋同姓者即上文居左右前後者也墓大夫掌凡邦墓之地域為之圖注凡邦中之墓地萬民所葬地令國民族葬而掌其禁令注各從其親疏族葬據五服之內親者共為一所而葬正其位掌其度數注位謂昭穆度數爵等之大小使皆有私地域注各有區域得以族葬使相容凡爭墓地者聽其獄訟帥其屬而巡墓厲居其中之室以守之注厲塋限遮列處居其中之室有官寺在墓中職喪掌諸侯之喪及卿大夫士凡有爵者之喪以國之喪禮涖其禁令序其事注國之喪禮喪服士喪既夕士虞今存者其餘則亡事謂小斂大斂葬也疏諸侯謂畿內王子母弟得稱諸侯者凡國有司以王命有事焉則詔贊主人注有事謂含襚贈賵之屬詔贊者以告主人佐其受之凡其喪祭詔其號治其禮注號告以牲號齍號之屬當以祝之疏喪祭餘文皆為虞此言凡者以喪中相對則虞為喪祭卒哭為吉祭若對二十八月為吉祭則祥禫已前皆喪祭也凡公有司之所共職喪令之趣其事注令令當共物者謂王遣使奉命有贈之物各從其官出職喪當催督也周禮纂訓卷十一
