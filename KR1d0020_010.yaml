body:
  text: 周禮纂訓卷十安溪李鍾倫撰小宗伯之職掌建國之神位右社稷左宗廟注庫門內雉門外之左右疏案匠人亦云左宗廟右社稷彼掌其營作此掌其成事位次耳丘氏曰右隂也地道尊右故社稷居之左陽也人道尚左故宗廟居之兆五帝於四郊四望四類亦如之注兆為壇之營域四望謂五嶽四鎮四竇四類謂兆日於東郊兆月與風師於西郊兆司中司命於南郊兆雨師於北郊疏知兆日於東郊兆月於西郊者祭義云大眀生於東月生於西知風師亦於西郊者秋氣之時萬物熛落由風故風亦於西郊也云兆司中司命於南郊者以其南方盛陽之方司中司命又是陽故司中司命在南郊也云兆雨師於北郊者雨是水宜在水位也訓周禮於天神言祀於地示言祭大司樂分樂而祀亦曰以祀四望若望為嶽竇則是地示當言祭不當言祀又此經四望四類為列皆是天神無緣有嶽竇在其中且嶽竇雖尊亦不應序在四類天神之上蓋鄭氏所解四類或即為四望與諸經所言望如魯有三望尚書舜典望于山川左傳楚昭王曰江漢睢漳楚之望也又爾雅云梁山晉望此皆無以天神言者然一經自有一經義例周禮眀于四望言祀而祀眀屬天神其不得以為嶽瀆昭昭矣類類上帝也四類謂類於四郊也類非常祀有故而祭焉肆師職云凡甸師類造上帝疏云四郊自有尋常兆域今戰訖而祭故須新為壇兆則四郊有類眀甚又經中言類之處多屬上帝而日月星辰風師雨師等祭名無稱類之文則亦未可以為信也然類禮行於上帝而在四望下者本非正祭以其禮依郊祀而為之故曰類耳兆山川丘陵墳衍各因其方疏案大司徒地有十等此不言林澤原隰亦順所在可知略不言也訓山川之中亦兼有嶽瀆焉嶽瀆山川之大者也自右社稷左宗廟至此皆建國之神位小宗伯掌之者指授其位次也列建國之神位而不言圜丘方丘者彼皆取丘之自然而不定其東西朔南之方故其位無常在耳掌五禮之禁令與其用等訓五禮吉凶軍賓嘉也其禁令與其用等謂下文所云也辨廟祧之昭穆注祧遷主所藏之廟自始祖後父曰昭子曰穆疏周以文武為二祧自文武後穆之主入文王祧昭之主入武王祧故遷主所藏之廟曰祧也諸侯無二祧謂始封大祖廟為祧故聘禮云不腆先君之祧是太祖廟為祧也辨吉凶之五服車旗宫室之禁訓案丘氏曰吉服九章七章五章三章一章也凶服斬衰齊衰錫衰緦衰疑衰也掌三族之别以辨親疏其正室皆謂之門子掌其政令注三族謂父子孫人屬之正名喪服小記曰親親以三為五以五為九正室適子也將代父當門者也政令謂役守之事毛六牲辨其名物而頒之于五官使共奉之注毛擇毛也鄭司農云司徒主牛宗伯主雞司馬主馬及羊司冦主犬司空主豕疏疏六官而云五者以其天官二王治事尊而不使奉牲也辨六齍之名物與其用使六宫之人共奉之注齍讀為粢六粢謂六榖黍稷稻粱麥苽疏使六宫之人共奉之謂若世婦職女宫之宿戒也辨六彝之名物以待果將注六彝雞彝鳥彝斝彝黃彝虎彝蜼彝辨六尊之名物以待祭祀賓客注鄭司農云六尊獻尊象尊壺尊著尊大尊山尊疏案司尊彝唯為祭祀陳六彝六尊不見為賓客陳六尊此兼言賓客則在廟饗賓客時陳六尊亦依祭禮四時所用唯在野外饗不用祭祀之尊故春秋傳云犧象不出門也又案鬱人云掌祼器凡祭祀賔客之祼事則上六彝亦為祭祀賓客而辨之而不言祭祀賓客者舉下以眀上故略而不言掌衣服車旗宫室之賞賜注王以賞賜有功者書曰車服以庸疏衣服謂若司服衮冕以下惟有大裘不可賞賜是以魯祭天用衮冕則二王後祭天亦不得用大裘也云車旗者謂若巾車金路及夏以下亦得依所乘者賜之唯玉路不得賜是以魯用殷之大路也掌四時祭祀之序事與其禮訓祭祀之序事謂事有先後蓋薦腥薦熟之次序也禮謂玉帛牲牷各有隆殺故肆師職云掌立國祀之禮立大祀用玉帛牲牲立次祀用牲幣立小祀用牲是也自辨廟祧之昭穆至此皆所謂五禮之禁令與其用等是故昭穆之辨吉凶之制尊卑之等親疏之殺此禮自上逹下者也牲粢之用尊彝之器賞賜之度祭祀之事此禮之行於朝家者也五禮其猶經與禁令與用等則其緯也蓋小宗伯之職所以二大宗伯故大宗伯首言天神人鬼地示之禮小宗伯則首列建國之神位大宗伯掌五禮而為之綱小宗伯則掌其禁令與其用等而為之目故其職事相成如此若國大貞則奉玉帛以詔號注號神號幣號鄭司農云大貞謂卜立君卜大封大祭祀省牲視滌濯祭之日逆齍省鑊告時于王告備于王注逆齍受饎人之盛以入省鑊視烹腥熟時薦陳之早晚備謂饌具疏此云省牲視滌濯省鑊與大宗伯文同謂佐大宗伯其告時告備是其専職耳鄭知齍受饎人之盛以入者案少牢饎釁在廟門之外眀天子諸侯饎釁亦在廟門外今言逆齍眀於廟門之外迎入向廟堂東實之以簠簋也云省鑊視烹腥熟者此謂祭宗廟朝踐饋獻節更有室中饋熟亦須鑊鄭不言略也凡祭祀賓客以時將瓚祼注將送也猶奉也祭祀以時奉而授王賓客以時奉而授宗伯天子圭瓚諸侯璋瓚疏案少宰職云凡祭祀贊祼將之事此小宗伯又奉而授王者此據受王彼少宰據授尸謂瓚既在王手少宰乃贊王授尸云諸侯用璋瓚者此謂未得圭瓚之賜者祭義云君用圭瓚灌尸大宗用璋瓚亞灌若然天子用圭瓚則后亦用璋瓚亞灌也其諸侯未得圭瓚者君與夫人同用璋瓚也詔相祭祀之小禮凡大禮佐大宗伯注小禮羣臣之禮疏此經未至職未輒言此者此以下皆小宗伯専行事不佐大宗伯故言此以結上也賜卿大夫士爵則儐注賜猶命也儐之如命諸侯之儀疏諸侯尊故大宗伯儐卿大夫士卑故小宗伯儐小祭祀掌事如大宗伯之禮大賓客受其將幣之齎齎子兮反本又作賫疏此謂諸侯來朝覲禮畢每國於廟貢國所有行三享禮以玉幣致享既訖其庭實之物則小宗伯受之以東也若大師則帥有司而立軍社奉主車注有司大祝也王出軍必先有事於社及遷廟而以其主行社主曰軍社遷主曰祖春秋傳曰軍行祓社釁鼓祝奉以從曽子問曰天子巡守以遷廟主行載于齊車言必有尊也書曰用命賞于祖不用命戮于社社之主蓋用石為之疏云帥有司立軍社奉主車者謂小宗伯帥有司大祝立軍社載於齊車以行遷主亦載于齊車以行也若軍將有事則與祭有司將事于四望與音預注軍將有事謂將與敵合戰也與祭有司謂大祝之屬蓋司馬之官實典焉若大甸則帥有司而饁獸于郊遂頒禽甸音田饁于輒反劉于法反注有司大司馬之屬饁饋也以禽饋四方之神於郊郊有羣神之兆頒禽謂以豫羣臣詩傳曰禽雖多擇取三十焉其餘以豫大夫士以習射於澤宫而分之疏云郊有羣神之兆者上文兆五帝於四郊四類四望亦如之兆山川丘陵墳衍各因其方是羣臣之兆也大災及執事禱祠于上下神示注執事大祝及男巫女巫也求福曰禱得求曰祠鄭司農云小宗伯與執事共禱祠訓自大師則帥有司而立軍社至此是尋常祭祀之外又有此司甸及大災等祭祀也王崩大肆以秬鬯渳渳杜子春讀為泯亡恐反李亡辨反廣韻音瀰綿婢切注大肆始陳尸伸之丘氏曰渳浴也以秬鬯浴尸疏太祝小祝已掌此渳尸之事小宗伯察其不如儀也及執事涖大斂小斂帥異族而佐注執事大祝之屬涖臨也親斂者蓋事官之屬為之喪大記曰小斂衣十九稱君大夫士一也大斂君百稱大夫五十稱士三十稱異族佐斂疏者可以相助疏大斂五等諸侯同百稱天子蓋百二十稱也天子大夫士約與諸侯之卿大夫士同以其執贄同故祿與廟數襲斂亦無嫌也縣衰冠之式于路門之外縣音玄衰七雷反注制色宜齊同及執事視葬獻器遂哭之注執事蓋梓匠之屬至將葬獻眀器之材又獻素獻成皆於殯門外王不親哭有官代之疏此謂既殯之後事故檀弓云既殯旬而布材與眀器卜葬兆甫竁亦如之竁鄭音穿李依杜昌鋭反廣韻音毳此芮切注兆墓塋域甫始也既葬詔相喪祭之禮注喪祭虞祔也疏士之禮葬用柔日如丁日葬葬日第一虞隔戊日已日第二虞後虞改用剛用庚日卒哭亦用剛用壬日為卒哭祭祔祭又用柔用癸日為祔祭是士從始虞至祔祭總用七日以此差之大夫五虞諸侯七虞天子九虞相次日數可知耳成葬而祭墓為位注成葬丘已封也天子之冢蓋不一日而畢位壇位也先祖形體託於此地祀其神以安之冢人職曰大喪既有日請度甫竁遂為之尸疏云成葬者謂造丘墳已訖以王之靈柩造於此土故祭后土之神使安祐之當設位于墓左也注云天子之冢蓋不一日而畢者案檀弓云有司以几筵舍奠于墓左反日中而虞注云使奠墓有司來歸乃虞也則虞祭在奠墓後此上文既云詔相喪祭則虞祭訖矣於下乃云成葬祭墓為位則虞祭不待奠墓有司來歸者由天子之冢髙大蓋不一日而畢故喪祭在成葬之上也凡王之會同軍旅甸役之禱祠肄業為位國有禍災則亦如之凡天地之大災類社稷宗廟則為位肄以志反習也廣韻音勩沈音四注禱祈禮輕類者依其正禮而為之疏天災為日月食星辰奔隕地災謂震裂訓上文大師大甸大災等其祭禱之事已具矣此又重見者上文是帥有司及執事之屬共為之此言肄儀為位則小宗伯獨主其事也凡國之大禮佐大宗伯凡小禮掌事如大宗伯之儀疏凡言大禮者王親為之小禮者羣臣攝而為之訓通結上文自大祭祀省牲以下是佐大宗伯之事自賜卿大夫士以下是小宗伯掌事之事肆師之職掌立國祀之禮以佐大宗伯立大祀用玉帛牲牷立次祀用牲幣立小祀用牲牷音全注鄭司農云大祀天地次祀日月星辰小祀司命以下玄謂大祀又有宗廟次祀又有社稷五祀五嶽小祀又有司中風師雨師山川百物疏後鄭直云大祀又有宗廟更不言宗廟次小祀者宗廟次祀即先公是也不言之者已於酒正云次祀鷩冕毳冕所祭已具於彼故也宗廟小祀其神不眀馬君雖云宗廟小祀殤與無後無明文故後鄭亦不言也經言立大祀用玉帛牲牷天神中非直有升煙玉帛牲亦有禮神者也地示中非直瘞埋中有玉帛牲亦兼有禮神玉帛牲也宗廟無煙瘞埋真有禮神幣牲又不見有禮神之玉或可以灌圭為禮神之玉也訓宗廟中享先王及享先公同有牲幣同用灌圭其所異者冕服耳非如天神地示中分别大次祀其玉帛牲牷等殺頓殊也以嵗時序其祭祀及其祈珥珥而志反注序第次其先後大小祈當為禨珥當為衈禨衈釁禮之事雜記曰成廟則釁之雍人舉羊升屋自中中屋南面刲羊血流于前乃降門夾室皆用雞其衈皆於屋下割雞門當門夾室中室然則是禨謂羊血也小子職曰掌珥於社稷祈于五祀是也亦謂其宫兆始成是也春秋僖十九年夏邾人執鄫子用之傳曰用之者何蓋叩其鼻以衈社也疏云第次其先後者不必先大後小天地人之鬼神各有大次小或小而應先或大而應後各自當其時以祭之用毛牲即曰刉用羽牲即曰衈訓案秋官士師職云凡刉衈則奉犬牲此刉衈正字也大祭祀展犧牲繫于牢頒于職人職劉之弋反戚音弋注展省閲也此職人謂充人及監門人疏將有天地宗廟大祭祀牧人以牲與充人之時肆師省閲其牲看完否及色堪為祭牲乃繫于牢頒付于職人也云職人謂充人及監門人者案充人云祀五帝則繫于牢芻之三月凡散祭祀之牲繫于國門使養之凡祭祀之卜日宿為期詔相其禮視滌濯亦如之注宿先卜祭之夕疏云詔相其禮者謂肆師詔告相助其卜之威儀及齋戒之禮云視滌濯亦如之亦詔相其禮也祭之日表齍盛告潔展器陳告備及果築煮相治小禮誅其慢怠者果古亂反煮音煮相息亮反注粢六榖也在器曰盛陳陳列也果築煮者所築煮以果也故書表為剽剽表皆謂徽識也鄭司農云築煮築香草煮以為鬯疏六齍之上皆為徽識小旌書其黍稷之名以表之餘饌不表獨此表之者以其餘器所乘各異覩器則知其實此六榖者簠盛稻粱簋盛黍稷皆有盒蓋覆之覩器不知其實特須表顯之但鬱人自掌鬱此又掌之者彼官正職此肆師察其不如儀者也云相治小禮者謂羣臣行事則肆師相治之掌兆中廟中之禁令凡祭祀禮成則告事畢疏案小宗伯兆五帝於四郊已下神兆多矣皆掌不得使人干犯神位七廟亦然大賓客涖筵几築煮贊果將注酌鬱鬯授大宗伯載祼疏案小宰亦云賓客贊祼者容有故相代也大朝覲佐儐泩為承儐疏此謂大會同朝覲時若四時常朝則小行人為承儐共設匪甕之禮甕於貢反注設於賔客之館公食大夫禮曰若不親食使大夫以侑幣致之豆實實于甕簋實實于筐匪其筐字之誤與禮不親饗則以酬幣致之或者匪以致饗疏肆師不掌飲食而共設者肆師主禮事謂依禮使掌客之等及諸官設之也鄭知設於賔客之館者饗食在廟其器不用匪甕今言共設匪甕明是王不親饗於賓館設之可知云或匪以致饗者鄭君向引公食大夫破匪從筐又言饗禮者饗禮亡無妨致饗時用匪不同筐但無正文故或以疑之饗食授祭注授賓祭肺疏案膳夫云授王祭則此非授王可知知祭肺者有虞氏祭首夏后氏祭心殷祭肝周祭肺與祝侯禳于疆及郊注侯禳小祝職也疆五百里逺郊百里近郊五十里疏侯者候迎善祥禳者禳去殃氣大喪大渳以鬯則築煮令外內命婦序哭疏哭法以服之輕重為先後則內命婦為王斬衰居前諸臣之妻從服齊衰者居後也禁外內命男女之衰不中法者且授之杖注外命男六卿以出也內命男朝廷鄉大夫士也其妻為外命女喪服為夫之君齊衰不杖內命女王之三夫人以下不中法違升數與裁制者鄭司農云三日授子杖五日授大夫杖七日授士杖此舊説也喪大記曰君之喪三日子夫人杖五日既殯授大夫世婦杖無七日授士杖文玄謂授杖日數王喪依諸侯與七日授士杖四制云疏云且授之杖者外內命男及內命女皆為王斬衰者有杖授之其外命女為王齊衰無杖故云且也注云三夫人以下者通九嬪至八十一御妻也云王喪依諸侯者王喪諸臣等無授杖之日數以諸侯之臣與王之臣同斬衰杖竹故授杖日數亦宜同也訓外內命女即上文外內命婦也凡師甸用牲于社宗則為位甸音田注社軍社也宗遷主也訓小宗伯掌几軍旅甸役之禱祠肄儀為位則此與下文類造上帝封于大神祭兵于山川皆肆師贊小宗伯為位也類造上帝封于大神祭兵于山川亦如之造七報反注造猶即也為兆以類禮即祭上帝也類禮依郊祀而為之者封謂壇也大神社及封嶽也山川蓋軍之所依止大傳曰牧之野武王之大事也既事而退柴於上帝祈于社設奠于牧室注上經據在軍下經據敗退此經據尅勝後告天及社之事注云為兆以類禮即祭上帝者若依國四郊則自有尋常兆域今戰訖而祭故須新為壇兆也大傳云設奠於牧室謂祭文王行主於牧野之室於此文無當連引之者欲見此經亦當有祭行主不言者文不備也凡師不功則助牽主車注助助大司馬也謂師無功肆師助牽之恐為敵所得疏主中有二為社之石主遷廟木主也凡四時之大甸獵祭表貉則為位貉莫駕反鄭音陌注貉師祭也貉讀為十百之百於所立表之處為師祭造軍法者禱氣勢之增倍也其神蓋蚩蛔或曰黃帝嘗之日涖卜來嵗之芟芟色銜反注芟芟草除田也古之始耕者除田種榖嘗者嘗新榖此芟之功也卜者問來嵗宜芟否疏涖卜來嵗之芟者餘事則大宗伯涖卜或太卜涖卜此及下三事皆肆師涖卜也獮之日涖卜來嵗之戒獮音鮮思淺切注秋田為獮始習兵戒不虞也卜者問後嵗兵冦之備疏必於秋獮之日為戒者以其春教振旅夏教茇舍秋教治兵之日故於是戒不虞社之日涖卜來嵗之稼注社祭土為取財焉卜者問後嵗稼所宜疏上文嘗獮是秋則此社亦是秋祭社之日也祭社有二時春祈秋報若國有大故則令國人祭注大故謂水旱凶荒所令祭者社及禜酺疏案地官州祭社黨祭禜族祭酺於六遂之中亦縣祭社鄙祭禜酇祭酺皆是國人所祭之事也嵗時之祭祀亦如之注月令仲春命民社此其一隅疏云嵗時之祭祀者上經據禱祈非時祭故此經見其常祭也凡言嵗時者謂嵗之四時月令唯見一時故鄭云一隅也亦如之者亦令國人祭也凡卿大夫之喪相其禮注相其適子疏鄭知相適子者庶子無事適子則有送賓拜賓之事且卿大夫之適子為天子斬衰故知所相者適子也凡國之大事治其禮儀以佐宗伯疏案大宗伯云治其大禮小宗伯云相治小禮此又云治其禮儀者謂佐大小宗伯治之謹習其事也凡國之小事治其禮儀而掌其事如宗伯之禮鬱人掌祼器注祼器謂彝及舟與瓚訓彝所以盛鬱鬯瓚所以酌鬱鬯舟則承彝槃也凡祭祀賓客之祼事和鬱鬯以實彝而陳之注鄭司農云鬱為草若蘭疏天地大神至尊不祼至於山川及門社等事在鬯人亦無祼事此云祭祀唯據宗廟耳案王度記云天子以鬯諸侯以薰大夫以蘭芝士以蕭庶人以艾此等皆以和酒禮緯云鬯草生庭皆是鬱金之草以其和鬯酒因號為鬯草也諸侯以薰謂未得圭瓚之賜得賜則以鬱耳凡祼玉濯之陳之以贊祼事注祼玉謂圭瓚璋瓚詔祼將之儀與其節注節謂王奉玉送祼早晏之節凡祼事沃盥疏賔客則大宗伯祼祭祀王及后祼皆鬱人沃以水盥手及洗瓚也大喪之渳共其肆器注肆器陳尸之器喪大記曰君設大盤造冰焉大夫設夷盤造冰焉士併瓦盤無冰設牀袒笫有枕此之謂肆器天子亦用夷盤疏云士併瓦盤無冰者盛水以寒尸也訓天子諸侯大夫肆器見凌人夷盤冰節及葬共其祼器遂貍之注遣奠之彝與瓚也貍之於祖廟階間明奠終於此疏此即司尊彝云大喪存奠彝是也以奠無尸直陳之於奠處耳云奠終於此者自此以前設奠象生無尸自此以後葬訖而虞則有尸士虞禮云男男尸女女尸以神事之異於生也大祭祀與量人受舉斝之卒爵而飲之斝古雅反注斝受福之嘏聲之誤也王酳尸尸嘏王此其卒爵也少牢饋食禮主人受嘏詩懷之卒爵執爵以興出宰夫以籩受嗇黍主人嘗之乃還獻祝此鬱人受王之卒爵亦王出房時也必與量人者鬱人贊祼尸量人制從獻之脯膰事相成疏此獻鬱人量人之節當大夫獻祝及佐食時也大夫士有獻祝及佐食無獻鬱人量人法天子有獻鬱人量人之禮無祝及佐食之事但其節同故引為證也鬯人掌共秬鬯而飾之注秬鬯不和鬱者飾之謂設巾凡祭祀社壝用大罍壝唯癸反罍音雷注壝謂委土為墠壇所以祭也大罍瓦罍禜門用瓢齎禜音詠瓢婢遙反齎音齊在兮反杜音資注禜謂營酇所祭門國門也春秋傳曰日月星辰之神則雪霜風雨之不時於是乎禜之山川之神則水旱癘疫之不時於是乎禜之魯莊二十五年秋大水鼓用牲于社于門齎讀為齊取甘瓠割去柢以齊為尊廟用修凡山川四方用蜃凡祼事用概凡疈事用散修音卣羊久反又音由中鐏也祼音埋概古愛及注祼當為埋字之誤也廟用修者謂始禘時自饋食始修讀曰卣卣中尊謂獻象之屬尊者彝為上罍為為下蜃畫為蜃形概尊以朱帶者無飾曰散修蜃概散皆漆尊也疏鄭破祼為埋者若祼則用鬱當用彝尊不合在此而用概尊也埋謂山林之祭則山川用蜃者大山川也注云廟用修謂始禘時者謂練祭後遷廟時以新死者木主入廟特為此祭對三年喪畢明年春禘為終禘故云始也云自饋食始者以喪中為吉祭不可與吉時同故略同大夫士禮訓冪人職云以疏布巾冪八尊以畫布巾冪六彝疏稱祭天地亦有秬鬯之彞而鬯人不列之者彼皆盛鬯於彞是其常耳鬯人所言自社壝以下所用不見異器蓋皆有鬯無鬱故宗廟六享所用之彞此亦不言而僅著廟用修矣鄭讀修為卣即六尊也尋常宗廟祭祀盛鬱鬯皆用彝無以尊盛鬱鬯者故鄭以始禘解之言始禘眀與祫禘之禘不同王制疏云謂練時遷主遞廟新死者當禘祭於其廟以安之也又文二年榖梁傳云作主壞廟有時日於練焉壞廟壞廟之道易簷可也改途可也賈疏據此謂是時木主新入廟禘祭之又左傳云特祀于主蒸嘗禘于廟孔氏賈氏皆以為期年後然後蒸嘗禘於廟是當練時也蓋練而毁廟遷主遂始禘於新主之廟直至喪畢然後大祫越明年春而禘也大喪之大渳設斗共其釁鬯注斗所以沃尸鄭司農云釁讀為徽凡王之齊事共其秬鬯注給淬浴疏鄭知王齊以鬯洗浴者以其鬯酒非如三酒可飲之物也凡王弔臨共介鬯注以尊適卑曰臨曲禮曰摯天子鬯王至尊介為執致之以禮於鬼神又曰臨諸侯畛於鬼神曰有天王某父此王適四方舍諸侯祖廟祝告其神之辭介於是進鬯雞人掌共雞牲辨其物注物謂毛色也辨之者陽祀用騂隂祀用黝疏鄭舉此二者其望祀各以其方色牲及四時迎氣皆隨其方色亦辨其毛物可知也大祭祀夜呼旦以嘂百官凡國之大賔客會同軍旅喪紀亦如之凡國事為期則告之時呼火吳反本又作呼廣韻音呼嘂音叫古弔反注象雞知時也告其有司主事者凡祭祀面禳釁共其雞牲禳如羊反注釁釁廟之屬釁廟以羊門夾室皆用雞鄭司農云面禳四面禳也釁讀徽疏祭祀謂宗廟之屬靣禳謂祈禱之屬鄭云釁釁廟之屬則釁鼓及甲兵皆在其中訓祭祀面禳釁凡三事謂祭祀及面禳與釁皆共雞牲司尊彞掌六尊六彝之位詔其酌辨其用與其實注位所陳之處酌泲之使可酌各異也用四時祭祀所用亦不同實鬱及醴齊之屬疏案下兼有罍尊不言者文略也春祠夏禴祼用雞彞鳥彞皆有舟其朝踐用兩獻尊其再獻用兩象尊皆有罍諸臣之所昨也秋嘗冬蒸祼用斝彞黃彞皆有舟其朝獻用兩著尊其饋獻用兩壺尊皆有罍諸臣之所昨也凡四時之間祀追享朝享祼用虎彝蜼彝皆有舟其朝踐用兩大尊其再獻用兩山尊皆有罍諸臣之所昨也兩獻本作戲注作犧同素何反斝音稼昨讀為酢著直略反蜼音誄又以水反廣韻力軌反兩大音泰注祼謂以圭瓚酌鬱鬯始獻尸也后於是以璋瓚酌亞祼朝踐謂薦血腥酌醴始行祭事后於是薦朝事之豆籩既又酌獻其變朝踐為朝獻者尊相因也朝獻謂尸卒食王酳之再獻者王酳尸之後后酌亞獻諸臣為賓又次后酌盎齊備卒食三獻也於后亞獻內宗薦加豆籩其變再獻為饋獻者亦尊相因饋獻謂加熟時后於是薦饋食之豆籩此凡九酌王及后各四諸臣一祭之正也以今祭禮特牲少牢言之二祼為奠而尸飲七矣王可以獻諸臣祭統曰尸飲五君洗玉爵獻卿是其差也明堂位曰灌用玉瓚大圭爵用玉盞加用璧角璧散又鬱人職曰受舉斝之卒爵而飲之則王酳尸以玉爵也王酳尸用玉爵而再獻者用璧角璧散可知也雞彝鳥彞謂刻而畫之為雞鳳凰之形皆有舟皆有罍言春夏秋冬及追享朝享有之同昨讀為酢字之誤也諸臣獻者酌罍以自酢不敢與王之神靈共尊鄭司農云舟尊下臺若今時承槃獻讀為犧犧尊飾以翡翠象尊以象鳳凰或曰以象骨飾尊明堂位曰犧象周尊也斝讀為稼稼彝畫禾稼也黃彝黃目尊也明堂位曰夏后氏以雞彝殷以斝周以黃目著尊著地無足明堂位曰著殷尊也壺者以壺為尊追享朝享謂禘祫也在四時之間故曰間祀大尊太古之瓦尊山尊山罍也明堂位曰泰有虞氏之尊也山罍夏后氏之尊也玄謂黃目以黃金為目郊特牲曰黃目鬱氣之上尊也黃者中也目者氣之清明者也追享謂追祭遷廟之主以事有所請禱朝享謂朝受政于廟春秋傳曰閏月不吉朔猶朝於廟蜼禺屬卬鼻而長尾山罍亦刻而畫之為山雲之形疏彝尊各用二者鬱鬯與齊皆配以眀水三酒配以玄酒鄭志云雞彝盛眀水鳥彝盛鬱鬯是以各二罍尊不言數者諸祭司用三酒不别數可知也注云祭之正也者此九獻是正獻案特牲少牢仍有衆賓長兄弟之長嗣子舉奠上利洗散為加獻彼並非正故此云正祭也云二祼為奠而尸飲七王可以獻諸臣者王獻諸臣無文此約祭統而言祭統據侯伯禮宗廟七獻二祼為奠不飲乾踐已後有尸飲五獻卿即天子與上公同几獻二祼為奠不飲是尸飲七可以獻諸臣子男五獻者二祼為奠不飲是尸飲三可以獻卿大夫士三獻無二祼直有酳尸三獻獻祝皆當降殺以兩故云是其差也主人主婦賓長獻尸皆有酢報王酳尸因朝踐之尊醴齊尸酢王還用醴齊后酳尸用饋獻之尊盎齊尸酢后還用盎齊以王與后尊得與神靈共尊賓長臣卑酳尸雖得與后同用盎及尸酢賓長即用罍尊三酒之中清酒以自酢是不敢與王之神靈共酒尊故也云朝享為朝受政于廟者謂天子告朔于明堂因即朝享朝享即祭法謂之月祭諸侯告朔于太廟因即朝享告朔天子用牛諸侯用羊月祭皆大牢也天子告朔于明堂則是天子受政于眀堂而云受政于廟者以告朔訖因即朝廟亦謂之受政但與明堂受朔别也按明堂位雞彝是夏法斝彞是殷法黃彞是周法其虎彝蜼彞當是有虞氏之尊故鄭注尚書曰虞夏以上虎蜼而已也訓此經所言乃九獻之禮今雜取禮記孔氏疏以附之大祫於太廟祭日之旦王衮冕而入尸亦衮冕入祝在後侑尸王不出迎尸以成尸尊尸入室就位于主之右乃作樂降神乃灌當灌之時衆尸皆在太廟中依次而灌小宗伯以圭瓚授王王酌鬱鬯以獻尸小宰贊王授尸尸受之瀝地祭訖啐之奠之不飲后以璋瓚亞祼內宰贊之此一獻二獻也既灌之後王出迎牲牲入在庭以幣告神所謂納牲詔于庭也牲麗于碑王乃射牲太僕贊王牲事於是祝取血以告殺取毛以告純皆在室中告之所謂血毛詔於室也凡牲則廟各别牢故公羊傳云周公白牡魯公騂剛又逸禮云毁廟之主昭共一牢穆共一牢於是行朝踐之事祝延尸出於室太祖之尸坐於户西南面其主在右昭在東穆在西相對坐主各在其右祝乃取牲腸指脂燎於爐炭入以詔神於室又出以薦於主前所謂詔祝於室坐尸於堂也王乃洗肝於鬱鬯而燔之以制于主前所謂君親制祭也次乃升牲首於室中置於北牖下凡三牲之首皆升之所謂升首於室也后乃薦朝事之籩豆各八乃解牲為七體薦腥于尸主之前所謂腥其爼也王乃以玉爵酌泛齊以獻尸是為三獻后又以玉爵酌醴齊以獻尸是為四獻凡王進爵之時皆奏樂此朝踐之節也朝踐後乃薦熟取牲又解為二十一體以湯爓之載其右體於爼次於腥而薦之堂所謂熟其肴也爓祭時牲體尚未熟爓祭後取牲左右體合烹而熟之所謂退而合烹體其犬豕牛羊也烹既熟將迎尸主入室乃先以爼盛之告神於堂亦曰設饌於堂所謂羮定詔於堂也於是延主入室太祖東面昭南穆北徙堂上之饌於室內坐前乃饋熟以隂厭主婦乃薦黍稷祝以斝爵酌先奠于鉶南其爵天子用斝諸侯用角郊特牲注所謂天子奠斝諸侯奠角也祝奠爵訖以祝辭告神所謂真祭祝於主也告神訖祝又行祭求神於廟內內所謂索祭祝於祊也則又取蕭染以膟膋合黍稷燒之於室中膟膋即腸間脂此所謂既奠然後焫蕭合馨香也馨香謂黍稷也凡祭兩度焫蕭朝踐詔祝於室時燔膟膋於爐炭亦有蕭在當此之時則大合樂自此以前謂之接祭於是迎尸入室坐於奧舉此奠斝祝詔王拜妥尸蓋尸始即至尊之坐未敢自安故拜以安之此所謂舉斝角拜妥尸也后乃薦饋食之籩豆各八玉以玉爵酌盎齊以獻尸是為五獻后又以玉爵酌醍齊以獻尸是為六獻此饋獻之節也饋獻後祝詔墮祭尸取菹㨎于醢祭于豆間乃祭黍稷肺祭酒乃食食十五飯訖王以玉爵酌朝踐之尊泛齊以酳尸是為七獻此朝獻之節也朝獻後后薦加籩豆各八尸酌酢王王亦墮祭啐酒進聽嘏祝嘏王王受嘏卒爵獻鬱人量人於時王則仍以其爵獻諸侯然後后以璧角酌饋食之尊醍齊以酳尸是為八獻於時王以瑶爵獻卿矣諸侯為賓以璧散酌沉齊以獻尸璧角璧散皆瑶爵也是為九獻此再獻之莭也自酳尸以後命曰卒食三獻總在九獻之中皆正祭也九獻之後謂之加爵特牲禮有三加則天子以下加爵之數依尊卑不止三加疏中衆賓長兄弟之長嗣子舉奠上利洗散為加獻即九獻外之加爵也宗廟祭祀之器彝盛鬱鬯尊盛五齊三酒罍亦曰尊通也鬱鬯以祼五齊三酒以獻以酢酌鬱鬯以祼者用圭瓚璋瓚酌齊酒以獻酢者用玉爵瑶爵九獻之禮唯魯及王者之後得用之其行事與天子同但大祭時止用四齊自醴以下惟不用泛齊耳時祭亦用二齊謂醴盎也侯伯七獻朝踐及饋獻時君皆不獻禮器曰君親制祭夫人薦盎君親割牲夫人薦酒是也子男五獻饋熟以前君與夫人並無獻食後行三獻通二灌為五也侯伯子男祫祭時惟用醴盎二齊特祭時惟用一齊亦謂盎也諸臣為賓獻用酒而已矣尸酢公侯伯子男皆用所獻之齊酢其臣亦皆用清酒天子諸侯之祭酌奠皆用齊酒卿大夫之祭酌奠皆用酒而已矣九獻之序先朝踐次饋獻次朝獻次再獻經於四時互舉之者蓋朝獻與朝踐之齊尊同再獻與饋獻之齊尊同故對文見義耳似追享為禘祫理屬可通而康成不如此解者禘祫大祭備五齊之尊則不止兩大尊兩山尊而已也凡六彝六尊之酌鬱齊獻酌醴齊縮酌盎齊涗酌凡酒修酌獻司農讀儀後鄭為莎涗音稅舒鋭反李一音雪修讀為滌直歷反注禮運曰玄酒在室醴盞在户粢醍在室澄酒在下訓以五次之則盞酒盎齊也郊牲牲曰縮酌用茅明酌也盞酒涗于清汁獻涗于盞酒猶明清與盞酒于舊驛之酒也此言轉相泲成也獻讀為摩莎之莎煮鬱和秬鬯以盞酒摩莎泲之出其香汁也醴齊尤濁和以明酌泲之以茅縮去滓也盎齊差清和以清酒泲之而已其餘三齊泛從醴緹沈從盎凡酒謂三酒也修讀如滌濯之滌滌酌以水和而泲之今齊人命浩酒曰滌眀酌酌取事酒之上也澤讀曰醳明酌清酒盞酒泲之皆以舊醳之酒凡此四者祼用鬱齊朝用醴齊饋用盎齊諸臣自酢用凡酒唯大事于太廟備五齊三酒疏凡言酌者皆是泲之使可酌也訓凡眀水玄酒單言之則可通用故禮運云玄酒在室在室者乃鬱鬯之配尊當云明水而曰玄酒是明水玄酒通稱也又盞乃盎齊而亦曰盞酒是酒齊亦通稱也凡齊皆用酒泲之而鬱鬯獨用盎齊泲之者重鬱鬯也大喪存奠彝注存省也謂大遣時奠者朝夕乃徹也大旅亦如之注旅者國有大故之祭也亦存其奠彝則陳之不即徹疏案小宰注天地至尊不祼此得用彝者此告請非常亦如大遣奠之而已亦非祼耳司几筵掌五几五席之名物辨其用與其位注五几左右玉雕彤漆素五席莞藻次蒲熊用位所設之席及其處疏此經仍有葦􅍉席不入數者以喪中非常故不數直取五席與五几相對而言耳凡大朝覲大饗射凡封國命諸侯王位設黼依依前南鄉設莞筵紛純加繅席畫純加次席黼純左右玉几朝直遙反黼音甫依於起反鄉許亮反莞音官又音丸純章允反劉之閏反司農音均繅音早注斧謂之黼其繡白黑采以絳帛為質依其制如屏風然於依前為王設席左右有几優至尊也鄭司農云紛讀為豳又讀為和粉之粉謂白繡也純緣也玄謂粉如綬有文而狹者繅席削蒲蒻展之編以五采畫謂雲氣也次席桃枝席有次列成文疏此經及下文見王有事設席三重之義言大朝覲非四時常朝也大饗謂王與諸侯行饗禮於廟大射謂王將祭祀擇士而射於西郊小學虞庠中也凡敷席之法初在地者一重即謂之筵重在上者即謂之席故鄭注序官云敷陳曰筵藉之曰席鄭知黼以絳帛為質者鄉射記云凡畫者丹質此黼畫之知是絳帛絳帛即丹質也案爾雅户牖之間曰扆於扆之處設黼黼即白黑文而為斧形此斧以大板為邸以此斧板置於扆也此經所云王皆立不坐於左右皆有几也祀先王昨席亦如之注昨讀曰酢謂祭祀及王受酢之席尸卒食王酳之卒爵祝受之又酌授尸尸酢王於是席王於户內后諸臣致爵乃設席疏案特牲少牢主人受酢之時未設席夫婦致爵乃設席今王於受酢之時即設席者優至尊也至於后即與彼同者后不得與王同也按特牲無致爵於賓長之法此王於諸臣亦無致爵禮言諸臣致爵者謂酳尸訖主人獻賓長於西階上謂之致爵也特牲禮主人致爵於主婦席於東房中此后亦然特牲獻賓長於西階上無席獻訖以薦爼降降設於西階下亦無席此諸臣有席亦是王之臣尊宜設席乃以薦爼降設於席東也訓祀先王及昨席雖總承上文几筵而其實則昨席無左右玉几也諸侯祭祀席蒲筵繢純加莞席紛純右雕几繢胡內反注繢畫文也不莞席加繅者繅柔嚅不如莞清堅又於鬼神宜疏此經論諸侯禘祫及四時祭祀之席皆二種席也昨席莞筵紛純加繅席畫純筵國賓于牖前亦如之左彤几昨讀亦曰酢注國賓諸侯來朝孤卿大夫來聘後言几者使不蒙如也朝者雕几聘者彤几疏案公食大夫禮云上大夫蒲筵加􅍉席其純皆如下大夫彼注云孤為賓則莞筵紛純加繅席畫純聘禮注云筵孤彤几卿大夫其漆几與以此而言則筵諸侯與孤用莞筵繅席卿大夫則用蒲筵􅍉席今總云國賓孤卿大夫者廣解賓義訓附録國賔之席如昨席而别言左彤几則昨席無几可知也諸侯祭祀席有右雕几則王祀先王有几可知也然則祀先王及酢席經雖統承上几筵之文而曰亦如之實則祀先王之有几酢席之無几可以參互得矣鄭云朝者雕几聘者彤几凡生人几在左鬼神几在右則朝者之雕几雖如祭祀而其位當依彤几在左也甸役則設熊席右漆几甸音田注謂王甸有司祭表貉所設席凡喪事設葦席右素几其柏席用􅍉黼純諸侯則紛純每敦一几柏鄭音椁劉依司農音迫􅍉音丸敦音道劉音疇注喪事謂凡奠也􅍉如葦而細者柏椁字磨滅之餘椁席藏中神坐之席也敦讀為燾燾覆也棺在殯則椁燾既窆則加見皆謂覆之周禮雖合葬及同時在殯皆異几體實不同祭於廟同几精氣合疏云喪事謂凡奠者士喪禮始死之奠至小斂之奠設於地未有席至大斂奠乃有席殯後則有朝夕奠朔月奠大夫以上兼有月半奠并有薦新奠葬又有遷奠祖奠大遣奠葬乃廢奠而虞祭也故云凡奠也云既窆則加見者既夕下棺訖則加見見謂道上帳帷荒將入藏以覆棺言見者以其棺不復見唯見帷荒故謂之見也云祭於廟同几言祭於廟者謂吉祭時以其禫月吉祭猶未配故知至二十八月乃設同几也凡吉事變几凶事仍几注吉事王祭宗廟祼於室饋食於堂繹於祊每事易几神事文示新之也凶事謂凡奠几朝夕相因喪禮略疏注不言朝踐者朝踐與饋獻同在堂故略不言又饋獻後更延尸入室進黍稷尸食之事不言者以其還依祼於室之几故亦不言也案檀弓云虞而立尸有几筵據大夫士而言士喪禮大斂即有席而云虞始有筵者以其几筵相將連言其實虞時始有几其筵大斂即有也天子諸侯禮大初死几筵並有故上文云喪事設葦席右素几也凡几之長短阮諶云几長五尺髙二尺廣一尺馬融曰長三尺舊圖以為几兩端赤中央黑也周禮纂訓卷十
