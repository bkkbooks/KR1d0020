body:
  text: 周禮纂訓卷十九安溪李鍾倫撰秋官司冦第五惟王建國辨方正位體國經野設官分職以為民極乃立秋官司冦使帥其屬而掌邦禁以佐王刑邦國刑官之屬大司冦卿一人小司冦中大夫二人士師下大夫四人鄉士上士八人中士十有六人旅下士三十有二人府六人史十有二人胥十有二人徒百有二十人遂士中士十有二人府六人史有十二人胥十有二人徒百有二十人縣士中士三十有二人府八人史十有六人胥十有六人徒百有六十人方士中士十有六人府八人史十有六人胥十有六人徒百有六十人訝士中士八人府四人史八人胥八人徒八十人訝五嫁反朝士中士六人府三人史六人胥六人徒六十人司民中士六人府三人史六人胥三人徒三十人司刑中士二人府一人史二人胥二人徒二十人司刺下士二人府一人史二人徒四人刺七賜反司約下士二人府一人史二人徒四人司盟下士二人府一人史二人徒四人職金上士二人下士四人府二人史四人胥八人徒八十人司厲下士二人史一人徒十有二人犬人下士二人府一人史二人賈四人徒十六人司圜中士六人下士十有二人府三人史六人胥十有六人徒百有六十人掌囚下士十有二人府六人史十有二人徒百有二十人掌戮下士二人史一人徒十有二人司𨽻中士二人下士十有二人府五人史十人胥二十人徒二百人罪𨽻百有二十人蠻𨽻百有二十人閩𨽻百有二十人夷𨽻百有二十人貉𨽻百有二十人貉音陌布憲中士二人下士四人府二人史四人胥四人徒四十人禁殺戮下士二人史一人徒十有二人禁暴氏下士六人史三人胥六人徒六十人野廬氏下士六人胥十有二人徒百有二十人蠟氏下士四人徒四十人蠟音覷七慮切雍氏下士二人徒八人萍氏下士二人徒八人萍音平廣韻音瓶薄經切司寤氏下士二人徒八人司烜氏下士六人徒十有二人烜音燬許委切又况晚切條狼氏下士六人胥六人徒六十人條音滌徒歷反修閭氏下士二人史一人徒十有二人冥氏下士二人徒八人冥如字又莫歷反庶氏下士一人徒四人庶音煮又章預反穴氏下士一人徒四人翨氏下士二人徒八人翨音翅失豉反柞氏下士八人徒二十人柞音昨在各切又音作剃氏下士二人徒二十人剃或作雉同音替他計切又音雉硩蔟氏下士一人徒二人硩音摘他歷反蔟蒼獨反翦氏下士一人徒二人赤犮氏下士一人徒二人犮音拔蟈氏下士一人徒二人蟈音國廣韻音馘古獲切壺涿氏下士一人徒二人庭氏下士一人徒二人銜枚氏下士二人徒八人伊耆氏下士一人徒二人大行人中大夫二人小行人下大夫四人司儀上士八人中士十有六人行夫下士三十有二人府四人史八人胥八人徒八十人環人中士四人史四人胥四人徒四十人象胥每翟上士一人中士二人下士八人徒二十人掌客上士二人下士四人府一人史二人胥二人徒二十人掌訝中士八人府二人史四人胥四人徒四十人掌交中士八人府二人史四人徒三十有二人掌察四方中士八人史四人徒十有六人掌貨賄下士十有六人史四人徒三十有二人朝大夫每國上士二人下士四人府一人史二人庶子八人徒一十人都則中士一人下士二人府一人史二人庶子四人徒八十人都士中士二人下士四人府二人史四人胥四人徒四十人家士亦如之大司冦之職掌建邦之三典以佐王刑邦國詰四方詰起吉反注典法也詰謹也一曰刑新國用輕典注新國者新辟地立君之國用輕典者為其民未習於教疏趙商問族師法八閭為聨使之相保相受刑罰慶賞相及在康誥曰父子兄弟罪不相及不知書禮異同如何答曰族師法乃周公制禮使民相拱敕康誥時新誅三監天下未定務在尚寬故也若然天下未定即是新國用輕典之義也二曰刑平國用中典注平國承平守成之國也用中典者常行之法三曰刑亂國用重典注亂國篡逆之國以其化惡伐滅之以五刑糾萬民注刑亦法也疏此五刑與墨劓之等别或一刑之中而含五或此五刑全不入五刑者一曰野刑上功糾力注功農功力勤力二曰軍刑上命糾守注命將命也守不失部伍三曰鄉刑上德糾孝注德六德也善父母為孝四曰官刑上能糾職注能能其事也職職事修理五曰國刑上願糾暴願音願劉又音原暴注作恭注願慤慎也暴當為恭字之誤訓凡此五者蓋皆麗於五刑者也故諸官之中多有云附于刑者歸于士是也明未附于刑者當官薄罰之也鄉刑即大司徒所未鄉之八刑官刑與太宰八法中官刑有異國刑即司市所謂以刑罰禁暴而去盜故曰糾暴也不曰市刑而曰國刑何也惟市在國中若其餘居民在國中者當從鄉刑之條刑不上大夫其言官刑何也蓋此所謂官刑乃施之於在官者府史胥徒之屬故上云糾萬民明非官長也野刑軍刑鄉刑外事也官刑國刑內事也以圜土聚教罷民罷音皮注圜土獄城也聚罷民其中困苦以教之為善也民不愍作勞有似於罷凡害人者置之圜土而施職事焉以明刑恥之置之豉反又音示注害人謂為邪惡已有過失麗於法者以其不故犯法置之圜土繫教之施職事以所能役使之明刑書其罪惡於大方版著其背疏按司救云凡民之有邪惡者三罰而士加明刑恥諸嘉石役諸司空即此下文者是也此謂過輕直坐嘉石不入圜土也彼又云其有過失者三罰而歸于圜土此謂罪重不坐嘉石徑入圜土其晝日亦役諸司空夜乃入圜土也其能改者反于中國不齒三年其不能改而出圜土者殺注反於中國謂舍之還於故鄉里也司圜職曰上罪三年而舍中罪二年而舍下罪一年而舍不齒者不得以年次列于平民出謂逃亡以兩造禁民訟入束矢於朝然後聽之造七報反注訟謂以財貨相告者造至也使訟者兩至既兩至使入束矢乃治之也不至不入束矢則是自服不直者也必入矢者取其直也古者一弓百矢束矢其百個與疏此與下所言禁者謂令先入此物不實則沒入官若不入則是自服不直禁民省事之法也以兩劑禁民獄入鈞金三日乃致于朝然後聽之劑子隨反注獄謂相告以罪名者劑今券書也使獄者各齎券書既兩券書使入鈞金又三日乃治之重刑也不劵書不入金則是自服不直者也必入金者取其堅也三十斤曰鈞疏劑券書者謂獄訟之要辭以嘉石平罷民注嘉石文石也樹之外朝門左平成也成之使善凡萬民之有罪過而未麗於法而害於州里者桎梏而坐諸嘉石役諸司空重罪旬有三日坐期役其次九日坐九月役其次七日坐七月役其次五日坐五月役其下罪三日坐三月役使州里任之則宥而舍之桎音質梏古毒反注木在足曰桎在手曰梏疏未麗於法對入圜土為法以肺石達窮民肺芳廢反注肺石赤石也凡逺近􅑏獨老幼之欲有復於上而其長弗達者立於肺石三日士聽其辭以告於上而罪其長􅑏其營反長丁丈反上時掌反注無兄弟曰􅑏無子孫曰獨復猶報也上謂王與六卿也長謂諸侯若鄉遂大夫正月之吉始和布刑于邦國都鄙乃縣刑象之法于象魏使萬民觀刑象挾日而斂之縣音玄注布刑布五刑於天下凡邦之大盟約涖其盟書而登之于天府大史內史司會及六官皆受其二而藏之疏大盟約謂王與諸侯因大會同而與盟訓大史內史司會之職皆掌典籍者故受其二凡諸侯之獄訟以邦典定之注邦典六典也以六典待邦國之治凡卿大夫之獄訟以邦法斷之斷丁亂反注邦法八法也以八法待官府之治凡庶民之獄訟以邦成弊之弊必世反注邦成八成也以官成待萬民之治弊之斷其獄訟也訓一曰邦典司冦之三典也邦法所謂以八辟麗邦法附刑罰邦成士師之八成亦通大祭祀奉犬牲疏犬屬西方金故司冦奉進之若禋祀五帝則戒之日涖誓百官戒于百族注戒之日卜之日也百族謂府史以下也郊特牲曰獻命庫門之內戒百官也大廟之命戒百姓也疏百官則大司冦臨他官誓之百族則大司冦親自戒之若然大宰掌百官之誓戒戒則親為之誓亦是使餘小官誓之以司冦不得涖大宰也引郊特牲者欲見此百族是府史以下彼百姓是王之親故入廟門乃戒之知百族非百姓者以其王之百姓亦同大宰戒之及納亨前王祭之日亦如之亨普庚反注納亨致牲疏納亨致牲者謂將祭之辰奉其明水火注明水火所取於日月者疏水以配鬱鬯與五齊火以給㸑亨也凡朝覲會同前王大喪亦如之注大喪所前或嗣王疏言或者大喪中兼王喪及后世子若是后世子則王為正王也大軍旅涖戮于社注社謂社主在軍者也凡邦之大事使其屬蹕蹕本亦作蹕音畢注屬士師以下也訓司冦佐王刑邦國首言輕重三典所以權衡用法之本次言內外五刑所以通舉用刑之要此皆麗於刑罰者也欲其不致於刑也則有圜土以收教之又不欲輕用其刑也則有兩造兩劑以禁止之乃罪復未至於圜土者又有嘉石以佐其闕匡直輔翼之道有不至焉者乎且力有不能具鈞金束矢者又有肺石以達其窮􅑏老幼之情有不通焉者乎聖人之言略舉綱維而斟酌變通之道哀矜惻怛之思靡不具見焉矣正月以上乃條列治法正月以下乃施行治法又或有與他官共事者亦俱在正月之下惟當官獨任者乃俱列於上此經之凡例也小司冦之職掌外朝之政以致萬民而詢焉一曰詢國危二曰詢國遷三曰詢立君注外朝在雉門之外國危謂有兵冦之難國遷謂徙都改邑立君謂無冢適選于庶也疏云立君謂無冢適者冢適雙言后所生最長者為冢次冢為適無冢立適又無適乃立庶也訓案下文兼有羣吏此獨云萬民者羣吏在朝是常萬民則惟大事及訊疑獄乃致之故特言也其位王南鄉三公及州長百姓北面羣臣西面羣吏東面鄉許亮反注羣臣卿大夫士也羣吏府史也其孤不見者孤從羣臣卿大夫在公後疏此孤位與射人及司士異射人司士職文孤位皆西方東面北上今此則在東方也訓案此所謂三公即二鄉而公一人者也言州長不言鄉大夫者蓋鄉大夫乃卿為之尊不可同州長等居三公後當與羣臣為列共居西面故朝士職孤卿大夫位在左其中或有鄉大夫在與三公在周官無位注疏謂二鄉一人者乃致仕之三公愚謂不然既已致仕豈得復掌六卿蓋三公在王朝掌六鄉其采邑當别使吏治之耳小司冦擯以敘進而問焉以衆輔志而弊謀擯兵刃反注擯謂揖之使前也疏以敘進謂先公卿以次而下訓按志王之志也書曰謀及乃心以五刑聽萬民之獄訟附于刑用情訊之至于旬乃弊之讀書則用法訊音信注附猶著也訊言也用情理言之冀有可以出之者十日乃斷之鄭司農云讀書則用法如今時讀鞫已乃論之疏鞫謂劾囚之要辭行刑之時讀已乃論其罪也訓按用情訊之謂罪雖已附於刑而容有隱情未盡謂迫於不得已陷于不知與為親受汙之類王制所謂原父子之親立君臣之義以權之意論輕重慎測淺深是也此乃法外之意推求至于旬日而無可原然後斷罪讀書用法明不以意為輕重王制所謂郵罰麗于事也一以見原情而不専於法一以見執法而無所於私凡命夫命婦不躬坐獄訟注不躬坐必使其屬若子弟也喪服傳曰命夫者其男子之為大夫者命婦者其婦人之為大夫妻者疏坐者古者取囚要辭皆對坐訓按訊獄之時又有不躬坐者用法之時又有不即市者所以優異尊親凡王之同族有罪不即市注鄭司農云刑諸甸師氏以五聲聽獄訟求民情疏按吕刑惟貌有稽在獄定之後則此五聽亦在要辭定訖恐其濫失更以五聽觀之訓按五聽以聲為主何也聽者聽其辭其餘色氣皆因詞而察之故主于聲也疏謂獄定之後乃有五聽恐未必然經云求民情又其中有辭聽之文若未聽其詞民情未得獄何由定乎愚謂上文五刑一節是綱此五聽即所謂聽之而附于刑之法也一曰辭聽注觀其出言不直則煩二曰色聽注觀其顔色不直則赧然三曰氣聽注觀其氣息不直則喘四曰耳聽注觀其聽聆不直則惑五曰目聽注觀其眸子不直則眊然訓聽言之道先斷其理次觀其色次候其氣次察其神詞者理之發也耳目者神之官也先審其辭而理已得十四五矣參之色氣與神人焉廋哉色動而易見氣又次之神又次之也以八辟麗邦法附刑罰注辟法也麗附也猶著也疏按曲禮云刑不上大夫鄭注云其犯法則在八議輕重不在刑書若然此八辟不在刑書若有罪當議議得其罪乃附邦法而附于刑罰也訓按麗與附互相解邦法刑書也八者人有犯罪則以刑書相依倣論罪而後附于刑罰八辟之刑罰或各降於刑書與一曰議親之辟注鄭司農云若今時宗室有罪先請是也二曰議故之辟注故謂舊知也三曰議賢之辟注賢謂有德行者四曰議能之辟注能謂有道藝者五曰議功之辟注謂有大勳力立功者六曰議貴之辟注鄭司農云若今時吏墨綬有罪先請是也七曰議勤之辟注謂憔悴以事國八曰議賔之辟注謂所不臣者三恪二代之後與訓愚謂賔謂賔旅以其為賔未嫺法禁輕之八者之序與冢宰八統之序正同親親賢賢庸勳敬貴此周家之治勤者功之屬也賔者貴之屬也以三刺斷庶民獄訟之中注中謂罪正所定一曰訊羣臣二曰訊羣吏三曰訊萬民注刺殺也三訊罪定則殺之訊言也聽民之所刺宥以施上服下服之刑注宥寬也民言殺殺之言寬寬之上服劓墨也下服宫刖也疏凡行刺必先以物規之如衣服乃施行故言服也及大比登民數自生齒以上登于天府比毗志反注大比三年大數民之衆寡也人生齒而體備男八月而生齒女七月而生齒內史司會冢宰二之以制國用注人數定而九賦可知國用乃可制耳訓按生齒繁則授田多而國用益小祭祀奉犬牲凡禋祀五帝實鑊水納亨亦如之鑊戶郭反注納亨致牲也其時鑊水當以洗解牲體肉疏鄭知實鑊水為洗解牲肉者以下云納亨亦如之是實鑊水亨煮肉故知此是洗肉也大賔客前王而辟辟婢亦反劉符益反一音匹亦反沈音避疏下士師云諸侯為賔帥其屬蹕于王宫饗燕時此小司冦為王辟亦謂於宫中饗燕在寢及廟時也后世子之喪亦如之疏謂后世子之喪當朝廟時王出入亦辟也小師涖戮注小師王不自出之師凡大國之事使其屬蹕注屬士師以下孟冬祀司民獻民數於王王拜受之以圖國用而進退之注司民星名軒轅角也進退猶損益也國用民衆則益民寡則損疏前文大比登民數據三年而言此則據年年民數皆有增減嵗終則令羣士計獄弊訟登中于天府注上其所斷獄訟之數正嵗帥其屬而觀刑象令以木鐸曰不用法者國有常刑令羣士乃宣布于四方憲刑禁注憲表也謂縣之也刑禁士師之五禁乃命其屬入會乃致事注得其屬之計乃令致之於王訓按詢國大事之典在小司寇者以其掌外朝之政詢衆庶在外朝故也詢國大事是重典故在職首下文以五刑聽萬民之獄訟一節是綱以五聲求民情即聽其獄訟而附于刑也以八辟麗邦法即由命夫命婦與王之同族而類推之也聽民之刺宥以施刑罰則又是未定之疑獄而於五聽之外復有此博謀之事也士師之職掌國之五禁之法以左右刑罰一曰宫禁二曰官禁三曰國禁四曰野禁五曰軍禁皆以木鐸徇之于朝書而縣于門閭徇以俊反縣音玄注左右助也助刑罰者助其禁民為非也宫王宫也官官府也國城中也古之禁書亡矣今宫門有符籍官府有無故擅入城門有離載下帷野有田律軍有嚻歡夜行之禁其粗可言者訓按此即大司冦五刑之禁五刑自外而內五禁自內而外五刑無宫中之刑以王宫在內司冦不得施刑五禁無鄉禁者蓋國禁中可包鄉禁也以五戒先後刑罰毋使罪麗于民一曰誓用之于軍旅二曰誥用之于會同三曰禁用諸田役四曰糾用諸國中五曰憲用諸都鄙注先後猶左右也誓誥所見於書是也禁則軍禮曰無干車無自後射此其類也糾憲未有聞焉訓按禁者條列其事戒者則有文教之施五者蓋以事之大小為先後國中曰糾蓋即大司冦五刑糾萬民之事故五刑中無及都鄙以外事者是其國中之事也憲即布憲所掌但布憲中兼有邦國此云都鄙者都鄙亦國屬也國中近故可用糾察都鄙以外縣其告令而已掌鄉合州黨族閭比之聨與其民人之什伍使之相安相受以比追胥之事以施刑罰慶賞注鄉合鄉所合也疏州黨族閭比之聨即是鄉合之事五人為伍二伍為什據追胥之時相受謂相受寄托以施刑罰慶賞者使鄰伍相及也訓愚按追胥字義蓋追盜之胥役也州黨族閭比之聨是家與家相合也民人之什伍是人與人相合也無事則家相合而使之相安相受焉族師聨法是也有事則人相合而比追胥之事焉小司徒伍兩之法是也刑罰慶賞則通承二義也掌官中之政令注大司冦之官府中也察獄訟之辭以詔司冦斷獄弊訟致邦令注致邦令者以法報之掌士之八成注八成者行事有八篇一曰邦汋汋上灼反廣韻音妁市若切注汋讀如酌酒尊中之酌謂斟酌盜取國家密事若今時刺探尚書事訓或曰汋説文云激水聲也邦汋謂因兵役凶荒激民為亂二曰邦賊注為逆亂者三曰邦諜諜音牒注為異國反間四曰犯邦令注干冒王教令五曰嬌邦令嬌音矯注稱詐以有為者六曰為邦盜注竊取國之寶藏七曰為邦朋注朋黨相阿使政不平八曰為邦誣注誣罔使事失實訓按此謂之成者成而不變犯者無赦即王制四誅不以聽之條是也邦汋邦賊邦諜背叛不軌罪最重犯邦令嬌邦令是公行為惡者故次之嬌邦令如亂名改作嬌如言矯枉變更之謂為邦盜邦朋邦誣是狡獪為惡者又次之皆不待聽而誅者也邦誣者即王制所謂假於鬼神卜筮以疑衆是也若邦凶荒則以荒辨之法治之注辨當為貶飢荒則刑罰國事有所貶損朝士職曰若邦凶荒札喪冦戎之故則令邦國都家縣鄙慮刑貶訓按荒貶之法者當移民通財糾守緩刑時所施之刑罰也恐民因弛寬而致亂故亦設法以弭之但小貶而已令移民通財糾守緩刑注移民就賤救困也通財補不足也糾守備盜賊也緩刑舒民心也凡以財獄訟者正之以傅别約劑傅音附約於妙反又如字注傅别中别手書也約劑各所持券也若祭勝國之社稷則為之尸注以刑官為尸略之也王燕出入則前驅而辟注燕出入謂宫苑皆是祀五帝則沃尸及王盥洎鑊水洎其器反或音冀廣韻又音注洎謂增其沃汁疏按特牲少牢尸尊不就洗入門北面則以盤匜盥手王盥謂將獻尸時洎鑊水鑊在門外之東亨實鑊水此官增之示敬而已此直言祀五帝其餘祭祀則小祝職云大祭祀沃尸盥小臣職云大祭祀朝覲沃王盥是也鬱人凡祼事沃盥惟在宗廟為祼時凡刉珥則奉大牲刉音機劉音竒珥而志反注衈同注珥讀為衈刉衈釁禮之事用牲毛者曰刉羽者曰珥諸侯為賔則帥其屬而蹕于王宫注謂諸侯來朝若燕饗時疏其屬謂當官上士已下經云蹕于王宫饗在廟燕在寢言于王宫故知燕饗時也大喪亦如之疏大喪在宫中蹕者謂朝廟大師帥其屬而禁逆軍旅者與犯師禁者而戮之注逆軍旅反將命也犯師禁干行陳也嵗終則令正要會正嵗帥其屬而憲禁令于國及郊野訓禁戒所以使民不至於刑罰故在職守鄉合之法皆施於未刑罰之先亦禁戒之屬也故次之官中政令即大司寇小司寇所陳是也上文已見不必重言總曰政令而已掌政令而察獄訟之辭以佐助輕重斷獄此則刑罰之條也故又次之八成獄之不待聽者也故又次之大抵經文次第綱領在前條目在後職要者在前職詳者在後至於司寇之官則又警戒禁令之屬居前而刑殺戮辱之事居後荒貶之法則又非常時所施故最後也鄉士掌國中注國中距王城百里內也六鄉之獄在國中各掌其鄉之民數而糾戒之注鄉士八人言各者四人而分主三鄉疏言各則有部分故以四人分主三鄉解之聽其獄訟察其辭辨其獄訟異其死刑之罪而要之旬而職聽于朝注辨異謂殊其文書也要之為其罪法之要辭如今劾矣十日乃以職事治之於外朝容其自反覆疏辨其獄訟獄謂爭罪訟謂爭財文書有異死刑之罪者死與四刑文書亦異也注云容其自反覆者恐囚虛承其罪十日不翻即是其實然後向外朝對衆更詢乃與之罪司寇聽之斷其獄弊其訟于朝羣士司刑皆在各麗其法以議獄訟注各麗其法者各依其罪不得濫出濫入獄訟成士師受中協日刑殺肆之三日注受中謂受獄訟之成也士師既受獄訟之成鄉士則擇可刑殺之日至其時而往涖之尸之三日乃反也疏肆之三日據死者言其四刑之類行訖即放不須肆之其肆之也大夫於朝士于市鄭云鄉士擇可刑殺之日而往涖之者士師總攝諸士但士師受中所刑殺者則鄉士遂士等各自往涖之訓按各麗其法謂之各者當刑當殺各異也協日刑殺亦是或刑或殺肆之三日乃専指殺若欲免之則王會其期注免猶赦也期謂鄉士職聽于朝司冦聽之日王欲赦之則用此時親往議之訓按欲免之屬蓋所謂議親議貴者是也大祭祀大喪紀大軍旅大賔客則各掌其鄉之禁令帥其屬夾道而蹕夾古洽反注屬中士以下疏大祭祀若祭天及迎氣皆於郊此四者並過六鄉路故掌其禁令而蹕也三公若有邦事則為之前驅而辟其喪亦如之為于偽反遂士縣士訝士職同疏其喪亦如之謂公卿大夫之喪死於此者凡國有大事則戮其犯命者疏大事謂征伐田獵之事故有犯命刑戮之事也遂士掌四郊注謂距王城百里以外至二百里言掌四郊者六遂之獄在四郊各掌其遂之民數而糾其戒令注遂士十二人言各者二人而分主一遂聽其獄訟察其辭辨其獄訟異其死刑之罪而要之二旬而職聽于朝司冦聽之斷其獄弊其訟于朝羣士司刑皆在各麗其法以議獄訟獄訟成士師受中協日就郊而刑殺各於其遂肆之三日注言各於其遂者四郊六遂遂處不同若欲免之則王令三公會其期訓按命三公六卿者王不得逐期身親故使公卿分勞若邦有大事聚衆庶則各掌其遂之禁令帥其屬而蹕疏此在四郊之外無祭祀喪紀惟有軍旅賔客田役有聚衆庶之事故總云大事聚衆庶也六卿若有邦事則為之前驅而辟其喪亦如之凡郊有大事則戮其犯命者縣士掌野注距王城二百里以外至三百里曰野三百里以外至四百里曰縣四百里以外至五百里曰都都縣野之地其邑非王子弟公卿大夫之采地則皆公邑也謂之縣縣士掌其獄焉言掌野者郊外曰野大總言之也獄居近野之縣獄在二百里上縣之縣獄在三百里上都之縣獄在四百里上各掌其縣之民數糾其戒令而聽其獄訟察其辭辨其獄訟異其死刑之罪而要之三旬而職聽于朝司冦聽之斷其獄弊其訟于朝羣士司刑皆在各麗其法以議獄訟獄訟成士師受中協日刑殺各就其縣肆之三日若欲免之則王命六卿會其期若邦有大役聚衆庶則各掌其縣之禁令若大夫有邦事則為之前驅而辟其喪亦如之凡野有大事則戮其犯命者方士掌都家注都王子弟及公卿之采地家大夫之采地大都任疆地小都任縣地家邑任稍地不言掌其民數民不純屬王疏縣士掌三等公邑之獄方士掌三等采地之獄且縣士掌三等公邑之獄親自掌之若方士掌三等采地之獄則遙掌之采地自有都家之士掌獄有事上於方士耳聽其獄訟之辭辨其死刑之罪而要之三月而上獄訟于國注三月乃上要又變朝言國以其自有君異之司冦聽其成于朝羣士司刑皆在各麗其法以議獄訟注成平也獄訟成士師受中書其刑殺之成與其聽獄訟者注都家之吏自協日刑殺但書其成與治獄之吏姓名備反覆有失實者凡都家之大事聚衆庶則各掌其方之禁令注方士十六人言各掌其方者四人而主一方也其方以王之事動衆則為班禁令焉以時修其縣法若嵗終則省之而誅賞焉注縣法縣師之職也其職掌邦國都鄙稍甸郊野之地域而辨其夫家人民田萊之數及其六畜車輦之稽方士以四時修此法嵗終又省之則與掌民數亦相近凡都家之士所上治則主之注所上治謂獄訟之小事不附罪者也主之告于司冦聽平之訝士掌四方之獄訟注四方諸侯之獄訟諭罪刑于邦國注告曉以麗罪及制刑之本意凡四方之有治於士者造焉造七報反注謂獻疑辨事先來詣乃通之於士也士主謂士師也四方有亂獄則往而成之注亂獄謂若君臣宣淫上下相虐者也往而成之猶吕步舒治淮南獄邦有賔客則與行人送逆之入於國則為之前驅而辟野亦如之居館則帥其屬而為之蹕誅戮暴客者客出入則道之有治則贊之道音導注送逆謂始來及去也出入謂朝覲于王時也春秋傳晉侯受䇿以出出入三覲凡邦之大事聚衆庶則讀其誓禁疏大事征伐之等訝士讀誓命及五禁之法也朝士掌建邦外朝之法左九棘孤卿大夫位焉羣士在其後右九棘公侯伯子男位焉羣吏在其後面三槐三公位焉州長衆庶在其後左嘉石平罷民焉右肺石達窮民焉長丁丈反罷音皮注樹棘以為位者取其赤心而外刺象以赤心三刺也槐之言懷也懷來人於此欲與之謀羣吏謂府史也州長鄉遂之官鄭司農云王有五門外曰臯門二曰雉門三曰庫門四曰應門五曰路門路門一曰畢門外朝在路門外內朝在路門內玄謂明堂位説魯公宫曰庫門天子臯門雉門天子應門言魯用天子之禮所名曰庫門者如天子臯門所名曰雉門者如天子應門則魯無臯門應門矣檀弓曰魯莊公之喪既葬而絰不入庫門言其除喪而反由外來是庫門在雉門外必矣如是王五門雉門為中門雉門設兩觀與今之宫門同閽人幾出入者窮民蓋不得入也郊特牲譏繹于庫門內言逺也禮當於廟門廟在庫門之內見於此矣然則外朝在庫門之外臯門之內與周天子諸侯皆有三朝外朝一內朝二內朝之在路門內者或謂之燕朝帥其屬而以鞭呼趨且辟禁慢朝錯立族談者趨本又作趣同七須反劉音清欲反注慢朝謂臨朝不肅敬也疏族聚也凡得獲貨賄人民六畜者委于朝告于士旬而舉之大者公之小者庶民私之注俘而取之曰獲委於朝十日待來識之者人民謂刑人奴𨽻逃亡者大者公之大物沒入公家也人民之小者未齓七嵗以下凡士之治有期日國中一旬郊二旬野三旬都三月邦國期期內之治聽期外不聽疏此即上鄉士之等獄訟成來於外朝職聽期外不聽所以省煩息訟也凡有責者有判書以治則聽注判半分而合者鄭司農云謂若今時辭訟有券書者為治之玄謂古者出責之息亦如國服與凡民同貨財者令以國法行之犯令者刑罰之注鄭司農云同貨財者謂合錢共賈者也以國法行之司市為節以遣之玄謂同貨財者富人蓄積者多時收斂之乏時以國服出之雖有騰躍其贏不得過此過此則罰之若今時加貴取息取息坐臧訓按此同貨財即泉府所謂同貨斂賒文既不異故以泉府斂售之法解之凡屬責者以其地傅而聽其辭屬如字或音燭傳音付注屬責轉責使人歸之而本主死亡歸受之數相抵冒者也以其地之人相比近能為證者來乃受其辭為治疏轉責使人歸之者謂有人取他責乃别轉與人使子本依契而還財主也歸受之數相抵冒者後受責之人見轉責者死亡詐言所受時少是相抵冒也凡盜賊軍鄉邑及家人殺之無罪注盜賊羣輩若軍共攻鄉邑及家人者殺之無罪凡報仇讐者書於士殺之無罪注謂同國不相辟者將報必先言於士若邦凶荒札喪冦戎之故則令邦國都家縣鄙慮刑貶注慮謀也貶猶減也謂當圖謀緩刑且減國用為民困也所貶視時為多少之法疏所貶視時多少者凶荒之事重則所貶多事輕則所貶少也訓葉氏少藴曰周有三朝一曰燕朝在路門之內王圖宗人嘉事之朝也大僕小臣掌焉一曰治朝在路門之外王日聽治之朝也宰夫司士掌焉一曰外朝在庫門之外詢萬民聽政之朝也小司冦朝士掌焉外朝之位百姓衆庶固得與公侯卿士羣吏相可否若夫治朝之位司士正其儀宰夫掌其法而庶民之逆得與諸臣之復賔客之治同徹于天子之前又未嘗以嚴禁為限矣燕朝之法則大僕掌諸侯之復逆小臣掌三公孤卿之復逆御僕掌羣吏庶民之復逆而大僕復建路鼓于大寢門外以待達窮與遽令則逆御僕聽其所陳而白于王又未嘗以邃深為隔矣然外朝雖掌于司冦朝士而三公孤卿在焉則大宰與聞外朝之政矣治朝雖掌于司馬司士而宰夫掌其禁冢宰贊其治則大宰實參治朝之事矣燕朝雖亦夏官之屬然羣臣之復逆宰夫與有職焉况大僕雖掌燕朝而王視治朝之時則大僕正其位王不視朝則辭於三公及孤卿是燕朝之人實與治朝相通則大宰亦與聞乎燕朝之政矣以此見成周之治宫中府中俱為一體而無內外之分也司民掌登萬民之數自生齒以上皆書於版辨其國中與其都鄙及其郊野異其男女嵗登下其死生及三年大比以萬民之數詔司寇司寇及孟冬祀司民之曰獻其數于王王拜受之登于天府內史司會冢宰二之以贊王治注司民軒轅角也三官以二佐王治者當以民多少黜陟王民之吏疏軒轅有十七星如龍形有兩角角有大民小民司刑掌五刑之法以麗萬民之罪墨罪五百劓罪五百宫罪五百刖罪五百殺罪五百劓魚器反李魚介反刖音月又五刮反注墨黥也先刻其靣以墨窒之劓截其鼻也宫者丈夫則割其勢女子閉於宫中若今宦男女也刖斷足也周改臏作刖殺死刑也書傳曰決關梁踰城郭而略盜者其刑臏男女不以義交者其刑宫觸易君命革輿服制度姦軌盜攘傷人者其刑劓非事而事之出入不以道義而誦不詳之辭者其刑墨降畔冦賊劫略奪攘嬌虔者其刑死此二千五百罪之目略也其刑書則亡夏刑大辟二百臏辟三百宫辟五百劓墨各千周則變焉所謂刑罰世輕世重者也疏按左傳史克云在九刑不亡鄭注堯典云正刑五加之流宥鞭撲贖刑此謂九刑漢文帝所赦肉刑惟赦墨劓與刖三者其宫刑至隋乃除也若司冦斷獄弊訟則以五刑之法詔刑罰而以辨罪之輕重司刺掌三刺三宥三赦之法以贊司冦聽獄訟刺七賜反注刺殺也訊而有罪則殺之宥寬也赦舍也一刺曰訊羣臣再刺曰訊羣吏三刺曰訊萬民一宥曰不識再宥曰過失三宥曰遺忘注識審也不審若今仇讐當報甲見乙誠以為甲而殺之者過失若舉刃欲斫伐而軼中人者遺忘若間帷薄忘有在焉而以兵矢投射之一赦曰幼弱再赦曰老旄三赦曰舂愚旄耄同亡報反舂貞巷反廣韻音舂書容切注舂愚生而癡騃童昏者疏三赦與前三宥所以異者三宥是過誤所作雖非故心比三赦為重據今仍使出贖此三赦之等比上為輕全放無贖老耄幼弱案曲禮云悼與耄雖有罪不加刑焉是也以此三法者求民情斷民中而施上服下服之罪然後刑殺司約掌邦國及萬民之約劑治神之約為上治民之約次之治地之約次之治功之約次之治器之約次之治摯之約次之約於妙反注此六約者諸侯以下至於民皆有焉劑謂券書也治者理其相抵冒上下之差也神約謂命祀郊社羣望及所祖宗也夔子不祀祝融楚人伐之民約謂征稅遷移仇讐既和若懷宗九姓在晉殷民六族七族在魯衛皆是也地約謂經界所至田萊之比也功約謂王功國功之屬賞爵所及也器約謂禮樂吉凶車服所得用也摯約謂玉帛禽鳥相與往來也凡大約劑書於宗彝小約劑書於丹圖注大約劑邦國約也書於宗廟之六彝欲神監焉小約劑萬民約也丹圖未聞或有雕器簠簋之屬有圖象者與春秋傳曰斐豹𨽻也著於丹書今俗語有鐵券丹書豈非舊典之遺言若有訟者則珥而辟藏其不信者服墨刑辟闢通下六官辟藏倣此注訟訟約若宋仲幾薛宰者也辟藏開府視約書不信不如約也珥讀曰衈謂殺雞取血釁其户若大亂則六官辟藏其不信者殺注大亂謂僭約若吳楚之君晉文公請隧以葬者六官辟藏明罪大也六官初受盟約之二司盟掌盟載之法注載盟辭也盟者書其辭於䇿殺牲取血坎其牲加書於上而埋之謂之載書凡邦國有疑會同則掌其盟約之載及其禮儀北靣詔明神既盟則二之注有疑不協也明神謂日月山川也覲禮加方明于壇上所以依之也詔之者讀其載書以告之也二之者寫副當以授六官訓愚謂二即在司盟故曰載在盟府其正則與牲俱埋矣盟萬民之犯命者詛其不信者亦如之詛側慮反注盟詛者欲相與共惡之也犯命犯君教令也不信違約者也如春秋傳盟臧氏及鄭伯詛射潁考叔者凡民之有約劑者其二在司盟疏此謂司約副寫一通來入司盟有獄訟者則使之盟詛注不信則不敢聽此盟詛所以省獄訟凡盟詛各以其地域之衆庶共其牲而致焉既盟則為司盟共祈酒脯注使其邑閭出牲而來盟已又使出酒脯司盟為之祈明神使不信者必凶周禮纂訓卷十九
