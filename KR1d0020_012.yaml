body:
  text: 周禮纂訓卷十二安溪李鍾倫撰大司樂掌成均之法以治建國之學政而合國之子弟焉注董仲舒云成均五帝之學疏國之子弟案王制云王太子王子公卿大夫元士之適子國之俊選是也凡有道者有德者使教焉死則以為樂祖祭於瞽宗注明堂位曰瞽宗殷學也以樂德教國子中和祗庸孝友注中猶忠也和剛柔適也祗敬庸有常也善父母曰孝善兄弟曰友以樂語教國子興道諷誦言語興許應反道注讀曰導注興者以善物喻善事道言古以剴今也倍文曰諷以聲節之曰誦發端曰言答述曰語疏倍文曰諷謂不開讀之誦亦背文但諷是直言之無吟咏誦則又為吟咏以聲節之以樂舞教國子舞雲門大卷大咸大磬大夏大濩大武卷音權又居逺反磬上昭反濩户故反注此周所存六代之樂黃帝曰雲門大卷言其德如雲之所出民得以有族類大咸咸池堯樂言其德無所不施大磬舜樂言其德能紹堯之道大夏禹樂也禹能治水傅土言其德能大中國也大濩湯樂也言其德能使天下得其所也大武武王樂也言其德能成武功疏知此六舞是黃帝堯舜夏殷周者並依樂緯及元命􅊶云德如雲之出者解雲門云民得以有族類者解大卷卷聚之義即族類也云德無不施者解咸池咸皆也池施也云大中國者夏大也云使天下得所者解大濩濩即救濩也案考經緯云伏義樂曰立基神農樂曰下謀祝融曰屬讀樂緯云顓頊樂曰五莖帝嚳樂曰六英皇甫謐曰少昊樂曰九淵訓家君子曰周兼立四代之學舉成均為尊也其法則樂德樂語樂舞之類立師教之死而祀之於學所謂釋菜於先師也以六律六同五聲八音六舞大合樂以致鬼神示以和邦國以諧萬民以安賔客以説逺人以作動物注六律陽聲六同隂聲此十二者以銅為管轉而相生黃鍾為首其長九寸各因而三分之上生者益一分下生者去一焉大合樂者謂遍作六代之樂以冬日至作之致天神人鬼以夏日至作之致地示物魅動物羽裸之屬疏云六律六同者舉十二管以表其鍾樂器之中不用管也此據正祭合樂下文六變八變之等據下神時下神用一代樂此用六代合樂不一時俱為待一代訖乃更作云以冬至致天神云云案彼注致人鬼於祖廟致物魅於壇墠蓋用祭天地之明日若然此經合樂據天地宗廟大神而引彼人鬼物魅小神者約合樂與大神同但彼人鬼非宗廟正祭為異耳訓家君子曰大合樂乃肄習於樂之事其用則格鬼神動民物樂之效也律以為聲之和聲以為音之節故其立文之序如此自鬼神示以及動物其序則自尊而卑自近而逺也案大司樂即尚書典樂之職六德即直寬剛簡之類興道諷誦言語則詩言志歌永言之事也于是播之律同音聲用之幽明上下則所謂八音克諧神人以和者也乃分樂而序之以祭以享以祀注分謂各用一代之樂乃奏黃鍾歌大吕舞雲門以祀天神注以黃鍾之鍾大吕之聲為均者黃鍾陽聲之首大吕為之合奏之以祀天神尊之也天神謂五帝及日月星辰王者又各以夏正月祀其所受命之帝於南郊疏云黃鍾之鍾大吕之聲者以經言奏是擊以出聲歌是發口出音實歌奏通也言為鈞者欲作樂先擊此二者之鍾以均諸樂言合者據十二辰斗建與日辰相配合云天神謂五帝日月星辰及夏正祀受命帝於南郊者對下六變天神皆降是昊天也乃奏大蔟歌應鍾舞咸池以祭地示蔟音輳倉奏切注大蔟陽聲第二應鍾為之合咸池大咸地示所祭於北郊謂神州之神及社稷乃奏姑洗歌南吕舞大磬以祀四望注姑洗陽聲第三南吕為之合四望五嶽四鎮四竇此言祀者司中司命風師雨師或亦用此樂與乃奏㽔賔歌函鍾舞大夏以祭山川㽔音綏儒佳切又人誰切函胡南反注蕤賔陽聲第四函鍾為之合函鍾一名林鍾乃奏夷則歌小吕舞大濩以享先妣注夷則陽聲第五小吕為之合小吕一名中吕先妣薑嫄感神靈而生后稷周之先母也周立廟自后稷始薑嫄無所妃是以特立廟而祭之謂之閟宫疏案祭法王立七廟不見先妣者以其七廟外非常若祭當與二祧同享嘗乃止妃音配乃奏無射歌夾鍾舞大武以享先祖射音亦注無射陽聲之下也夾鍾為之合夾鍾一名圜鍾先祖謂先王先公訓家君子曰上言祭享祀三事而此乃有六樂者蓋有祀日月星辰不繫於天祭嶽瀆山川不繫於地特祭閟宫分享羣廟之時然其祀曰祭曰享則仍蒙上文其實三事而已四望日月星辰也黃鍾陽辰之始而大吕合之天主大始故以祀天也應鍾隂辰之終而太蔟合之地居成物故以祭地也姑洗陽辰之終而南吕合之四望次於天故以祀四望也函鍾隂辰之始而㽔賔合之山川次於地故以祭山川也夷則西方小吕合之夾鍾東方而無射合之人事始於卯終於申故以享先妣先祖也天主奏地主歌妣反主奏祖反主歌者周尊薑嫄故以妣為先每二律歌奏則别為二調然通謂之一樂者所用同也凡此二律者特以之起調畢曲耳其間五聲蓋各以其律從而為八音之節故曰文之以五聲播之以八音凡六樂者文之以五聲播之以八音凡六樂者一變而致羽物及川澤之示再變而致裸物及山林之示三變而致鱗物及立陵之示四變而致毛物及墳衍之示五變而致介物及土示六變而致象物及天神注變猶更也樂成則更奏也此謂大蠟索鬼神而致百物六奏樂而禮畢東方之祭則用太蔟姑洗南方用蕤賔西方用夷則無射北方用黃鍾每奏有所感致和以來之凡動物敏疾者地祗髙下之甚者易致羽物既飛又走川澤有孔竅者蛤蟹走則遲墳衍孔竅則小矣是其所以舒疾之分土示原隰及平地之神也象物有象在天所謂四靈者天地之神四靈之知非德至和則不至也訓家君子曰變猶更也樂成則更奏故一成亦為一變此條通論為樂感召之理以起下六變八變九變之端也羽物輕清得氣之先其次則裸物為其近於人也其次則鱗次毛次介以動靜之性為别川澤之竅大山林之氣疏其次丘陵次墳衍次土示以氣之通塞為序也象物聚而成象不可常者六變而致象物及天神故下云樂六變則天神可得而禮也由此而八變以興地示九變以來人鬼不究言之者省文也注以此為大蠟之樂特因經文及於百物故緣以起義不知蠟祭則吹豳頌擊土鼓乃籥章氏掌之非大司樂之事且據注四方之蠟各用其律是四樂也反蒙六樂之文何哉凡樂圜鍾為宫黃鍾為角大蔟為徴姑洗為羽靁鼓靁鼗孤竹之管雲和之琴瑟雲門之舞冬日至於地上之圜丘奏之若樂六變則天神皆降可得而禮矣凡樂函鍾為宫太簇為角姑洗為徴南吕為羽靈鼓靈鼗孫竹之管空桑之琴瑟咸池之舞夏日至於澤中之方丘奏之若樂八變則地示皆出可得而禮矣凡樂黃鍾為宫大吕為角大蔟為徴應鍾為羽路鼓路鼗隂竹之管龍門之琴瑟九德之歌九磬之舞於宗廟之中奏之若樂九變則人鬼可得而禮矣角如字古音鹿徴張里反下同靁音雷注此三者皆禘大祭也天神則主北辰地示則主昆崘人鬼則主后稷先奏是樂以致天神禮之以玉而祼焉乃後合樂而祭之圜鍾夾鍾也夾鍾生於房心之氣房心為大辰天帝之明堂函鍾林鍾也林鍾生於未之氣未坤之位黃鍾生於虛危之氣虛危為宗廟以此三者為宫用聲類求之天宫夾鍾隂聲其相生從陽數其陽無射無射上生中吕中吕與地宫同位不用也中吕上生黃鍾黃鍾下生林鍾林鍾地宫又不用林鍾上生大蔟大蔟下生南吕南吕與無射同位又不用南吕上生姑洗地宫林鍾林鍾上生大蔟大蔟下生南吕南吕上生姑洗人宫黃鍾黃鍾下生林鍾林鍾地宫又辟之林鍾上生大蔟大蔟下生南吕南吕與天宫之陽同位又辟之南吕上生姑洗姑洗南吕之合又辟之姑洗下生應鍾應鍾上生蕤賔蕤賔地官林鍾之陽又辟之蕤賔上生大吕凡五聲官之所生濁者為角清者為徴羽此樂無商者祭尚柔商堅剛也靁鼓靁鼗八面靈鼓靈鼗六面路鼓路鼗四面孤竹特生者孫竹竹枝根之未生者隂竹生於北山者雲和空桑龍門皆山名九磬當為大韶疏云三樂皆禘大祭者案爾雅云禘大祭是不辨鬼神示皆有禘稱圜丘者取自然之丘圜象天無問東西南北方皆可方丘亦然因髙事天因下事地也訓家君子曰上六樂者用以祭享祀各有二焉此則合二者而一之蓋陽生而郊天配以日月星辰隂生而祭地配以嶽瀆山川大事于太廟配以羣后之時也所用之律與前文同但錯互黃鍾圜鍾之文又誤小吕為南吕耳其云某律為宫者即本律為之其云某律為角為徴為羽者非本律為之乃謂本律之角之徴之羽也且若圜丘之樂宫固黃鍾也黃鍾之角則姑洗也大蔟之徴則南吕也姑洗之羽則大吕也方丘宗廟莫不皆然蓋合天神四望之樂以奏於圜丘合地示山川之樂以奏於方澤合先妣先祖之樂以奏於太廟也無商者祭祀吉禮商殺伐之聲故去之人鬼之樂卯與戌合當用無射而復用南吕者戌與乾維金氣之盛故亦去之而用卯衝焉蓋去商者去其調也去無射者去其律之調也至於調中之聲律則雖商與無射未嘗不用也其必用黃鍾林鍾圜鍾為宫者天氣始於子終於辰地氣始於未終於亥人事始於卯終於申故以三始者為宫也義既有取氣亦相應冬至祀天自當用黃鍾冬至之律夏至祭地午為陽律取未與午合自當用林鍾為宫宗廟之祭以春為首自當用圜鍾春分之律夫陽始於子而終已隂始於午而終亥人統始於寅今曰陽終於辰隂始於未人始於卯者蓋陽終於己而已為隂律隂始於午而午為陽律惟子寅辰為陽中之陽是陽終于辰也故以子辰之合祀天神四望惟未酉亥為隂中之隂是隂始于未也故以亥未之合祭地示山川寅雖人統然人之六辰固欲兼天地而用之自卯至申各用隂陽之半故曰人始於卯其用六代之舞亦與前異者在天則統以天神之舞在地則統以地示之舞在人則以古樂為尊故用大韶焉音有八而僅舉鼗鼓管琴瑟者堂上舉琴瑟堂下舉管與鼗鼓為諸聲之綱也其三樂之變數多寡不同者天動而地靜動者速靜者遲天地伸而人鬼屈伸者易求屈者難致也上六變者五土之示皆已畢至而此謂樂八變地示乃出者前所致是山川之類經别地示於山川故八變而出也注家以此為大祭降神之樂以上大合樂為大祭行禮時樂不知合樂者惟肄習于學宫為多若用之賔祭蓋無考焉春秋吳季子觀六代之樂亦陳而觀之耳且别以一樂降神又合樂以祭其説亦有所不通也又案樂所歌奏必有其文如禮記升歌清廟下而管象以舞大武及此經九德之歌九韶之舞是也神示樂章當亦有之蓋經偶不及之耳凡樂事大祭祀宿縣遂以聲展之縣音玄注叩聽其聲具陳次之以知完否疏宿縣先宿豫縣之訓家君子曰樂事總下祭祀饗射侑食愷獻之類王出入則令奏王夏尸出入則令奏肆夏牲出入則令奏昭夏帥國子而舞尸音尸本亦作尸注三夏皆樂章名疏此據祭祀言出入謂廟門牲出入謂迎牲及獻爓獻熟時也訓家君子曰祭祀用樂詳見前文但正樂之外復有此三樂以贊出入也樂之諸工各有所屬而國子六舞乃大司樂所奏故特言之大饗不入牲其他皆如祭祀注大饗饗賔客也疏大饗在廟外殺牲烹之升鼎乃入訓家君子曰不入牲則不奏昭夏但王出入賔出入奏王夏肆夏而已其宿縣展聲命舞亦與祭祀同也凡五禮用樂惟祭祀饗燕為盛其樂有升歌有笙管有間歌有合樂各有樂章以歆鬼神以娛賔客而又奏九夏以出入於有司徹而歌雍及乎燕樂縵樂莫不陳而觀之他若大射大食大獻之屬各隨其事用樂而已則不若祭享之備也大射王出入令奏王夏及射令奏騶虞騶音鄒側鳩切注王射以騶虞為節疏大射將祭擇士而射於西郊虞庠詔諸侯以弓矢舞注舞謂執弓挾矢揖讓進退之儀疏此諸侯來朝將助祭而預大射之時案大射儀三耦執弓挾矢當階揖升揖當物揖降揖是其舞節也王大食三侑皆令奏鍾鼓侑音又注大食朔月月半以樂侑食時也疏凡常日食亦有樂侑食但大司樂不令奏鍾鼓王師大獻則令奏愷樂注大獻獻捷于祖愷樂獻功之樂疏案鄭志答趙商問云司馬云師大獻則獻社司樂宗伯之屬主宗廟之禮則獻于祖凡日月食四鎮五嶽崩大傀異災諸侯薨令去樂傀劉九靡反舊音怪説文以為傀偉之字廣韻音瑰公回切又音磈注四鎮揚州之會稽青州之沂山幽州之醫無閭冀州之霍山五嶽岱在兗州衡在荆州華在豫州嵩在雍州恆在并州傀猶怪也大怪異災謂若星辰奔隕及震裂為害者大札大凶大災大臣死凡國之大憂令弛縣札則八反鄭音截弛式氏反注札疫癘也凶凶年也災水火也訓家君子曰去樂者去之不作弛縣者釋下其器弛縣蓋久矣大憂蓋即大喪凡建國禁其淫聲過聲凶聲慢聲注淫聲若鄭衛也過聲失哀樂之節凶聲亡國之聲若桑間濮上慢聲惰慢不恭訓家君子曰國諸侯之國太師陳詩以觀民風則司樂因而禁之大喪涖廞樂器及葬藏樂器亦如之廞許金反注廞興也謂作之也涖笙師鏄師之屬訓家君子曰此樂器蓋謂明器樂師掌國學之政以教國子小舞注謂以年幼少時教之舞內則曰十三舞勺成童舞象二十舞大夏疏勺即周頌酌序云酌告成大武也注云周公居攝六年所作象序云維清注云象用兵時刺伐武王所制此皆詩為樂章與武人為節勺象少時學之二十成人而舞大夏則雲門已下六舞皆學也凡舞有帗舞有羽舞有皇舞有旄舞有干舞有人舞帗音拂一音弗廣韻音弗分勿切注帗析五采繒羽舞者析羽皇舞雜五采羽如鳳凰色持以舞旄舞氂牛之尾干舞者兵舞人舞者手舞社稷以帗四方以羽旱暵以皇辟雍以旄山川以干宗廟以人疏辟雍以旄宗廟以人無正文餘四舞並依舞師訓家君子曰宗廟之舞干羽並備何嘗専用人舞蓋舞器有此六者其用之各以其宜不必分事與地舞師所稱蓋謂民間之樂故器不得備其施於國則否教樂儀行以肆夏趨以采薺車亦如之環拜以鍾鼓為節薺本作齊徐私反廣韻音茨又才禮切注肆夏采薺皆樂名或曰皆逸詩行謂於大寢之中趨謂於朝廷爾雅曰堂上謂之行門外謂之趨然則王出既服至堂而肆夏作出路門而采薺作其反入至應門路門亦如之此謂步迎賔客王如有車出之事登車於大寢西階之前反降於阼階之前尚書傳曰天子將出撞黃鍾之鐘右五鐘皆應入則撞蕤賔之鐘左五鐘皆應大師於是奏樂環謂旋也疏此王行迎賔若春夏受贄於朝無迎法受享於廟則迎之秋冬一受之於廟並無迎法若饗食在廟燕在寢則皆有迎法車不可云行趨但於門外奏采齊門內奏肆夏耳訓家君子曰此所教者自王以下非止國子樂儀凡行趨登車周旋拜跪及射其節應乎樂者皆是凡射王以騶虞為節諸侯以貍首為節大夫以采蘋為節士以采蘩為節注騶虞采蘋采蘩在國風召南貍首曽孫疏案射義曰曽孫侯氏四正具舉云云是貍首也凡樂掌其序事治其樂政注序事次序用樂之事訓家君子曰凡謂下祭饗射獻之事凡國之小事用樂者令奏鐘鼓注小事小祭祀之事疏大祀次祀則大司樂令之此小祀有鍾鼓但無舞故舞師云小祭祀則不興舞訓家君子曰奏鍾鼓然後隨樂以作凡樂成則告備注成謂所奏一竟燕禮曰大射告于樂正曰正歌備疏燕禮是諸侯禮大師告樂正樂正告賔與君此天子禮則太師告樂師樂師告王詔來瞽臯舞注瞽當為鼓臯當告呼擊鼓者又告當舞者持鼓與舞俱來也訓家君子曰鼓蓋所節舞凡舞皆於合樂之時故於告備之後言之及徹帥學士而歌徹注學士國子也徹者歌雍令相相息亮反注令視瞭扶工言當罷也饗食諸侯序其樂事令奏鍾鼓令相如祭之儀食音嗣凡言饗食皆音嗣放此疏云如祭之儀則饗食徹亦歌雍矣燕射帥射夫以弓矢舞注射夫衆耦也樂出入令奏鍾鼓注樂出入謂笙歌舞者及其器凡軍大獻教愷歌遂倡之倡昌亮反注樂師主倡也訓家君子曰大司樂令奏樂師教而倡之凡喪陳樂器則帥樂官注帥樂官往陳之疏樂器明器樂官亦謂笙師鎛師之屬及序哭亦如之注哭此樂器亦帥之疏小宗伯視葬獻器遂哭之據將葬獻材時此據入壙時凡樂官掌其政令聽其治頌疏樂官謂大胥至司干大胥學學士之版以待致諸子春入學舍采合舞秋頒學合聲版音板舍音釋采音菜注學士謂卿大夫諸子學舞者版籍也大胥主此籍以待當召聚學舞者春始以學士入學宫而學之合舞等其進退使應節奏月令仲春之月上丁命樂正習舞釋菜仲丁又命學正入學習樂舍即釋也采讀為菜始入學必釋菜禮先師也菜蘋蘩之屬春使之學秋頒其才藝所為合聲亦等其曲折使應節奏疏頒分也分其才藝髙下訓合舞合聲之時皆當悉致諸子學士主舞樂官主聲使互相應合春合舞以考諸子秋合聲以比樂官以六樂之會正舞位注大同六樂之節奏正其位使相應也言為大合樂習之以序出入舞者注以長幼次之使出入不紕錯比樂官展樂器注比猶校也展謂陳數之訓會謂節奏如言欵會合舞則正舞位序舞者合聲則比樂官展樂器凡祭祀之用樂者以鼓徴學士注擊鼓以召之序宫中之事注家君子曰商書曰敢有恆舞于宫酣歌于室時為巫風周官大胥兼序宫中之事意深矣小胥掌學士之徴令而比之觥其不敬者觥古橫反本或作觥注不敬謂慢期不時至也觥罰爵也疏大胥掌學士之版以召舞者小胥贊大胥為徴令較比之巡舞列而撻其怠慢者撻吐達反注撻猶抶也抶以荆撲抶敕乙反撲普卜反正樂縣之位王官縣諸侯軒縣卿大夫判縣士特縣辨其聲注樂縣謂鐘磬之屬縣于筍簴者宫縣四面縣軒縣去南面判縣左右之合又空北面特縣縣於東方或於階間而已四面象宫室四面有牆故謂之宫縣軒縣三面其形曲故春秋傳曰請曲縣繁纓以朝諸侯之禮也疏云鍾磬之屬者凡縣通有鼓鎛亦縣之簴音巨起吕反下虡同凡縣鍾磬半為堵全為肆堵丁古反注鍾磬者編縣之二八十六枚而在一虡謂之堵鍾一堵磬一堵謂之肆半之者謂諸侯之卿大夫士也諸侯之卿大夫半天子之卿大夫西縣鍾東縣磬士亦半天子之士縣磬而已疏直言鍾磬不言鼓鎛者周人縣鼓與鎛之大鍾惟縣一而已不編縣故不言其十二辰之之零鍾亦縣一而已鄭知此有十六枚在一虡者按左傳衆仲云夫舞所以節八音而行八風故以八為數樂縣取數於此又倍之為十六訓家君子曰鍾磬十六者蓋十二正律并四清聲耳樂惟五聲得以為調十二律旋相為宫而自夷則以下少一聲自夾鍾以下少二聲自無射以下少三聲自仲吕以下少四聲故復為四清聲以具商角徴羽之調此鍾磬所以有十六也二變不為調故不登於縣疏以八風釋之恐非其旨凡樂縣皆在堂下惟琴瑟在堂上天子諸侯每面縣皆有鍾磬鎛及鼓卿大夫士無鎛天子之卿大夫東西各有鍾磬二肆相對諸侯之卿大夫分鍾磬為東西二堵相對合之亦一肆天子之士惟有鍾磬在東亦為一肆諸侯之士縣磬為鍾則堵而已家君子曰自大司樂樂師及大胥小胥皆以教為職而凡樂之政令綱紀屬焉自太師以下則無與國學之政所司者器數聲音一節之事所教者其屬而已大師掌六律六同以合隂陽之聲陽聲黃鍾大蔟姑洗蕤賔夷則無射隂聲大吕應鍾南吕函鍾小吕夾鍾皆文之以五聲宫商角徴羽皆播之以八音金石土革絲木匏竹注以合隂陽之聲者聲之隂陽各有合黃鍾子之氣也十一月建焉而辰在星紀大吕丑之氣也十二月建焉而辰在玄枵大蔟寅之氣也正月建寅而辰在娵訾應鍾亥之氣也十月建焉而辰在析木姑洗辰之氣也三月建焉而辰在大梁南吕酉之氣也八月建焉而辰在夀星蕤賔午之氣也五月建焉而辰在鶉首林鍾未之氣也六月建焉而辰在鶉火夷則申之氣也七月建焉而辰在鶉尾中吕已之氣也四月建焉而辰在實沈無射戌之氣也九月建焉而辰在大火夾鍾卯之氣也二月建焉而辰在降婁辰與建交錯貿處是其合也其相生則以隂陽六體為之黃鍾初九下生林鍾初六林鍾上生大蔟九二大蔟下生南吕六二南吕上生姑洗九三姑洗下生應鍾六三應鍾上生蕤賔九四蕤賔下生大吕六四大吕上生夷則九五夷則下生夾鍾六五夾鍾上生無射上九無射上生中吕上六同位者象夫妻異位者象子母所謂律取妻而吕生子也黃鍾長九寸其實一籥下生者三分去一上生者三分益一五下六上乃一終矣文之者以調五聲使之相次如錦繡之有文章播猶揚也揚之以八音乃可得而觀之矣金鍾鎛也石磬也土塤也革鼓鼗也絲琴瑟也木柷敔也匏笙也竹管簫也疏同位象夫妻異位象子母者同位謂若黃鍾初九生林鍾初六俱是初異位謂若林鍾初六生太蔟九二二與初為異位律所生者常同位吕所生者常異位故云律取妻吕生子也以律所生者為夫妻吕所生者為母子也訓家君子曰凡樂之歌奏皆瞽者為之擇其賢知者為大師小師而統率之此所謂聲蓋謂調也合如上文奏黃鍾則歌大吕以合之之類故下文云皆文以五聲皆播以八音皆者承上文十二律言每律皆有五聲八音也每律皆有五聲八音備具是為調耳教六詩曰風曰賦曰比曰興曰雅曰頌興虛應反注教教瞽矇也訓家君子曰言風即繼以賦比興而後及雅頌者詩以風為首有風則有三者矣以六德為之本注所教詩必有知仁聖義中和之道乃後可教以樂歌以六律為之音注言六律則五聲在其中矣不言八音者此専為教歌詩也大祭祀帥瞽登歌令奏擊拊拊音撫注擊拊瞽乃歌也拊形如鼓以韋為之著之以粳登歌下管貴人聲也下管播樂器令奏鼓􅉧􅉧音胤導引之引並音胤注鼓􅉧管乃作也特言管者貴人氣也􅉧小鼓也鼓􅉧猶言擊􅉧􅉧讀為道引之引訓家君子曰考之儀禮升歌三終笙入三終無所謂管者蓋管重於笙重則以管輕則以笙也故升歌三終笙入三終鄉飲酒及燕用之至四方之賔客則升歌鹿鳴下管新宫故曰管重於笙天子則升歌清廟下而管象祭祀之樂也肆夏繁遏渠所以饗元侯也所管未聞大饗亦如之大射帥瞽而歌射節注射節主歌騶虞訓此雖不言賔射實賔射大師亦登歌令奏故視瞭職賔射皆奏鍾鼓注云登歌大師自奏之大師執同律以聽軍聲而詔吉凶注兵書曰王者行師出軍之日授將弓矢士卒振旅將張弓大呼大師吹律合音商則戰勝軍士強角則軍擾多變失士心宫則軍和士卒同心徴則將急數怒軍士勞羽則兵弱少威明師曠曰吾驟歌北風又歌南風南風不競多死聲楚必無功疏兵書武王出兵之書左傳注云北風夾鍾無射以北南風姑洗南吕以南大喪帥瞽而廞作匶諡諡音示神至切又音益注廞興也興言王之行謂諷誦其治功疏匶柩古字廞作匶諡為柩作諡大喪言凡則兼王后雖婦從夫諡亦須論行乃諡凡作諡謂將葬時賤不誄貴天子稱天以誄之公羊傳制諡於南郊是也凡國之瞽矇正焉疏大師是瞽人中樂官之長小師掌教鼓鼗柷敔塤簫管弦歌注教教瞽矇也出音曰鼓鼗如鼓而小持其柄搖之旁耳還自擊柷如漆筒中有椎敔木虎也塤燒土為之大如鴈卵六孔簫編小竹管六孔如笛而小併兩而吹之絃謂琴瑟歌依詠詩也疏鄭知此經鼓是出音非六鼓之鼓者按鼓人掌教六鼓視瞭又云賔射奏鍾鼓則鼓是鼓人教之視瞭擊之小師掌教瞽矇瞽矇所作無鼓知是出聲也按廣雅云簫大者二十四管小者十六管有底三禮圗云簫長尺四寸頌簫長尺二寸又廣雅云管象簫長尺圍寸無底柷如漆筒投椎其中而撞之以止樂敔如木虎背有二十七鉏鋙刻以木長尺櫟之訓家君子曰小師所教獨匏與金石不在焉者磬鍾笙鎛各有専官故也堂下作鼓所以起樂柷敔所以止樂塤簫管人氣也弦歌人聲也皆樂中之紀綱也大祭祀登歌擊拊下管擊應鼓徹歌注應鼙也應與􅉧皆小鼓也其所用别未聞徹歌於有司徹而歌雍也訓家君子曰大師令奏小師擊之大饗亦如之疏徹亦歌雍若諸侯相饗則徹以振羽大喪與廞與音預注從大師凡小祭祀小樂事鼓􅉧注不令奏小師卑也掌六樂聲音之節與其和和户卧反注和錞于疏鼓人云以金錞和鼓訓節調之疾徐和聲之髙下皆欲其相稱小師所教乃起樂止樂之器及人聲人氣是為諸聲之綱故於此言之瞽矇掌播鼗柷敔塤簫管絃歌注播謂發揚其音諷誦詩世奠繫鼓琴瑟奠音定繫户計反注諷誦詩謂暗讀之不依詠也杜子春云世奠繫謂帝繫諸侯卿大夫世本之屬是也小史主次序先王之世昭穆之繫述其德行瞽矇主誦詩并誦世繫以戒勸人君也國語曰教之世為之昭明德而廢幽昏焉以怵懼其動疏不依詠不依琴瑟而詠也訓背文曰諷以聲節之曰誦既以聲節之又有琴瑟乃不為歌而曰諷誦者蓋與琴瑟同作曰歌不與琴瑟同時曰誦與故言鼓琴瑟在後以世繫不可歌也掌九德六師之歌以役大師注為之使訓家君子曰九德即大司樂九德之歌視瞭掌凡樂事播鼗擊頌磬笙磬注視瞭播鼗又擊磬磬在東方曰笙笙生也在西方曰頌頌或作庸庸功也訓家君子曰瞽矇不言掌凡樂事者瞽矇所習者雖無事常肄焉故舉其業而已用在其中也掌大師之縣注大師當縣則為之訓大師樂官之總故雖不樂縣縣而縣必係之大師也凡樂事相瞽大喪廞樂器大旅亦如之相息亮反疏喪廞樂器謂明器旅非常祭故亦用明器訓家君子曰此所廞者謂瞽矇所掌者又此職既掌頌磬笙磬復掌大師之縣則鍾磬之屬亦必視瞭廞之故鍾師磬師不言廞器其餘笙師廞竽笙已下鎛師廞晉鼓籥師司干典庸器各以其職廞作大旅惟於視瞭笙師言之者見例而已賔射皆奏其鍾鼓注擊􅉧以奏之其登歌大師自奏之疏知擊朄者鍾鼓與管俱在下管既擊􅉧今奏則鍾鼓亦擊􅉧可知云登歌大師自奏者大師職惟見大祭祀登歌擊拊不言賔射實賔射亦大師令奏擊拊也訓案視瞭不得令奏蓋與鍾師共掌其事耳鼜愷獻亦如之注愷獻獻功樂也杜子春讀鼜為憂戚之戚擊鼓聲疾速故曰戚訓凡樂絃歌在堂上貴人聲也管聲之屬在堂下階間貴人氣也樂縣鍾磬鼓鎛之屬則在庭絃歌之事大師小師教之而瞽矇為焉樂縣之事磬師鍾師鼓人之屬各有専官而視瞭佐焉視瞭所掌相鼓而兼堂下之縣故其人數獨衆其云播鼗蓋樂縣將作亦先播鼗也其云擊頌磬笙磬則頌鍾笙鍾在其中矣葉氏曰與笙相應者曰笙磬與歌相應者曰頌磬家君子説以虞書曰笙鏞以間頌或作鏞謂歌與笙間作也頌磬笙磬此編縣也其云掌大師之縣總言凡縣皆掌之也云賔射奏其鍾鼓及鼜愷獻此則特縣者又歌吹大抵皆瞽矇之事故瞽矇人數亦多而其職有塤簫管之屬笙師所教者此也特文詳略異耳然則小師既教之矣而笙師復教之何也蓋笙管器多瞽矇人衆大師小師特為之審其音通其理設笙師以佐之不亦宜乎典同掌六律六同之和以辨天地四方隂陽之聲以為樂器注陽聲屬天隂聲屬地天地之聲播於四方為作也律述氣者也同助陽宣氣與之同皆以銅為之凡聲髙聲䃂正聲緩下聲肆陂聲散險聲斂逹聲贏微聲飲回聲衍侈聲筰弇聲鬱薄聲甄厚聲石䃂音衮古本切陂音賁彼義反又音碑飲劉音暗又於瞻反鄭於貪反廣韻音諳烏含反筰側百反玉篇又作笮廣韻音昨在各切笮同弇音掩劉於驗反甄音震廣韻音真又舉延切注髙鍾形大上上大也髙則聲上藏衮然旋如裏正謂上下直正則聲緩無所動下謂鍾形大下下大也下則聲出去放肆陂謂偏侈陂則聲離散也險謂偏弇險則聲斂不出也達謂其形微大也達則聲有餘若大放也微謂其形微小也飲聲小不成也回謂其形微圜也回則聲淫衍無鴻殺也侈謂中央約也侈則聲迫筰出去疾也弇中央寬也弇則聲鬱勃不出甄猶掉也鍾微薄則聲掉大厚則如石叩之無聲疏此職掌十二律之鍾是十二辰零鍾非編者直言病鍾者欲見除此病外即是鍾之善者袞然旋如裏者謂聲周旋如在裏鄭知髙是上大下是下大者以其正是上下直則上是上大下是下大可知云回謂形微圜者凡鍾依鳬氏所作若鈴不圜今微圜故聲淫衍無鴻殺云侈謂中央約者此非偏侈謂鍾口總寬弇與侈相對是口總狹則中央寬也凡為樂器以十有二律為之數度以十有二聲為之齊量齊才計反注數度廣長也齊量侈弇之所容疏樂器據典同所作謂鍾也以十二律謂之度數者依律厯志云古之神瞽度律均鍾以律計倍半假令黃鍾管長九寸倍之為尺八寸又九寸得四寸半總二尺二寸半以為鍾口之徑及上下之數自外十二辰頭皆以管長短計之可知廣長者廣則口徑長即上下也十二聲即十二辰零鍾雖各有所容多少之齊量故云侈弇之所容訓按以十二律為之數度蓋指三分損益上下相生之法如琴瑟簫管其徽孔皆依律損益以相應和十二聲即髙聲下聲以下十二為之齊量者酌諸病之中而得其和也典同掌樂器而以鍾為主上文凡聲一節則指鍾也此文凡為樂器則琴瑟簫管之屬是也其度數則取之損益相生之律法其聲音則齊量於十二病鍾之中凡和樂亦如之注和謂調其故器也訓調和樂音亦當取配十二律各以其類而勿犯十二病也磬師掌教擊磬擊編鍾注教教視瞭也磬亦編於鍾言之者鍾有不編不編者鍾師擊之疏視瞭不言擊鍾其實編鍾亦視瞭擊之故鏄師注云擊鍾者亦視瞭也鄭知鍾有不編者以經磬不言編則磬無不編者可對鍾言編則對不編者不編者是十二辰零鍾也教縵樂燕樂之鍾磬縵莫半反注縵樂謂雜聲之和樂者也學記曰不學操縵不能安絃燕樂房中之樂二樂皆教其鍾磬疏雜聲之和樂者謂雜㺯調和即今之調辭曲房中之樂即關雎二南及祭祀奏縵樂注二樂並旄人舞之燕樂則鍾師奏之縵樂惟有編縣燕樂兼有持縣訓孟子言金聲玉振朱子釋之云凡奏八音必先擊鎛鐘以宣其聲俟其既闋然後擊特磬以收其韻今按鍾師注云以鍾鼓者先擊鍾次擊鼓此金聲之義矣磬師擊磬無特縣者又無以磬收音之文不知朱子何所本而為是説姑俟再考後閲爾雅釋樂有大磬是特縣者然不知周官何故無之不然是解者以磬師無之者泥之也但以磬收音終未有考再閲文獻通考荀子曰縣一鍾而尚拊大戴禮曰縣一磬而尚拊為堂上之樂則一鍾一磬亦堂上之樂也蓋古者歌詩搏拊而縣興故一鍾黃鍾之特鍾也一磬黃鍾之特磬也方其工之升歌也搏拊而鍾磬作焉黃鍾之鍾鳴于堂上而堂下之編鍾應之黃鍾之磬鳴于堂上而堂下之編磬應之所以節歌者之句也以上皆通考文鍾師掌金奏注金奏擊金以為奏樂之節金謂鍾及鎛疏云鍾及鎛者以是二者皆不編獨縣而已凡樂事以鍾鼓奏九夏王夏肆夏昭夏納夏章夏齊夏族夏祴夏驁夏納夏本或作夏納齊側皆反本作齋祴音陔古哀反驁五羔反劉五到反注以鍾鼓者先擊鍾次擊鼓以奏九夏夏大也樂之大歌有九杜子春云王出入奏王夏尸出入奏肆夏牲出入奏昭夏四方賔來奏納夏臣有功奏章夏夫人祭奏齊夏族人侍奏族夏客醉而出奏祴夏公出入奏驁夏春秋傳穆叔如晉晉侯享之金奏肆夏三不拜工歌文王之三又不拜歌鹿鳴之三三拜曰三夏天子所以享元侯也使臣不敢與聞肆夏與文王鹿鳴俱稱三謂其三章也國語曰金奏肆夏繁遏渠天子所以享元侯肆夏繁遏渠所謂三夏也吕叔玉云肆夏繁遏渠皆周頌也肆夏時邁也繁遏執競也渠思文也肆遂也夏大也言遂於大位謂王位也繁多也遏止也言福祿止於周之多也渠大也言以后稷配天王道之大也玄謂九夏皆詩篇名頌之族類也此歌之大者載在樂章樂崩亦從而亡是以頌不能具疏云先擊鍾次擊鼓者兼言凡樂先後次第實鍾師直擊鍾不擊鼓也以鍾鼓奏九夏者謂堂上歌之堂下以鍾鼓應之凡祭祀饗食奏燕樂注以鍾鼓奏之疏饗食在廟故與祭祀同凡射王奏騶虞諸侯奏貍首卿大夫奏采蘋士奏采蘩疏言凡射則大射賔射等同用此為射節矣射人與樂師辨其節數此掌奏其樂故數職重言訓家君子曰大師所掌者歌鍾師所掌者奏然則四節者蓋歌而鍾鼓以奏之也視瞭所奏鍾鼓其役于鍾師者歟掌鼙鼓縵樂注作縵樂則擊鼙以和之疏磬師作縵樂則鍾師鼓鼙和之訓按鍾師掌於鍾師而鍾師實主金奏似乎九者僅有鍾鼓以作之然鍾鼓所以為樂之節若絶無歌管而直有鍾鼓何以成樂乎此九夏必有聲詩而以鍾鼓和之無疑也乃遍考周官無歌九夏之文何與然燕樂實二南之詩亦僅言奏不言歌豈皆以鍾師為重而僅舉奏以見歌耶又豈九夏之奏用大鍾大鼓而無編縣者耶今考大師所屬瞽矇甚多意必歌詩事繁不獨笙歌一節而已然未得其正姑闕之笙師掌教吹竽笙塤籥簫箎笛管舂牘應雅以教祴樂吹昌垂反竽音于牘音獨或大録反籩音狄徒厯切與笛同注教教視瞭也竽三十六簧笙十三簧箎七空笛今時所吹五空竹笛籥如笛三孔舂牘以竹大五六寸長七尺短者一二尺其端有兩空髤畫以兩手築地應長六尺五寸其中有椎雅狀如漆筒而弇口大二圍長五尺六寸以羊韋挽之有兩紐疏畫祴樂祴夏之樂牘應雅教其舂者謂以築地笙師教之則三器在庭可知矣賔醉而出奏祴夏以此三器築地為之行節明不失禮疏按通卦驗云竽長四尺二寸注云竽管類用竹為之形參差象鳥翼廣雅云笙以匏為之十三管宫管在左方竽三十六管宫管在中央箎長尺四寸八孔一孔上出寸三分禮圗云箎九孔注云七孔蓋寫之誤當云八孔髤畫者赤多黑少之色疏畫者長疏而畫之凡祭祀饗射共其鍾笙之樂注鍾笙與鍾聲相應之笙訓家君子曰此即笙入三終是也燕樂亦如之大喪廞其樂器及葬奉而藏之大旅則陳之訓家君子曰大旅但廞樂器而不藏故但曰陳之笙師所教當亦是瞽矇故瞽矇有塤簫管之文但略其辭耳大抵歌與笙管皆瞽者之事故瞽矇人數甚衆鎛師掌金奏之鼓注謂主擊晉鼓以奏其鍾鎛然則擊鎛者亦視瞭疏知金奏是擊晉鼓者鼓人職云以晉鼓鼓金奏知擊鏄亦視瞭者鍾鎛同類大小異耳既擊鍾明亦擊鎛訓鍾鎛蓋皆屬鍾師視瞭不特佐鍾師兼佐鎛師故其職鍾鼓並掌之凡祭祀鼓其金奏之樂饗食賔射亦如之軍大獻則鼓其愷樂凡軍之夜三鼜皆鼓之守鼜亦如之注守鼜備守鼓也鼓之以鼖鼓疏鄭知用鼖鼓者鼓人職云以鼖鼓鼓軍事訓家君子曰凡軍之衣三鼜者行鼜也故曰守鼜以别之大喪廞其樂器奉而藏之韎師掌教韎樂祭祀則帥其屬而舞之大饗亦如之注舞之以東夷之樂訓家君子曰旄人鞮鞻氏並掌四夷之樂此乃特别東夷者其樂蓋優與旄人掌教舞散樂舞夷樂注散樂野人為樂之善者若今黃門倡矣訓家君子曰此所掌者夷舞鞮鞻氏所掌其器與聲散樂即縵樂燕樂之屬不在六樂之內者凡四方之以舞仕者屬焉注家君子曰六樂之舞則國子也此云四方之以舞仕明别於國子也凡祭祀賔客舞其燕樂注直言燕樂省文籥師掌教國子舞羽吹籥注文舞有持羽吹籥者文王世子曰秋冬學羽籥疏文舞羽籥武舞干戚訓舞羽之時兼以吹籥籥師教之其舞羽則樂師總教之矣祭祀則鼓羽籥之舞注鼓之者恆為之節疏凡祭祀先作樂下神及合樂之時則使國子舞賔客饗食則亦如之大喪廞其樂器奉而藏之籥章掌土鼓豳籥豳彼貧反注邠同注豳籥豳人吹籥之聲章明堂位曰土鼓蒯桴葦籥伊耆氏之樂疏鄭注禮運曰土鼓築土為鼓訓家君子曰豳籥即下豳詩雅頌是也中春晝擊土鼓吹豳詩以逆暑中音仲下同注豳詩豳風七月也七月言寒暑之事迎氣歌其類也迎暑以晝求諸陽中秋夜迎寒亦如之注迎寒以夜求諸隂疏亦擊土鼓吹豳詩凡國祈年於田祖吹豳雅擊土鼓以樂田畯樂音洛畯音俊注祈年祈豐年也田祖始耕田者謂神農也豳雅亦七月也七月又有于耜舉趾饁彼南畝之事是亦歌其類謂之雅者以其言男女之正田畯古之先教田者爾雅曰畯農夫也訓案詩小雅甫田篇曰琴瑟擊鼓以御田祖則此亦有琴瑟但文不備耳又云以祈甘雨注云郊後始耕時案左傳曰啓蟄而郊郊而後耕然則祈年於田祖當在二月之初國祭蠟則吹豳頌擊土鼓以息老物蠟音乍鋤駕切與䄍同注郊特牲曰天子大蠟八伊耆氏始為蠟嵗十二月合聚萬物而索饗之十二月建亥之月也求萬物而祭之者萬物助天成嵗事至此謂其老而勞乃祀而老息之於是國亦養老焉豳頌亦七月也七月又有穫稻作酒躋彼公堂稱彼兕觥萬夀無疆之事是亦歌其類也謂之頌者以其言嵗終人功之成朱子曰豳雅豳頌蓋即雅之甫田大田頌之載芟良耜或其類也訓家君子曰此大司樂所掌國所舉用之樂與鼓人舞師所掌民間助祭者不同迎寒暑則先擊鼓祈年則先吹籥者土鼓上古之樂也豳籥豳人之樂也寒暑天氣尊也别於人物故所用不同豳諸侯之國以其為受命之基故不可夷於列國而特以籥章氏掌之其用之必於田事不忘本也然則不陳之廟中何也曰王者功成作樂豳非王者之樂也故不得與韶夏濩武陳之也燕樂夷樂其陳之何也所以一風俗示無外也於豳不敢混而陳之所以尊祖宗也鞮鞻氏掌四夷之樂與其聲歌注四夷之樂東方曰韎南方曰任西方曰株離北方曰禁疏孝經緯鉤命決云東夷之樂曰韎持矛助時生南夷之樂曰任持弓助時養西夷之樂曰侏離持鉞助時殺北夷之樂曰禁持楯助時藏訓云四夷之樂總言之不止聲歌也故下文尚有吹而歌之是也祭祀則吹而歌之燕亦如之注四夷之舞旄人掌之訓案韎師旄人在籥師籥章之上者以其掌舞事蓋樂以舞為重也鞮鞻氏直掌歌吹故在籥章之下典庸器掌藏樂器庸器注庸器代國所獲器若崇鼎貫鼎及以其兵物所鑄銘也疏云以其兵物所鑄銘者若季氏以所得齊之兵作林鍾而銘魯功是也訓家君子曰官以庸器為名重其器也文以樂器為先蓋大司樂之屬及祭祀帥其屬而設筍簴陳庸器簴音巨其吕切注設筍簴視瞭當以縣樂器焉橫者為筍從者為簴疏知視瞭以縣樂器者其職云掌大師之樂饗食賔射亦如之大喪廞筍簴檀弓云有鍾磬而無筍簴鄭注云不縣之明有而而不縣也訓家君子曰言廞不言藏明不藏也故曰無筍簴司干掌舞器注舞器羽籥之屬疏文武之舞器皆司干掌之言司干者周尚武故以干為職首其籥師惟教而不掌按司戈盾祭祀授舞者兵蓋亦謂戈耳其干則於此官受之司兵云祭祀授舞者兵鄭注云受以朱干玉戚謂受大武之舞與此受小舞者干戈别也訓家君子曰鄭蓋欲别司兵與司戈盾故於彼言干戚而不言戈又欲别司兵與司干故於此僅言羽籥而不言干戚耳疏解恐非其意祭祀舞者既陳則授舞器既舞則受之賔饗亦如之大喪廞舞器及葬奉而藏之注籥當籥師廞之則此所廞者羽毛帗皇之屬訓家君子曰典庸器聲器也司干舞器也周禮纂訓卷十二
