body:
  text: 周禮纂訓卷十八安溪李鍾倫撰戎右掌戎車之兵革使使色吏反注使謂王使以兵有所誅斬也春秋𫝊曰戰於殽晉萊駒為右襄公縛秦囚使萊駒以戈斬之訓按戎僕掌倅車之政則不獨革路而已五戎之政皆掌之戎右亦當然蓋五戎各有僕右皆統於此革路之僕右也詔贊王鼓注既告王當鼓之節又助擊之疏大僕已贊王鼓此亦同是助擊其餘靣也𫝊王命于陳中𫝊直宣反陳直慎反注為王言之大也㑹同充革車注㑹同王雖乘金路猶以革路從行也充之者謂居左也曲禮曰乘君之乘車不敢曠左盟則以玉敦辟盟遂役之敦音對注鄭司農云辟法也𤣥謂將㰱血者先執其器為衆陳其載辭役之者𫝊敦血授當㰱者贊牛耳桃茢茢音列注尸盟者割牛耳取血助為之及血在敦中以桃茢拂之又助之也耳者盛以珠盤尸盟者執之桃鬼所畏也茢苕帚所以掃不祥齊右掌祭祀㑹同賔客前齊車王乘則持馬行則陪乘齊側皆反乘繩證反注齊車金路王自整齊之車也前之者已駕王未乘之時陪乘參乘謂車右也齊右與齊僕同車而有祭祀之事則兼玉路之右然則戎右兼田右與疏云前之謂王未乘時者曲禮曰僕執䇿立於馬前備驚奔謂未乘時凡有牲事則前馬注王見牲則拱而式居馬前卻行備驚奔也道右掌前道車王出入則持馬陪乘如齊車之儀注道車象路也王行道德之車自車上諭命于從車注自由疏按馭夫掌馭二車從車彼注二車象路之副從車戎路田路之副此從車即彼二車與從車也詔王之車儀注顧式之屬王式則下前馬王下則以蓋從疏蓋有二種一者禦雨二者表尊此則表尊之蓋也大馭掌馭玉路以祀及犯軷王自左馭馭下祝登受轡犯軷遂驅之軷音跋蒲撥切注行山曰軷犯之者封土為山象以菩芻棘柏為神主既祭之以車轢之而去喻無險難也春秋傳曰跋涉山川詩云取羝以軷聘禮乃舍軷飲酒于其側禮家說亦謂道祭疏此據祭天之時出國門封土為山象祭軷按鄭注月令祀行之禮為軷壇厚三寸廣五尺此道祭亦宜然云以菩芻棘柏為神主者謂三者皆可用為神主也引聘禮者大夫道祭無牲牢酒脯而已菩音員一音倍及祭酌僕僕左執轡右祭兩軹祭軓乃飲軹音止軓音犯注軹謂兩轊也故書軓為範杜子春云文當如此或云當為􅓶􅓶謂車軾前也疏此云及祭即上文將犯軷時當祭左右轂末及軾前乃犯軷去酌僕者僕即大馭云軹謂兩轊轊即轂末也云軓當為範者按少儀祭左右軓范軓與軹同謂轊頭也範與范聲同謂軾前也若然此云軹少儀作軓此云軓少儀作范也凡馭路行以肆夏趨以采薺薺才私反注凡馭路謂五路也肆夏采薺樂章也行謂大寢至路門趨謂路門至應門疏樂師亦有此法彼下云車亦如之即行趨據步迎賔客此既馭路亦云行趨者此雖馭路行趨遲疾亦推步迎賔客為法也注云路謂五路者以經云凡所含廣凡馭路儀以鸞和為節注舒疾之法也鸞在衡和在軾皆以金為鈴疏鄭知鸞在衡和在軾者按韓詩𫝊云升車則馬動馬動則鸞鳴鸞鳴則和應明鸞近馬首和更近後也按秦詩云輶車鸞鑣鄭云鸞在鑣者鄭以田車鸞在鑣乘車鸞在衡此據乘車而言戎僕掌馭戎車注戎車革路也師出王乘以自將掌王倅車之政正其服倅七內反注倅副也服謂衆乘戎車者之衣服疏鄭注坊記云僕右恆朝服據非在軍時若在軍則服韋辨服衆乘戎車謂副車十二乘及廣闕蘋輕之倅皆是其服謂韋辨服犯軷如玉路之儀凡巡守及兵車之㑹亦如之注如在軍疏巡守及兵車㑹亦乘革路若乘車之㑹即乘金路也掌凡戎車之儀注凡戎車衆之兵車也書序曰武王戎車三百兩齊僕掌馭金路以賔朝覲宗遇饗食皆乘金路其法儀各以其等為車送逆之節注節謂王乘車迎賔客及送相去逺近之數上公九十步侯伯七十步子男五十步司儀職曰車逆拜辱又曰及出車送疏春夏受贄於朝無迎法受享於廟則有之秋冬一受之於廟俱無迎法故郊特牲云覲禮王不下堂而見諸侯是受贄受享皆無迎法今言朝覲宗遇饗食皆乘金路者謂因此朝覲宗遇而與諸侯行饗食在廟即有乘金路迎賔客之法也上公九十步已下大行人文彼據受享於廟非饗食禮引之者欲見饗食迎賔與受享同司儀所云亦據受饗食之禮也道僕掌馭象路以朝夕燕出入其法儀如齊車注朝夕朝朝莫莫疏朝朝莫莫在正朝來往而言燕者以其在宫中行事皆稱燕掌二車之政令注二亦副訓按顧命有先路次路注云先路象路也次路象路之二但革路之二疏謂有十二乘玉金象木之二其數則未有考耳田僕掌馭田路以田以鄙注田路木路也田田獵也鄙循行縣鄙掌佐車之政注佐亦副疏天子戎車田車之二有别名諸侯戎車田車之二同曰佐無倅名是以檀弓云佐車授綏少儀注云朝祀之副曰二戎獵之副曰佐也設驅逆之車注驅驅禽使前趨獲逆衙還之使不出圍疏按王制大夫殺則止佐車彼佐車則此驅逆之車也令獲者植旌注以告獲也疏山虞植旗屬禽此又植旌此禽者共其事也及獻比禽注田弊獲者各獻其禽比種物相從次數之疏凡田百姓所得禽大獸公之小禽私之公之者獻於旌下每禽擇取三十其餘為主皮之射而取之凡田王提馬而走諸侯晉大夫馳注提猶舉也晉猶抑也使人扣而舉之抑之皆止奔也馳放不扣馭夫掌馭二車從車使車注二車象路之副也從車戎路田路之副也使車驅逆之車疏不掌玉路金路之副者二者事暇蓋車僕不共掌也知使車是驅逆者以使役勞劇之事故知是驅逆之車也分公馬而駕治之注乘調六種之馬疏趨馬自主駕脫故知此駕治是調習之也校人掌王馬之政注政謂差擇養乘之數也辨六馬之屬種馬一物戎馬一物齊馬一物道馬一物田馬一物駑馬一物注種謂上善似母者以次差之玉路駕種馬戎路駕戎馬金路駕齊馬象路駕道馬田路駕田馬駑馬給宫中之役凡頒良馬而養乘之乘馬一師四圉三乘為皂皂一趣馬三皂為繫繫一馭夫六繫為廏廏一僕夫六廏成校校有左右駑馬三良馬之數麗馬一圉八麗一師八師一趣馬八趣焉一馭夫乘繩證反圉魚吕反皂才早反趣倉走反劉沈清須反下同廏音救居又切注良馬五路之馬四匹為乘師趣馬馭夫僕夫帥之名也趣馬下士馭夫中士則僕夫上士也自乘至廏其數二百一十六匹易乾為馬此應乾之策也至校變為言成者明六馬各一廏而王馬小備也校有左右則艮馬一種者四百三十二匹五種合二千一百六十匹駑馬三之則為千二百九十六匹五良一駑凡三千四百五十六匹然後王馬大備麗耦也駑馬自圉至馭夫凡馬千二十四匹與三良馬之數不相應八皆宜為六字之誤也師十二匹趣馬七十二匹則馭夫四百三十二匹矣然後而三之既三之無僕夫者不駕於五路卑之也疏按序官無僕夫故鄭以趣馬馭夫尊卑次之知僕夫上士也又按序官自師至馭夫中士二十人下士四十人并之六十正充此良馬之馭夫又不見駑之馭夫者或脫也訓按僕夫即五路之僕良馬五廏重左右為十故序官三路僕皆二人道田二路並十二人者二路常乘事多或使之更代與天子十有二間馬六種邦國六間馬四種家四間馬二種注降殺之差每廏為一間諸侯有齊馬道馬田馬大夫有田馬各一間其駑馬則皆分為三焉疏趙商問天子十二間馬六種為三千四百五十六匹邦國六間馬四種為二千五百九十二匹家四間馬二種千七百二十八匹天子之卿食小都大夫食縣司馬法論之甸方八里出戎馬四匹長轂一乘今大夫采地四甸一甸給王餘三甸才有馬十二匹與校人職相校甚逺何答曰邦國六間馬四種其數適當千二百九十六匹家四間二種又當八百六十四匹今子以何術計之乎此馬皆君之所制非謂民賦司馬法長轂一乘戎馬四匹此謂民出軍賦無與於天子國馬之數也按趙商云邦國二千五百九十二匹者謂三良一良四百三十二匹三良千二百九十六匹駑三其一種亦千二百九十六匹故合為二千五百九十二匹家亦然鄭不從者天子十二間分為左右一種馬有兩廏故有四百三十二匹諸侯無左右良馬三種三廏六百四十八匹駑馬一種三廏數亦如之并之為千二百九十六匹大夫亦是此法故云子以何術計之也凡馬特居四之一注欲其乘之性相似也疏欲其乘之性相似者使三牝通牡為四共駕一車也春祭馬祖執駒注馬祖天駟也孝經說曰房為龍馬執猶拘也二嵗曰駒三嵗曰駣春通淫之時駒弱血氣未定為其乘匹傷之疏春時通淫求馬蕃息故祭馬祖夏祭先牧頒馬攻特注先牧始養馬者其人未聞夏通淫之後攻其特謂騬之為其蹄齧不可乘用疏夏祭先牧者夏草茂求肥充訓按頒馬者通淫之後即分牝牡使異處而養之且騬其特焉秋祭馬社臧僕臧子郎反注馬社始乘馬者世本作曰相士作乘馬臧僕謂簡練馭者令皆善也僕馭五路之僕疏秋馬肥盛可乘故祭始乘馬者臧僕者秋時萬物成教之使善冬祭馬步獻馬講馭夫注馬步神為災害馬者獻馬見成馬於王也馭夫馭二車從車使車者講猶簡習疏步與酺字異音義同獻馬講馭夫亦謂物成可用也訓愚謂冬而祭馬步者亦猶索饗必於嵗終之意也凡大祭祀朝覲㑹同毛馬而頒之注毛馬齊其色也頒授當乘之疏此三者皆須馬從王故毛馬而頒之按毛詩云宗廟齊毫尚純也戎事齊力尚强也田獵齊足尚疾也然田獵軍事亦俱尚色詩曰四騵彭彭又曰四鐵孔阜是也飾幣馬執撲而從之撲音撲普卜反注校人主飾之幣馬以馬遺人當幣處者也聘禮曰馬則北靣奠幣于其前士喪禮下篇曰薦馬纓三就入門北靣交轡圉人夾牽之馭者執䇿立于馬後疏云以馬當幣處者王家遺人無庭實故覲禮勞侯氏用璧無庭實則知此直以馬遺人無幣也引聘禮者證彼則有幣有馬引士喪禮證飾馬之事也訓按此承朝覲㑹同時有遺馬之法但遺之不知或於饗於燕及其匹數皆未聞焉抑匹如命數與凡賔客受其幣馬注賔客之幣馬來朝聘而享王者疏朝而享王者大行人云廟中將幣三享是也使客來聘享王者玉人職瑑圭璋璧琮以俯聘是也大喪飾遣車之馬及葬埋之注言埋之則是馬塗車之芻靈田獵則帥驅逆之車注帥猶將也疏驅逆之車田僕設之校人主車馬帥領田僕而已凡將事于四海山川則飾黃駒注四海猶四方也王巡狩過大山川則有殺駒以祈沈禮與玉人職有宗祝以黃金勺前馬之禮凡國之使者共其幣馬注使者所用私覿疏此謂王使下聘諸侯王行禮後乃更以此幣馬私與主君相見上文飾幣馬非聘故無私覿於賔客來朝聘不言私覿者諸侯之臣於天子不敢行私覿故也諸侯臣與君同行亦不得私覿聘則有之凡軍事物馬而頒之注物馬齊其力等馭夫之祿注馭夫於趣馬僕夫為中舉中見上下宫中之稍食注師圉府史以下也訓校人所掌王馬専待王用者三種齊道也兼給國用者三戎田駑也其給國用者蓋亦官府胥役為公用之及王出行則諸衛從王如虎士及國子之屬蓋皆給馬故諸子職云授之車甲是也鄉遂出軍車甲之制未有聞焉不在此科也趣馬掌贊正良馬而齊其飲食簡其六節注贊佐也佐正者謂校人臧僕講馭夫之時簡差也節猶量也差擇王馬以為六等掌駕說之頒說音稅注用馬之第次疏用馬當均勞逸故駕說須依次第辨四時之居治以聽馭夫治直吏反注居謂牧庌所處治謂執駒攻特之屬疏辨四時之居治者謂二月已前八月以後在廏二月已後八月已前在牧云牧庌者放牧之處皆有庌厰以䕃馬也庌音雅五下切巫馬掌養疾馬而乘治之相醫而藥攻馬疾受財于校人相息亮反注乘謂驅步以發其疾知所疾處乃治之相助也疏巫知馬祟醫知馬疾二者相須受財謂祈祟之具及藥直訓按序有醫四人即此是也馬死則使其賈粥之入其布于校人賈音嫁又音古牧師掌牧地皆有厲禁而頒之注頒馬授圉者所牧處孟春焚牧注焚牧地以除陳生新草也疏孟春建寅之月中春通淫注月令季春乃合纍牛騰馬遊牝于牧秦時書也秦地寒凉萬物後動掌其政令凡田事贊焚萊注焚萊者山澤之虞廋人掌十有二間之政教以阜馬佚特教駣攻駒及祭馬祖祭間之先牧及執駒散馬耳圉馬廋所求反佚音逸散素但反注九者皆有政教焉阜盛壯也佚當為逸逸者用之不使甚勞安其血氣也教駣始乘習之也攻駒騬其蹄齧者間之先牧先牧制間者散馬耳謂聒馬耳以竹括押其耳頭動搖則括中物後遂串習不復驚疏云先牧制間者以上云夏祭先牧直是先養馬者非制間之人也訓愚謂圉馬當連下文正校人員選為句蓋廋人掌當祭馬祖之時則祭間之先牧焉當執駒之時則就取而散其耳焉自幼而習之也若夫圉馬之事則為校人正其員選焉别其能否以告校人也正校人員選注校人謂師圉也正員選者選擇可備員者平之疏知校人是師圉者凡言正者以尊正卑趣馬以上並上官非廋人所正也馬八尺以上為龍七尺以上為騋六尺以上為馬注大小異名月令曰駕蒼龍爾雅曰騋牝驪牡𤣥疏爾雅之意以衛詩騋牝中兼有牡引之者證騋是馬色圉師掌教圉人養馬春除蓐釁廏始牧夏庌馬冬獻馬射則充椹質茨牆則翦闔蓐音辱茨在私反闔戶臘反庌五嫁反注蓐馬兹也馬既出而除之新釁焉神之也春秋傳曰凡馬日中而出日中而入庌廡也所以庇馬凉也充猶居也茨蓋也闔苫也椹質翦闔圉人所習也圉人掌養馬芻牧之事以役圉師凡賔客喪紀牽馬而入陳注賔客之馬王所以賜之者詩云雖無豫之路車乘馬喪紀之馬啓後所薦馬疏賔客之馬則王使人就館陳之喪紀之馬則謂將葬朝廟時既夕禮薦馬纓三就是也天子亦當在祖廟中陳設明器時遣人薦馬及纓入廟陳之此馬謂擬駕乘車吉器最先者也廞馬亦如之注廞馬遣車之馬人捧之亦牽而入陳職方氏掌天下之圖以掌天下之地辨其邦國都鄙四夷八蠻七閩九貉五戎六狄之人民與其財用九榖六畜之數要周知其利害閩亡巾反又音文又亡千反漢書音義服䖍音近蠻應劭音近文鄭氏音旻貉孟白反注東方曰夷南方曰蠻西方曰戎北方曰貉狄閩蠻之别也國語曰閩芊蠻矣四八七九五六周之所服國數也財用泉榖貨賄也利金錫竹箭之屬害神姦鑄鼎所象百物也疏大司徒亦掌地圖者彼直掌九州不兼夷狄此職兼主夷狄也訓案利害當兼地勢與百物言物之利害則注具之地之利害則形勢險易是也人民財用之等即下九州所列職方制貢故須知其數要職方制貢所以異於司徒者司徒均齊天下之政謂各處九州之民嵗入于其國之數也職方所言則九州之國所入于王之數也乃辨九州之國使同貫利注貫事也訓按事利者各以所事為利也如揚州之土則以取金錫竹箭養鳥獸種稻為事而利出焉既辨之又同之者辨各土之所有而後可以通其所無也東南曰揚州其山鎮曰㑹稽其澤藪曰具區其川三江其浸五湖其利金錫竹箭其民二男五女其畜宜鳥獸其榖宜稻㑹古外反藪素口反區起俱反浸子鴆反本又作寖注鎮名山安地德者也㑹稽在山隂大澤曰藪具區五湖在吳南浸可以為陂灌溉者錫鑞也箭篠也鳥獸孔雀鸞鵁鶄犀象之屬疏此以下陳九州總為三道陳之從南方起取尊陽方周改禹貢以徐梁二州合於雍青分冀州地以為幽并東南曰揚州次正南曰荆州周之西南不置州統屬雍州即次河南曰豫州為一道次正東曰青州次河東曰兖州次正西曰雍州為二道次東北曰幽州次河內曰冀州次正北曰并州為三道訓顧祖禹曰具區即震澤今太湖也三江一曰松江二曰婁江三曰東江皆自太湖分流東入海五湖太湖東岸五灣也正南曰荆州其山鎮曰衡山其澤藪曰雲瞢其川江漢其浸潁湛其利丹銀齒革其民一男二女其畜宜鳥獸其榖宜稻瞢亡貢反劉亡鳳反李一音亡雄反湛直減反劉又音沈李唐感反注衡山在湘南雲瞢在華容潁出陽城宜屬豫州在此非也湛未聞齒象齒也革犀兕革也湛或作淮疏此直言江不言三江者此州江未分為三也訓顧祖禹曰潁水發源河南登封縣東陽乾山至南直鳯陽府潁州潁上縣入淮湛在今河南汝州境內有湛水按二水本禹貢豫州之域河南曰豫州其山鎮曰華山其澤藪曰圃田其川滎雒其浸波溠其利林漆絲枲其民二男三女其畜宜六擾其榖宜五種滎戶扃反溠音詐左𫝊音同李莊加反枲思似反耰而小反注華山在華隂圃田在中牟滎兖水也出東垣入于河泆為滎滎在滎陽波讀為播禹貢曰滎播既都春秋𫝊曰楚子除道梁溠則溠宜屬荆州在此非也林竹木也六擾馬牛羊豕犬雞五種黍稷菽麥稻疏必知五種是黍稷菽麥稻者此州東接青州青州有稻麥西接雍州雍州有黍稷也訓愚按此洛乃禹貢自熊耳山出流入河者與下渭洛不同也正東曰青州其山鎮曰沂山其澤藪曰望諸其川淮泗其浸沂沭其利蒲魚其民二男二女其畜宜雞狗其榖宜稻麥沂魚祈反泗音四沭音述李一音餘戍反注沂山沂水所出也在蓋望諸明都也在睢陽沭出東莞二男二女數等似誤當與兖州同二男三女淮或為睢沭或為洙疏按禹貢海岱及淮惟徐州淮沂其乂不在青州者周公并徐州為青故也云明都者按禹貢道菏澤被孟豬春秋又有孟諸即此也知二男二女是誤也者若本有此數等當言一男一女矣河東曰兖州其山鎮曰岱山其澤藪曰大野其川河泲其浸廬維其利蒲魚其民二男三女其畜宜六擾其榖宜四種泲子禮反廬音雷維於恭反注岱山在博大野在巨野廬維當為雷雍字之誤也禹貢曰雷夏既澤雍沮㑹同雷夏在城陽四種黍稷稻麥訓按泲即濟也正西曰雍州其山鎮曰嶽山其澤藪曰弦蒲其川涇汭其浸渭洛其利玉石其民三男二女其畜宜牛馬其榖宜黍稷汭如鋭反注嶽吳嶽也及弦蒲在汧涇出涇陽汭在豳地詩大雅公劉曰汭泦之即洛出懷德弦或為汧蒲或為浦疏此洛即詩瞻彼洛矣一也與熊耳出者别也泦弓六反詩作鞫與㘲同東北曰幽州其山鎮曰醫無閭其澤藪曰貕養其川河泲其浸菑時其利魚鹽其民一男三女其畜宜四擾其榖宜三種貕音兮注醫無閭在遼東貕養在長廣菑出萊蕪時出般陽四擾馬牛羊豕三種黍稷稻疏地理志長廣屬徐州琅琊有萊山周時幽州南侵徐州之地也知三種黍稷稻者西接冀州冀宜黍稷河內曰冀州其山鎮曰霍山其澤藪曰楊紆其川漳其浸汾潞其利松柏其民五男三女其畜宜牛羊其榖宜黍稷紆於于反汾扶文反潞音路注霍山在彘楊紆所在未聞漳出長子汾出汾陽潞出歸德訓顧祖禹曰爾雅秦有楊紆未詳正北曰并州其山鎮曰恆山其澤藪曰昭餘祁其川呼池嘔夷其浸淶易其利布帛其民二男三女其畜宜五擾其榖宜五種呼喚胡反李胡哥反池徒多反李如字嘔焉侯反一音驅注恆山在上曲陽昭餘祁在塢呼池出鹵城嘔夷祁夷與出平舒淶出廣昌易出故安五擾馬牛羊犬豕五種黍稷菽麥稻也此州界揚荆豫兖雍冀與禹貢略同青州則徐州地也幽并則青冀之北也無徐梁疏云揚荆豫兖雍冀與禹貢略同者雖仍舊猶有相侵故云略同也若州之兖州於禹貢侵青徐地青州侵豫州地雍豫兼梁州地冀州小於禹貢時以其北有幽并也自古以來皆有九州惟舜暫置十二州至夏還為九州乃辨九服之邦國方千里曰王畿其外方五百里曰侯服又其外方五百里曰甸服又其外方五百里曰男服又其外方五百里曰采服又其外方五百里曰衛服又其外方五百里曰蠻服又其外方五百里曰夷服又其外方五百里曰鎮服又其外方五百里曰藩服注服服事天子也詩曰侯服于周疏侯之言候也為王斥候也甸之言田為王治田男之言任為王任職采者事也為王事民以供上衛者為王衛禦蠻之言縻以政教縻之自此以外皆夷狄故夷之鎮者鎮守藩者藩籬其夷狄三服大行人總亦謂之藩也凡邦國千里封公以方五百里則四公方四百里則六侯方三百里則七伯方二百里則二十五子方百里則百男以周知天下注以此率遍知四海九州邦國多少之數也方千里者為方百里者百以方三百里之積以九約之得十一有竒云七伯者字之誤也周九州之界方七千里七七四十九方千里者四十九其一為畿內餘四十八八州各有方千里者六周公變殷湯之制雖小國地皆方百里是每事言則者設法也設法者以待有功而大其封一州之中以其千里封公則可四封侯則可六封伯則可十一封子則可二十五封男則可百公侯伯子男亦不是過也州二百一十國以男備其數焉其餘以為附庸四海之封黜陟之功亦如之雖有大國爵稱子而已疏王制云公侯方百里伯七十里子男五十里此是夏制五等爵三等受地殷湯承之合伯子男為一惟有公侯伯三等爵三等受地武王伐紂增以子男爵地與夏同周公制禮始為此五等爵五等受地云周公變殷湯之制雖小國地皆方百里者以其不方百里不成國也既皆滿百里其餘待有功乃有益地公有功益滿五百里侯伯已下皆然男有功止得百里更有功乃更進之與子爵必知不即封而設法以待有功者以其稱公者唯有二王後及東西大伯今八州若皆封公八州豈有三十二公乎明知是設法以待有功若無功縱本是公爵唯守百里地故注王制云是以周制有爵尊而國小爵卑而國大云公侯伯子男不是過者五百里以下若過五百里則是特賜法若魯衛也云州二百一十國以男備其數者州有千里之方六用五個千里封之得四公六侯十一伯二十五子百男僅得一百四十六於二百一十國仍少六十四并餘千里之方一充數不足何得更為附庸若然於前侯國六內用千里方仍有二百里方一得四個男國於十一伯內又得一個男國得此添前一百四十六為一百五十一仍少五十九更取餘一千里方內取五十九國添之餘百里之方四十一以為附庸有人受之為附庸無則為閒田使大夫治之若四等公邑是也云四海之封亦如之者此經唯言九州故鄭兼見四海夷鎮藩亦如之者有功亦有加地得至四百里但不進爵耳曲禮云其在夷狄戎蠻雖大曰子是也凡邦國小大相維注大國比小國小國事大國各有屬相維聨也疏王制云五國以為屬屬有長之類是各有屬相維聨之事也王設其牧注選諸侯之賢者為牧使牧理之制其職各以其所能注牧監參伍之屬用能所任秩次訓按侯國之卿大夫士命數王亦制之制其貢各以其所有王將巡守則戒于四方曰各修平乃守考乃職事無敢不敬戒國有大刑注守謂國竟之內職事所當共具訓按守如孟子所謂入其疆土地闢之類及王之所行先道帥其屬而巡戒令注先道先由王所從道君前行其前日所戒之令王殷國亦如之注殷猶衆也十二嵗王若不巡守則六服盡朝謂之殷國其戒四方諸侯與巡守同疏王有故不巡守方嶽之下則春東方盡來夏南方盡來秋西方盡來冬北方盡來王待之亦各於其時在國外為壇行朝覲盟載之法若然亦戒令四方諸侯者殷國所在無常或在國外或向畿外侯國行故有戒令之事訓謹詳周設職方之官蓋所以遙制邦國諸侯故其篇末以邦國終焉首言九州山川者蓋名山大澤不以封此是王者所有故别言之九服以次而出經也公侯伯子男大小殊制是其緯也使之大小相維則諸侯之親諸侯也為之設其牧制其職施其貢而巡守則天子之親諸侯也此周官治外之法也土方氏掌土圭之法以致日景注致日景者夏至景尺有五寸冬至景丈三尺其間則日有長短以土地相宅而建邦國都鄙相息亮反注土地猶度地知東西南北之深而相其可居者宅居也訓以土圭相宅建國者蓋以辨南北向背之方以辨土宜土化之法而授任地者注土宜謂九榖稙稚所宜也土化地之輕重糞種所宜用也任地者載師之屬王巡守則𣗳王舍注為之藩羅疏掌舍設梐枑此官亦於外周匝𣗳藩羅懷方氏掌來逺方之民致方貢致逺物而送逆之達之以節注逺方之民四夷之民也諭德延譽以來之逺物九州之外無貢法而至者達民以旌節達貢物以璽節治其委積館舍飲食注續食其往來合方氏掌達天下之道路注津梁相凑不得陷絶通其財利注懋遷其有無同其數器注權衡不得有輕重一其度量注尺丈釡鍾不得有大小除其怨惡注怨惡邦國相侵虐訓除蓋解釋之同其好善注所好所善謂風俗所高尚訓同蓋教道之使以善為尚也訓方氏掌道四方之政事與其上下之志注道猶言也為王說之四方諸侯也上下君臣也誦四方之𫝊道注𫝊道世世所𫝊說往古之事也正嵗則布而訓四方注布告以教天下使知世所善惡訓布而訓之者美者以為法惡者以為戒使衆國皆相通知而觀新物注四時於新物出則觀之以觀民志所好惡志淫行辟則當以政教化之疏此觀新物即王制云命市納價形方氏掌制邦國之地域而正其封疆無有華離之地華依注音􅏠苦哇反注華讀為􅏠哨之􅏠正之使不􅏠邪離絶疏􅏠哨者投壺禮有枉矢哨壺是不正之義􅏠者兩頭寬中狹邪者一頭寬一頭狹正其封疆不使相侵使小國事大國大國比小國注比猶親也山師掌山林之名辨其物與其利害而頒之于邦國使致其珍異之物注山林之名與物若岱畎絲枲嶧陽孤桐矣利其中人用者害毒物及螫噬之蟲獸川師掌川澤之名辨其物與其利害而頒之于邦國使致其珍異之物注川澤之名與物若泗濵浮磬淮夷蠙珠暨魚澤之萑蒲邍師掌四方之地名辨其丘陵墳衍邍隰之名邍音原注地名若東原大陸之屬物之可以封邑者注物之謂相其土地可以居民立邑疏四井為邑據田中千室之邑據城二者皆須物之匡人掌達法則匡邦國而觀其慝使無敢反側以聽王命注法則八法八則也邦國之官府都鄙亦用焉反側背違法度也撢人掌誦王志道國之政事以巡天下之邦國而語之使萬民和悅而正王面說音悅注面猶鄉也使民之心曉而正鄉王都司馬掌都之士庶子及其衆庶車馬兵甲之戒令注庶子卿大夫士之子車馬兵甲備軍發卒疏都王子弟及三公采地司馬主其軍賦若王家有軍事徴兵于采地則都司馬以書致于士庶子有此衆庶車馬兵甲之戒令士庶子受而依行之以國法掌其政學注政謂賦稅也學修德學道疏正謂軍之賦稅無田稅泉稅以聽國司馬注聽者受行其所徴為也國司馬大司馬之屬皆是疏大司馬之屬謂軍司馬輿司馬行司馬家司馬亦如之注大夫家臣為司馬者春秋𫝊曰叔孫氏之司馬騣凶鬯匕戾疏序官注卿大夫之采地王不特置司馬各自使其家臣為司馬往聽政于王之司馬周禮纂訓卷十八
