body:
  text: 周禮纂訓禮類一周禮之屬提要臣等謹按周禮纂訓二十一卷國朝李鍾倫撰鍾倫字世得安溪人康熙癸酉舉人未仕而卒此書自天官至秋官詳纂注疏加以訓義惟闕考工記不釋葢以河間獻王所補非周公之古經也書後有乾隆丁丑其子廣平府知府清馥跋稱鍾倫初受三禮於其叔光坡康熙癸酉鄉薦公車後日侍其父光地於京邸及光地出督順天學政復遷直𨽻巡撫十餘年中鍾倫皆隨行得其指授又多與宣城梅文鼎長洲何焯宿遷徐用錫河間王之鋭同里陳萬䇿等互相討論故其學具有本源凡所詮釋頗得周官大義惟於名物度數不甚加意故徃徃考之弗詳如巾車重翟錫面朱總厭翟勒面繢總安車彫面鷖總皆有容葢註總以繒為之著馬勒直兩耳與兩鑣車衡輨亦宜有焉容為襜車山東謂之裳惟蓋如今小車葢也皆有容有葢則重翟厭翟謂蔽也安車無蔽謂去飾也鍾倫謂總惟當施馬於車義無所取考蔡邕獨㫁曰飛軨以油緹廣八寸長注地左畫蒼龍右畫白虎繫軸頭續漢書輿服志曰乗輿重牙班輪升龍飛軨注引薛綜東京賦注飛軨以油緹廣八寸長注地繋軸頭所云油緹即注所云總以繒為之所云軸頭即注所云輨然則飛軨即總之在車者而鍾倫謂總惟飾馬誤矣鍾倫又謂容以繒結四旁之上際其四旁之下際則以翟為蔽攷經文皆有容葢寔兼承上重翟厭翟安車而言但重翟厭翟二車既有容葢又有翟蔽兩旁以畫飾安車則惟有容葢而無翟飾耳既無翟飾即惟藉裳惟為障蔽帷裳之制當四面圍合上下通徹故詩曰漸車帷裳箋云帷裳童容也方言䄡䄖江淮南楚謂之􅥗褣童容與􅥗褣義同葢􅥗褣長𥜗上下相連以覆體車之帷裳垂覆上下形相似也又士昏禮婦車亦如之有裧注裧車裳帷續漢書輿服志注舊典𫝊車驂駕赤帷裳惟郭賀為冀州勅去䄡帷釋名衽䄡也在旁幨幨然云襜帷葢如裳衽下垂也凡此皆同于巾車之安車但有帷裳無重翟厭翟者也如鍾倫所云帷裳但結四旁之上際其四旁下際以翟為蔽則安車但蔽上際不復蔽下際矣釋名曰容車婦人所載小車也其葢施帷以隠蔽其形容也若容但蔽上際不及下際豈能隠蔽形容乎如此之類頗為疎舛然如辨禘祫社稷學校諸篇皆攷證詳核又如司馬法謂革車一乗甲士三人歩卒七十二人鍾倫據蔡氏説謂一乗不止甲士三人歩卒七十二人此是輕車用馬馳者更有二十五人将重車在後今攷新書攻車七十五人前拒一隊左右角二隊守車一隊炊子十人守装五人廐養五人樵汲五人共二十五人攻守二乗共百人又尉繚子伍制令軍中之制五人為伍伍相保也十人為什什相保也五十人為屬屬相保也百人為閭閭相保也起于五人訖于百人葢軍中之制自一乗起此皆一乗百人之明驗足證其説之精核又明于推步之術訓大司徒土圭之法謂六十餘里餘景已差一寸亦得諸寔測非同講學家之空言也乾隆四十六年十一月恭校上總纂官臣紀昀臣陸錫熊臣孫士毅總校官臣陸費墀
