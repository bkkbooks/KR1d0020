body:
  text: 周禮纂訓卷十三安溪李鍾倫撰太卜掌三兆之法一曰玉兆二曰瓦兆三曰原兆注兆者灼龜發於火其形可占者其象似玉瓦之璺鏬是用名之焉上古以來作其法可用者有三原原田也杜子春云玉兆帝顓頊之兆瓦兆帝堯之兆原兆有周之兆其經兆之體皆百有二十其頌皆千有二百注頌謂繇也三法體繇之數同其名占異耳百二十每體十繇體有五色洪範所謂曰雨曰濟曰圛曰蟊曰尅疏云三法名占異者以三易名異占亦異則三兆亦然掌三易之法一曰連山二曰歸藏三曰周易注易者揲蓍變易之數可占者也杜子春云連山宓戲歸藏黃帝其經卦皆八其别皆六十有四注三易卦别之數亦同其名占異也疏云名占異者名異謂連山歸藏周易占異謂連山歸藏占七八周易占九六掌三夢之法一曰致夢二曰觭夢三曰咸陟夢本多作􅬤􅬤音夢觭居綺反注掎同又音攲去竒切陟如字注夢者人精神所寤可占者致夢言夢之所至夏后氏作焉咸皆陟得也言夢之皆得周人作焉杜子春觭讀為竒𤣥謂觭讀如掎亦得也言夢之所得殷人作焉訓家君子曰此與前三兆三易分為三家者異故下直云其經運十其别九十不言皆也致夢有以致之晝所思為夜則成夢是也觭夢亦思為所致而詭異不測衛玠謂夢有想有因致夢觭夢之謂也咸感也陟升也精神感而上通與鬼神合其吉凶以其無心焉故曰咸也及其占之則以其時日月星辰之運如占夢所云也觭夢之為因如因羊念馬因馬念車之類其經運十其别九十注運當為輝是視祲所掌十輝也夜有夢則晝視日旁之氣以占其吉凶每輝九變此術今亡訓家君子曰運謂日月星辰之運以邦事作龜之八命一曰征二曰象三曰與四曰謀五曰果六曰至七曰雨八曰瘳廖勑留反注國之大事待蓍龜而决者有八定作其辭於將卜以命龜也征謂征伐亦云行巡守也象謂災變雲物之屬與謂所與共事也謀謂謀議也果謂事成不也至謂至不也瘳謂疾瘳不也訓家君子曰與者以爵祿與人愚謂征與象皆大事也故先與者問可與否猶未與也謀者謀可為否猶未為也皆未形者也故次之果者事已為而卜其濟否至者人欲來而卜其至否曰雨曰瘳皆迹之已著者也故又次之以八命者贊三兆三易三夢之占以觀國家之吉凶以詔救政注以此八事命卜筮蓍龜參之以夢詔告也非徒占其事吉則為否則止又佐眀其繇之占演其意以視國家餘事之吉凶凶則告王救其政凡國大貞卜立君卜大封則視髙作龜注貞問也卜立君君無冢適卜可立者大封謂境界侵削卜以兵征之視髙以龜骨髙者可灼處示宗伯也大事宗伯涖卜作龜謂以火灼之以作其兆春灼後左夏灼前左秋灼前右冬灼後右訓大封蓋封國大宗伯曰王大封則先告后土是也大祭祀則視髙命龜注命龜告龜以所卜之事不親作龜者輕於大貞也訓大祭祀作龜當卜師為之凡小事涖卜注代宗伯訓其命龜亦當卜師為之與國大遷大師則貞龜注正龜於卜位也不親命龜輕於大祭祀也凡旅陳龜注陳龜於饌處也不親貞龜輕於大遷大師也凡喪事命龜注士喪禮則筮宅卜日天子卜葬兆訓家君子曰視髙者仰視髙處蓋髙者神眀所在故作龜命龜皆視髙今之術者猶然古者遷國行師必以龜從貞龜者正龜位而以行也祭饗有陳寶玉之事而龜其一𫝊曰龜為前列先知也大旅陳龜義蓋如此二者非用以卜注以輕重别之可疑喪事與祭祀同後言之者凡喪事多後之卜師掌開龜之四兆一曰方兆二曰功兆三曰義兆四曰弓兆注開開出其占書也經兆百二十體今言四兆者分之為四部若易之二篇其云方功義弓之名未聞訓家君子曰開占書而以占者占人之事卜師所掌在于作龜所謂開龜者蓋作龜也四兆者鑿龜之四方鄭氏云春灼後左夏灼前左秋灼前右冬灼後右是也方功義弓之義未聞凡卜事視髙揚火以作龜致其墨注家君子曰墨者凡將灼之處先墨之然後灼之以致其兆書曰惟洛食謂食墨也凡卜蓋有龜燋者有不食墨者墨水也燋契火也火過而陽則燋矣水過而隂則不食墨矣二者皆不待兆來而知其凶也凡卜辨龜之上下左右隂陽以授命龜者而詔相之注所卜者當各用其龜也上仰者也下俯者也左左倪也右右倪也隂後弇也陽前弇也詔相告以其辭及威儀訓小事則卜師命龜卜人作龜卜師自命龜即自辨之可知必辨其何龜者蓋命龜之辭須識其名龜人掌六龜之屬各有名物天龜曰靈屬地龜曰繹屬東龜曰果屬西龜曰靁屬南龜曰獵屬北龜曰若屬各以其方之色與其體辨之繹音亦果魯火反靁力胃反注屬言非一也色謂天龜𤣥地龜黃東龜青西龜白南龜赤北龜黑龜俯者靈仰者繹前弇果後弇獵左倪靁右倪若是其體也東龜南龜長前後在陽象經也西龜北龜長左右在隂象緯也疏此注六龜之體據爾雅而言左倪右倪者龜頭或向左或向右睥睨也云陽象經隂象緯者凡天地之間南北為經東西為緯凡取龜用秋時攻龜用春時各以其物入于龜室注六龜各異室也秋取龜及萬物成也攻治也治龜骨以春是時乾解不發傷也疏六龜各入一室蓋蓍龜嵗易秋取春攻訖即欲易去前龜也上春釁龜祭祀先卜注釁者殺牲以血之先卜始卜筮者言祭言祀尊焉天地之也世本作曰巫咸作筮卜未聞其人也上春夏正建寅之月月令孟冬云釁祠龜䇿秦以十月建亥為嵗首亦或以嵗首釁龜耳訓秦與周釁龜異時注意但取嵗首與上春相况耳若有祭事則奉龜以往疏但云祭事不辨外內則外內俱當卜旅亦如之喪亦如之菙氏掌共燋契以待卜事菙氏夲又作同時髓反燋音焦即消切又音爵契苦計反劉苦潔反注士喪禮曰楚焞置于燋在龜東楚焞即契所用灼龜也燋謂炬其存火疏楚荆也謂荆為楚用之焞龜開兆凡卜以眀火藝燋遂吹其焌契以授卜師遂役之焌音俊又存悶反注明火以陽燧取火於日焌讀如戈鐏之鐏謂以契柱燋火而吹之也以授卜師用作龜也役之使助之疏云讀如戈鐏者取鋭頭以灼龜之意柱燋火者以焌契柱於燋火吹之也占人掌占龜以八簭占八頌以八卦占簭之八故以視吉凶簭音筮訓家君子曰言占龜蓍亦在其中矣以八簭占八頌者以八命而占龜也以八卦占簭之八故者以八命而占蓍也各互其文其實一也案此簭字只作叩問之意凡卜簭君占體大夫占色史占墨卜人占坼坼音􅠂丑格切注體兆象也色兆氣也墨兆廣也坼兆釁也體有吉凶色有善惡墨有大小坼有微眀尊者視兆象而已卑者以次詳其餘也周公卜武王占之曰體王其無害凡卜象吉色善墨大坼明則逢吉疏云體兆象者謂金木水火土五種之兆其墨縱橫形體象似金木水火土也凡卜灼龜之四足依四時灼之其兆直向上背者為木兆直下向足者為水兆邪向背者為火兆邪向下者為金兆橫者為土兆云色兆氣者雨霽之等是也兆廣據兆之正釁處訓家君子曰君大夫以下雖以次而占然占其吉凶則亦占人之事凡卜簭既事則繫幣以比其命嵗終則計其占之中否注既卜簭史必書其命龜之事及兆於䇿繫其禮神之幣而合藏焉書曰王與大夫盡辨開金縢之書乃得周公所自以為功代武王之說是命龜書訓以比其命謂與命辭合藏之也簭人掌三易以辨九簭之名一曰連山二曰歸藏三曰周易九簭之名一曰巫更二曰巫咸三曰巫式四曰巫目五曰巫易六曰巫比七曰巫祠八曰巫參九曰巫環以辨吉凶巫音筮比毗志反注此九巫讀皆當為筮字之誤也更謂筮遷都邑也咸猶僉也筮衆心歡不也式謂筮制作法式也目謂事衆筮其要所當也易謂民衆不說筮所改易也比謂筮與民和比也祠謂筮牲與日也參謂筮御與右也環謂筮致師也訓家君子曰八事已盡之矣又有九簭何與按世本巫咸作簭由此推之九簭其九家之法與凡國之大事先簭而後卜注於簭之凶則止不卜上春相簭相息亮反注相謂更選擇其蓍蓍龜嵗易者與凡國事共簭占夢掌其嵗時觀天地之㑹辨隂陽之氣注天地之㑹建厭所處之日辰隂陽之氣休王前後疏云建厭所處之日辰者建謂斗柄所建謂之陽建左旋于天厭謂日前一次謂之隂建右旋於天假令正月陽建於寅則隂建在戌日辰者日據干辰據支休王前後者假令當春木旺水生木水休木勝土土死木王火相王所生者相相所勝者囚金囚觀此建厭所在辨隂陽之氣以知吉凶也訓家君子曰此天地之㑹隂陽之氣皆察之於日月星辰而見者也以日月星辰占六夢之吉凶注日月星辰謂日月之行及合辰所在春秋昭三十一年十二月辛亥朔日有食之是夜也晉趙簡子夢童子倮而轉以歌旦而日食占諸史墨對曰六年及此月也吳其入郢乎終亦弗克入郢必以庚辰日月在辰尾庚午之日日始有適火勝金故弗克此以日月星辰占夢者一曰正夢注無所感動平安自夢二曰噩夢噩五各反注愕同注謂驚愕而夢三曰思夢注覺時所思念而夢四曰寤夢注覺時道之而夢五曰喜夢注喜悅而夢六曰懼夢注恐懼而夢訓家君子曰思當為覺夢中忽有所知寤者忽有所見正夢噩夢者咸陟之類也覺夢寤夢者竒夢之類也喜夢懼夢者致夢之類也愚謂噩者非人世耳目所經而夢中創見之思者精専所極積思而夢如髙宗夢傅說也寤夢者似夢非夢也喜夢懼夢者蓋有喜則有懼非恐懼之懼喜在此則懼在彼如餒夢食寒夢衣是喜夢餒夢餓寒夢凍是懼夢蓋因氣有盈歉正夢思夢咸陟也噩夢寤夢竒夢也喜夢懼夢致夢也思夢乃思而成不謂之致夢者以其精神所召是神明啓之與泛泛相致者不同季冬聘王夢獻吉夢于王王拜而受之注聘問也夢者事之祥吉凶之占在日月星辰季冬日窮于次月窮于紀星回于天數將幾終於是發幣而問焉因獻羣臣之吉夢於玉歸美焉訓家君子曰獻其吉者則凶者在所修省可知乃舍萌于四方以贈惡夢舍音釋萌亡耕反注舍萌謂釋菜也萌菜始生也贈送也遂令始難驅疫難乃多反劉依杜乃旦反驅音區豈俱切注令令方相氏也難謂執兵以有難卻也方相氏帥百𨽻為之月令季春之月命國難九門磔攘以畢春氣仲秋天子乃難以逹秋氣季冬命有司大難旁磔出土牛以送寒氣視祲掌十輝之法以觀妖祥辨吉凶輝音運古音熏廣韻音混胡本切又音揮注輝日光氣也訓家君子曰注以此十輝即前經運愚謂經運即日月星辰之經運固有十耳輝氣以贊經運之占而占固不止於輝也氣音氣一曰祲二曰象三曰鐫四曰監五曰暗六曰瞢七曰彌八曰叙九曰隮十曰想鐫音墮許規切又户圭切瞢音夢莫中切又武登切隮子兮反注祲隂陽氣相侵也象者如赤鳥也鐫謂日旁氣刺日也監雲氣臨日也暗日月食也瞢日月瞢瞢無光也彌氣貫日也叙者雲有次序隮虹也詩云朝隮于西想雜氣有似可形想掌安宅叙降注宅居也降下也人見妖祥則不安主安其居處也次序其凶禍所下謂禳移之訓家君子曰降者神之所下有吉有凶安民之居而叙神之所下則可以使民避凶就吉矣正嵗則行事嵗終則弊其事注正月而行安宅之事所以順民弊斷也謂計其吉凶然否多少訓愚謂正嵗行事如左傳日南至公既視朔遂登觀臺以望而書禮也蓋於嵗首之時占望雲物即十輝之法也十輝蓋直用以占吉凶者不待夢而為之故視祲與占夢所掌各别可見大祝掌六祝之辭以事鬼神示祈福祥求永貞一曰順祝二曰年祝三曰吉祝四曰化祝五曰瑞祝六曰策祝策音策注永長也貞正也求多福歷年得正命也順祝順豐年也年祝求永貞也吉祝祈福祥也化祝弭灾兵也瑞祝逆時雨寧風旱也策祝逺罪疾訓福祥者祈民物之安永貞者求有國之祚順祝蓋祭祀天地宗廟之祝記曰孝子之祭必受其福福者備也百順之名也王者於天地蓋亦有祖孫之合年祝蓋祈年及索饗時祝吉祝蓋喪畢吉禘之祝化祝蓋喪祝瑞祝蓋即大封時告后土之祝策祝蓋祀先卜時祝謂使龜筮協從也六祝之中皆有祈福祥求永貞之語掌六祈以同鬼神示一曰類二曰造三曰禬四曰禜五曰攻六曰說造七報反禬古外反禜音詠注祈嘄也謂有災變號呼告于神以求福天神人鬼地示不和則六癘作見故以祈禮同之類造禬禜攻說皆祭名造祭於祖類祭于上帝故曰大師造于祖類上帝禜日月星辰山川之祭也春秋𫝊曰日月星辰之神則霜雪風雨之不時於是乎禜之山川之神則水旱疫癘之災於是乎禜之類造加誠肅求如志禬禜告之以時有災變也攻說則以辭責之攻如其鳴鼓然董仲舒救日食祝曰照照大眀瀐滅無光奈何以隂侵陽以卑侵尊是之謂說造類禬禜皆有牲攻說用幣而已疏知類造禬禜皆有牲按祭法云埋少牢於泰昭祭時也鄭云凡此以下皆用少牢此禱祈之祭中有幽禜雩禜禜既用牲故知類造皆有牲知攻說用幣者日食伐鼓之屬天災有幣無牲故知用幣而已訓同者同人物與鬼神示也非鬼神示自相同也猶曰和同天人之際耳嘄音叫瀸子亷反作六辭以通上下親疏逺近一曰祠二曰命三曰誥四曰㑹五曰禱六曰誄注祠當為辭交接之辭春秋傳曰古者諸侯相見號辭必稱先君以相接命論語所謂為命誥謂康誥之屬㑹謂㑹同盟誓之辭禱賀慶言福祚之辭禮記君子謂之善頌善禱是禱之辭誄謂積纍生時德行以錫之春秋𫝊孔子卒哀公誄之或曰論語所謂誄曰禱爾于上下神祗訓愚謂誄謂相弔言禍災之辭春秋傳宋大水公使弔之天降淫雨害于粢盛若之何不弔辨六號一曰神號二曰鬼號三曰示號四曰牲號五曰齍號六曰幣號齍音咨注號謂尊其名更為美稱焉神號若云昊天上帝鬼號若云皇祖伯某示號若云后土地示牲號曲禮所謂牛曰一元大武齍號曲禮所謂黍曰薌合之屬幣號若玉曰嘉玉幣曰量幣辨九祭一曰命祭二曰衍祭三曰炮祭四曰周祭五曰振祭六曰擩祭七曰絶祭八曰繚祭九曰共祭衍音延炮百交反擩音乳而主切又而泉反一音而劣反劉而誰反繚音了共音恭注九祭皆謂祭食者命祭者玉藻曰若賜之食而君客之則命之祭然後祭是也衍當為延炮當為包延祭者曲禮曰客若降等執食興辭主人興辭於客然後客坐主人延客祭是也包猶兼也有司曰宰夫贊者取白黑以授尸尸受兼祭于豆祭是也周猶遍也曲禮曰殽之序遍祭之是也振祭擩祭本同不食者擩則祭之將食者既擩必振乃祭也繚祭以手從肺本循之至于末乃絶以祭絶祭不循其本直絶肺以祭也絶祭繚祭亦本同禮多者繚之禮略者絶則祭之共猶授也王祭食宰夫授祭疏知是生人祭食非祭鬼神之事者祭人鬼天神地示大宗伯辨之不須大祝也云兼祭白黑者彼注云白謂稻黑謂黍云振祭擩祭本同者謂皆擩但振者先擩復振擩者不振言不食者特牲少牢皆有挼祭挼祭未食之前以菹擩于醢祭于豆間是不食者擩則祭之云將食者特牲少牢皆有主人獻尸賓長以肝從尸右取肝擩于鹽振祭嚌之祭訖即嚌之是將食也云絶祭繚祭本同者謂皆絶之但絶者不繚繚者亦絶云禮多繚之者據鄉飲酒是鄉大夫賓興賢能行之云禮略絶之者據鄉射州長射是士禮辨九􅉔一曰䭫首二曰頓首三曰空首四曰振動五曰吉􅉔六曰凶􅉔七曰竒􅉔八曰褒􅉔九曰肅􅉔以享右祭祀􅉔音拜下同䭫音啓本又作稽竒紀宜反褒音報注稽首拜頭至地也頓首拜頭叩地也空首拜頭至手所謂拜手也振動振栗變動之拜吉􅉔拜而後稽顙謂齊衰不杖以下者言吉者此殷之凶拜周以其拜與頓首相近故謂之吉拜凶拜稽顙而後拜謂三年服者竒拜謂一拜答臣下之拜褒拜再拜拜神與尸肅拜但俯下手今時撎是也介者不拜故曰為事故敢肅使者享獻也謂朝獻饋獻也右讀為侑侑勸尸食疏稽首頓首空首三者相因空首者兩手拱至地乃頭至手也頓首者謂空首之時引頭至地即舉稽首者稽留之義謂首至地多時也拜中惟稽首最重諸侯於天子臣于君乃有之按哀十七年齊侯稽首公拜齊人怒武伯曰非天子寡君無所稽首又公如晉稽首晉人辭曰天子在而君辱稽首寡君懼矣郊特牲曰大夫之臣不稽首以避君也然則大夫之臣及敵者皆從頓首差次推之君拜臣下當從空首云吉拜拜而後稽顙者稽顙還是頓首但觸地無容此拜先作頓首後作稽顙云齊衰不杖已下者以杖齊衰皆入凶拜中也雜記云為妻父在不杖不稽顙明父歿則杖稽顙但適子妻父為主故父在不稽顙衆子雖父在亦稽顙不言者以適子有不稽顙時故略不言云一拜君拜臣下者按燕禮大射有一拜之時君答一拜或解一拜答臣下亦據祭祀時以其燕禮君答拜臣或再拜時故也云肅拜即今時撎者推手曰揖引手曰撎軍中及婦人用之九拜之中振動附稽首凶拜褒拜皆附稽首吉拜附頓首竒拜附空首訓愚謂振動者蓋張拱振衣為容而拜其用之未有考焉空首即手拜見少儀婦人為尸坐則不手拜撎於至反即今之揖凡大禋祀肆享祭示則執眀水火而號祝注明水火司烜所共日月之氣以給蒸享執之如以六號祝眀此圭潔也疏謂號祝執此明水火明主人圭潔之德隋釁逆牲逆尸令鍾鼓右亦如之隋許規反又惠恚反注隋釁謂薦血也凡血祭曰釁既隋釁後言逆牲容逆鼎疏上三祀皆有此隋釁薦血之事但天地薦血于座前宗廟即血以告殺來瞽令臯舞臯音嘷户髙反注臯讀為嘷呼之嘷來嘷皆謂呼之入相尸禮相息亮反注延其出入詔其坐作既祭令徹疏詩云諸宰君婦廢徹不遲是祭訖尸謖之後大祝命徹大喪始崩以肆鬯渳尸相飯贊斂徹奠渳彌爾反飯扶晚反注肆鬯所為陳尸設鬯也渳尸以鬯浴尸疏不言贈含者太宰贊之云贊斂者斂是冬官事太祝贊之言甸人讀禱付練祥掌國事付音祔注甸人喪事代王受眚災大祝為禱辭語之使以禱於籍田之神付當為祔祭於先王以祔後死者掌國事辨護之國有大故天烖彌祀社稷禱祠注大故兵冦也天烖疫癘水旱也彌猶遍也遍祀社稷及諸所禱既則祠之以報焉大師宜于社造于祖設軍社類上帝國將有事于四望及軍歸獻于社則前祝注設軍社者春秋傳曰君以師行祓社釁鼓祝奉以從是也前祝者王出也歸也將有事於此神大祝居前先以祝辭告之疏宜于社即將社主行造于祖七廟俱祭取遷廟主行國將有事於四望者謂軍行所過山川造祭乃過也訓先社祖而後及類望者出行之序社祖在國望類在郊也家君以望為日月星辰大㑹同造于廟宜于社過大山川則用事焉反行舍奠舍音釋注玉人職有宗祝以黃金勺前馬之禮是謂過大山川與曽子問曰凡告用牲幣反亦如之疏此所過山川非直用黃金勺酌獻而已亦有牢故校人職云將有事於四海山川則飾黃駒注謂王巡守過大山川之禮云反行舍奠者還祭七廟王制曰歸格于祖禰用特建邦國先告后土用牲幣疏雖告祭非常亦用牲幣禮動不虛也禁督逆祀命者注督正也正王所命諸侯之所祀有逆者刑罰焉頒祭號于邦國都鄙注祭號六號訓頒祭號頒其所當祀者也小祝掌小祭祀將事侯禳禱祠之祝號以祈福祥順豐年逆時雨寧風旱彌烖兵逺罪疾彌音敉逺于萬反注侯之言候也候嘉慶祈福祥之屬禳禳卻凶咎寧風旱之屬彌讀曰敉敉安也大祭祀逆齍盛送逆尸沃尸盥贊隋贊徹贊奠注隋尸之祭也奠奠爵也祭祀奠先徹後反言之者眀所佐大祝非一疏逆齍盛者饋獻後尸入室食小祝於廟門外迎禧人之齍盛于廟堂東實之薦於神前送迎尸者將祭迎尸入祭未送尸出贊奠者大祝酌酒奠于鉶南郊特牲注所謂天子奠斝諸侯奠角其時小祝贊之鄭知贊隋是尸隋祭不是主人受酢時隋祭者以文承逆尸沃尸之下也凡事佐大祝疏佐大祝不于職末言之者欲見自此以上有佐大祝者自此以下惟大喪贊渳佐大祝設熬以下小祝専行大喪贊渳注渳謂浴尸設熬置銘熬五羔反注熬者棺既蓋設於其旁所以惑蚍蜉也銘書死者名于旌士喪禮曰為銘各以其物亡則以緇長半幅頳末長終幅廣三寸書名于末曰某氏某之柩竹杠長三尺置于西階上疏為名各以其物者謂用生時旌旗王則大常無謂生時無旌旗者子男之士不命是也緇半幅謂長一尺赬赤色終幅長二尺書名于赬末也竹杠長三尺者按禮緯天子旗杠九仞諸侯七大夫五士三今士三尺者則天子以下皆以尺易仞也及葬設道齎之奠分禱五祀齎音咨注齎猶送也送道之奠謂遣奠也分其牲體以祭五祀疏言分牲體者設大遣奠包牲取下體下體之外分為五處祭也大師掌釁祈號祝注釁謂釁鼓春秋傳曰君以軍行祓社釁鼓祝奉以從有冦戎之事則保郊祀于社注保祀互文郊社皆守而祀之彌烖兵訓愚謂社在國中不須保四郊有天神兆位故須保之又不用命戮于社是社主殺伐之事故須祀之與天神無與凡外內小祭祀小喪紀小㑹同小軍旅掌事焉喪祝掌大喪勸防之事注勸猶倡帥前引者防謂執披備傾虧疏引者在柩車前防謂披在柩車旁司士作六軍之士執披此官掌勸防之事及其行事則下文及朝御匶以下是也及辟令啓注辟謂除菆塗椁也令啓喪祝命役人開之也檀弓曰天子之殯也菆塗龍輴以椁加斧於椁上畢塗屋天子之禮也訓按檀弓疏解菆聚也聚木攢龍輴四面而塗之龍輴車也以椁者狀如椁也謂置棺於龍車然後聚木蔽車而塗其四面如椁然又加黼文於其上以為蓋此是天子殯法龍輴疏云置於西階上內設四棺大斂於阼階畢乃入棺也及朝御匶乃奠朝直遙反匶音舊注朝謂將葬朝于祖考之廟而後行則喪祝為御匶檀弓曰殷朝而殯於祖周朝而遂葬乃奠謂朝廟奠疏及朝者侵夜啓殯昧爽朝廟按既夕禮初來至廟設奠至明徹宿奠乃設此朝廟之奠知者以文在朝下明非宿奠也引檀弓者殷人始死斂訖即以柩朝廟而就殯之周人不殯於廟殯於路寢將葬以次朝廟先禰而後祖别一宿後朝始祖朝也按趙商問晉文公殯于曲沃是就祖殯答曰既夕將葬遷於祖是周公正經末世諸侯禮不能盡同也及祖飾棺乃載遂御注祖謂將葬祖於庭喪祝主飾棺其序載而後飾既飾當還車鄉外喪祝御之御之者執翿居前卻行為節度疏及祖者初朝禰次第朝親廟四次朝二祧次朝始祖至此廟中乃設祖祭按既夕禮請祖期曰日側乃飾棺設帷荒之屬飾訖還車向外乃設祖於庭行祖祭訖至眀旦乃行大遣奠既奠引柩向壙也及葬御匶出宫乃代注喪祝二人相與更也及壙說載除飾說吐活反注壙謂穿中也說載下棺也除飾便其窆耳周人之葬牆置翣疏牆置翣者牆謂帷荒與柩為鄣若牆然翣在道柩車旁人執之入壙置於椁旁故云置也引之者證飾既除還入壙設之小喪亦如之疏小喪王后世子亦如之自勸防已下掌喪祭祝號注喪祭虞也訓喪主哀其牲齍幣之屬不從吉祭號祝王弔則與巫前注喪祝與巫以桃厲執戈在王前疏案喪大記小臣執戈則桃茢二者祝與巫執之執戈是小臣也掌勝國邑之社稷之祝號以祭祀禱祠焉凡卿大夫之喪掌事而斂飾棺焉疏言掌事者勸防已下但禮有隆殺斂謂兼主斂事甸祝掌四時之田表貉之祝號貉莫駕反注禡同甸音田注貉亦或為禡師祭也田者習兵之禮故亦禡祭舍奠于祖廟禰亦如之舍音釋注舍奠者告將時田疏非時而祭曰奠以其不立尸也訓用師造于廟大祝掌之師甸致禽于虞中乃屬禽及郊饁獸舍奠于祖禰乃斂禽禱牲禱馬皆掌其祝號屬音燭饁于輒反禱音誅一音禱注師田謂起大衆以田也致禽于虞中使獲者各以其禽來致于所表之處屬禽别其種類饁饋也以所獲獸饋于郊薦于四方羣兆入又以奠于祖禰薦且告反也斂禽謂取三十入臘人也禱牲禱馬為牲祭求肥克為馬祭求肥健疏云斂禽取三十者按榖梁每禽擇取三十知入臘人者臘人掌脯臘乾之以為豆實供祭祀其餘可以充賓客及充君之庖不言者舉祭祀重者也詛祝掌盟詛類造攻說禬禜之祝號注盟詛主於要誓大事曰盟小事曰詛疏類造以下是大祝六祈但大祝不掌祝號秋官有司盟此兼掌之者司盟直掌盟載之法不掌祝號與載辭盟者盟將來詛者詛往事作盟詛之載辭以叙國之信用以質邦國之劑信注載辭為辭而載之於䇿國王之國邦國侯國也質正也成也訓但言盟詛者類造已下之辭大祝作之叙國之信據一國言謂載中叙之也質邦國之劑信據兩國相承言以我之信成彼之信也質劑二字本於券書然用之以為結信之意亦可不必盡券書也司巫掌羣巫之政令若國大旱則帥巫而舞雩注雩旱祭也天子於上帝諸侯於上公疏案月令大雩帝下文又命百縣雩祀百辟卿士即古上公勾龍棄之等國有大烖則帥巫而造巫恆注杜子春云司巫帥羣巫㑹聚常處以待命也𤣥謂恆久也巫久者先巫之故事造之當按視所施為祭祀則共匰主及道布及蒩館匰音丹蒩子都反注匰器名主謂木主也道布為神所設巾中霤禮曰以功布為道布屬于几也蒩之言藉也祭食有當藉者館所以承蒩謂若今筐也主先匰蒩後館互言之共主以匰共蒩以筐大祝取其主蒩陳之器則退也士虞禮曰苴刌茅長五寸實于筐饌于西坫上疏刌切也饌陳也刌音寸凡祭祀守瘞瘞音䋵於例切注瘞謂若祭地示有埋牲玉者也守之者以祭禮未畢若有事然祭禮則去之訓愚謂瘞不止地示如埋少牢於泰昭祭時也又如天子將出造于祖禰以幣帛皮圭反則奠乃斂玉帛藏於兩階之間司巫皆當守之凡喪事掌巫降之禮注降下也巫下神之禮男巫掌望祀望衍授號旁招以茅注衍讀為延聲之誤也望祀謂有牲粢盛者延進也謂但用幣致其神二者詛祝所授類造禬禜攻說之神號男巫為之招疏望祀者類造禬禜遙望而祀之望延者是攻說之禮遙望延其神旁謂四方以茅招之於四方也冬堂贈無方無算注冬堂贈嵗終以禮送不祥及惡夢皆是也其行必由堂始巫與神通言當東則東當西則西可近則近可逺則逺無常數春招弭以除疾病弭與彌同注招招福也弭讀為敉安也安凶禍也招敉皆有祀衍之禮王弔則與祝前女巫掌嵗時祓除釁浴注嵗時祓除如今三月上已如水上之類釁浴謂以香薰草藥沐浴疏三月上已者一月有三已據上旬之已旱暵則舞雩暵呼旱反注使女巫舞旱祭崇隂也故檀弓嵗旱繆公欲暴巫縣子曰天則不雨而望之愚婦人無乃已疏乎若王后弔則與祝前疏女巫當與天官女祝前后凡邦之大烖歌哭而請疏案林頓難曰魯人有日食而哭傳曰非所哭孔子哭則不歌歌哭而請道將何為𤣥謂日食異者也於民無困哭之為非董仲舒曰雩求雨之術呼嗟之歌呼嗟哭泣以成發氣若雲漢之詩孔子哭則不歌謂其哀樂無常非所以譏此禮訓案巫祝二者職事相成但祝主通內神之事居多巫通外神之事居周禮纂訓卷十三
