body:
  text: 周禮纂訓卷八安溪李鍾倫撰掌節掌守邦節而辨其用以輔王命注邦節者珍圭牙璋穀圭琬圭琰圭也王有命則别其節之用以授使者輔王命者執以行為信疏案典瑞云珍圭以徵守以恤凶荒牙璋以起軍旅以治兵守穀圭以和難以聘女琬圭以治徳以結好琰圭以易行以除慝璧羡之等則是王國所用非使者之節矣守邦國者用玉節守都鄙者用角節注謂諸侯於其國中公卿大夫王子弟於其采邑有命者亦自有節以輔之玉節之制如王為之以命數為小大角用犀用其制未聞訓愚案邦節即下文所言注謂是圭璋恐未必然守邦國用玉節守都鄙用角節亦對下文諸節用金用竹用印用符耳謂玉節之制如王更為無據未敢從也疏云有命者亦如王有命亦有節以輔之也云玉節如王為之者以諸侯國内亦有徵守好難起軍旅之等故知與王同也知以命數為小大者以其命圭之等亦依命數故也其天子玉節則自以小大為數訓此諸侯及采邑之君自行於其封内之節若出使封外則諸侯用虎節人節龍節都鄙則用管節如小行人所云是也故小行人文云達天下之六節是言通行之節也故不言玉節角節且此僅言守邦國守都鄙守者的是封内與下文使節異也然則下文僅言邦國之使節不言都鄙之使節何也蓋掌節所謂使節者乃王朝有事使於邦國之節自侯國來者其節之别亦如之則小行人所云是也王朝出使之節則使都鄙與邦國同故言邦國以見都鄙封君出使之節則邦國與都鄙異故小行人中都鄙復别用管節也然則小行人無貨賄之璽節何也蓋行人主朝聘賓客有送迎之事商賈阜貨而行布不須以送迎禮之故不見於行人也凡邦國之使節山國用虎節土國用人節澤國用龍節皆金也以英蕩輔之注使節使卿大夫聘於天子諸侯行道所執之信也土平地也山多虎平地多人澤多龍以金為節鑄象焉杜子春云蕩當為帑謂以函器盛此節或曰英蕩畫函疏使卿大夫聘於天子諸侯者大聘使卿小聘使大夫或於天子或於諸侯也云英蕩畫函其函猶是蕩而英華有畫義門闗用符節貨賄用璽節道路用旌節皆有期以反節注門闗司門司闗也貨賄主通貨賄之官謂司市也道路主治五涂之官謂鄉遂大夫也凡民逺出至于邦國邦國之民若來入由門者司門為之節由闗者司闗為之節商則司市為之節其以徵令及家徙則鄉遂大夫為之節唯時事而行不出闗不用節也變司市言貨賄者璽節主以通貨賄貨賄非必由市或資于民家焉變鄉遂言道路者容公邑及小都大都之吏皆主治五涂亦有民也符節如今宫中諸官詔符璽節今之印章旌節今使者所擁節是也凡節有法式藏於掌節疏知徵令有節者見鄉大夫云國有大故以徴節輔令則達之知徙家有節者見比長云若徙於他則為之徵節以行之云貨賄非必由市或資於民家則由門者司門與之節由闗者司闗與之節也訓凡掌節以節出内往來之人未必皆是遣胥徒親送之其反節亦不必是其人親來反蓋以節送人或是將節遞與鄉遂都鄙之吏因使其民彼此節節遞送之其來反亦然若今時為官府遞送文書亦有此法凡通達於天下者必有節以傳輔之疏有傳無節有節無傳或節傳俱無則不得達無節者有㡬則不達注圜土内之遂人掌邦之野注郊外曰野此野謂甸稍縣都疏知野是甸稍縣都者蓋此遂人不云掌遂又見下文以達于畿明兼掌三百里外其有溝洫井田法皆知之也以土地之圖經田野造縣鄙形體之灋五家為鄰五鄰為里四里為酇五酇為鄙五鄙為縣五縣為遂皆有地域溝樹之使各掌其政令刑禁以嵗時稽其人民而授之田野簡其兵器教之稼穡酇作管反注遂之軍法追胥起徒役如六鄉疏鄉遂出軍雖相如然鄉以上劑致民遂以下劑致民是其稍異也凡治野以下劑致甿以田里安甿以樂昏擾甿以土宜教甿稼穡以興耡利甿以時器勸甿以疆予任甿以土均平政甿説文田民與氓同廣韻音甍莫耕切耡音助李又音鉏疆其良反注甿猶懵懵無知貎致猶㑹也民雖受上田中田下田及㑹之以下劑為率謂可任者家二人樂昏勸其昏姻如媒氏㑹男女也擾順也時器鑄作耒耜錢鎛之屬疆予謂民有餘力復予之田若餘夫然政讀為征土均掌均平其税鄭大夫讀耡為藉杜子春讀耡為助謂起民人令相佐助疏六鄉家取一人為正卒其餘為羡卒六遂家取一人為正卒一人為羡卒外為餘夫是下劑致民田謂百畆之田里謂五畆之宅土宜者髙田種黍稷下田種稻麥辨其野之土上地中地下地以頒田里上地夫一廛田百畮萊五十畮餘夫亦如之中地夫一廛田百畮萊百畮餘夫亦如之下地夫一廛田百畮萊二百畮餘夫亦如之畮音畆萊音來注萊謂休不耕者廛城邑之居六遂之民竒受一廛雖上地猶有萊皆所以饒逺也疏云六遂竒受一廛者釋經餘夫亦如之餘夫竒别受田備後離居之法訓鄭以六鄉餘夫不别受廛又上地不復加萊據大司徒造都鄙法不易一易再易即此上中下地彼不言餘夫亦如之又無萊五十畮此法見於司徒而司徒主六鄉故以為鄉之田制如此然彼實都鄙法鄉當從遂鄭於田法軍法既以鄉遂為類矣而又以鄉與都鄙為一法何也豈一人之精文重思繁耶凡治野夫間有遂遂上有徑十夫有溝溝上有畛百夫有洫洫上有涂千夫有澮澮上有道萬夫有川川上有路以達于畿畛之忍反劉音真洫况域反澮古外反注十夫二鄰之田百夫一酇之田千夫二鄙之田萬夫四縣之田遂溝洫澮皆所以通水於川也遂廣深各二尺溝倍之洫倍溝溝廣二尋深二仞徑畛涂道路皆所以通車徒於國都也徑容牛馬畛容大車涂容乘車一軌道容二軌路容三軌萬夫者方三十三里少半里九而方一同以南畆圖之則遂從溝横洫從澮横九澮而川周其外去山陵林麓川澤溝瀆城郭宫室涂巷三分之制其餘如此以至于畿則中雖有都鄙遂人盡主其地疏鄭知溝洫深廣者約匠人井田法而言云萬夫方三十三里少半里者萬夫之田方三十三里百步百步是少半里此川與匠人川異彼是大川此川亦人造雖無丈尺蓋亦倍澮耳訓溝洫有圖在後以嵗時登其夫家之衆寡及其六畜車輦辨其老幼廢疾與其施舎者以頒職作事以令貢賦以令師田以起政役施式氏反政音征注夫家猶言男女也職謂民九職也分其農牧衡虞之職使民為其事也若起野役則令各帥其所治之民而至以遂之大旗致之其不用命者誅之注役謂師田若有功作也遂之大旗熊虎凡國祭祀共野牲令野職注供野牲入於牧人以待事也野職薪炭之屬疏野牲謂牛羊豕云野職薪炭之屬者遂人令之委人斂之凡賓客令脩野道而委積注委積於廬宿市疏令令遺人也大喪帥六遂之役而致之掌其政令及葬帥而屬六綍及窆陳役屬音燭綍音弗注致役致於司徒給墓上事及竁也綍舉棺索也葬舉棺者謂載與説時也用綍旁六執者天子其千人與陳役者主陳列之耳匠師帥監之鄉師以斧涖焉大喪之正棺殯啓朝及引六鄉役之載及窆六遂役之亦即逺相終始也鄭司農云窆謂下棺時遂人主陳役也禮記謂之封春秋謂之塴疏知六遂給墓上事及竁者以引時是六鄉役之云綍舉棺索者據在棺曰綍據在道曰引云即逺相終始者六鄉近使主殯及啓朝為始在祖廟之中将行載棺於蜃車屬六綍則六遂為終在道屬六引又六鄉為始至壙用綍下棺還使六遂為終天子執綍千人者約雜記諸侯執綍五百人而言凡事致野役而師田作野民帥而至掌其政治禁令遂師各掌其遂之政令戒禁以時登其夫家之衆寡六畜車輦辨其施舎與其可任者經牧其田野辨其可食者周知其數而任之以徵財征作役事則聴其治訟注經牧制田界與井也可食謂今年所當耕者也財征賦税之事疏任之據人民之數徴財征據田野之數役事兼軍旅田獵功作經牧制田界與井者遂人亦兼掌采地井田法故經云經牧與小司徒文同訓任之兼任地任人財謂賦征亦可兼役此云經牧與井牧不同遂人惟主溝洫經絶無兼都鄙之文其云牧者以田率皆再易故借用之耳巡其稼穡而移用其民以救其時事注移用其民使轉相助救時急事也訓時事或如旱潦之災凡國祭祀審其誓戒共其野牲疏戒遂之民入野識野賦于玉府注民所入貨賄以當九職九賦中玉府之用者疏遂師徵之以入大府分之衆府也訓野兼稍縣都言野則鄉亦入之矣賓客則巡其道脩庀其委積庀又作庇匹爾反具也劉副美反又芳米反廣韻音諀注巡其道脩行治道路也大喪使帥其屬以幄帟先道野役及窆抱磨共丘籠及蜃車之役磨劉音歴籠力董反蜃市軫反注使以幄帟先者太宰也其餘司徒也幄帟先所以為葬窆之間先張神坐也道野役帥以至墓也丘籠之役竁復土也其器曰籠蜃車柩路也柩路載栁四輪迫地而行有似于蜃因取名焉行至壙乃説更復載以龍輴役謂執綍者鄭司農云抱磨磨下車也𤣥謂磨者適歴執綍者名也遂人主陳之而遂師以名行校之疏知使以幄帟先是太宰者以幕人屬太宰云其餘司徒者司徒主衆庶故知野役之徒司徒令之云竁復土者竁謂穿地復土謂反土為丘壟云適歴執綍者名也者分布稀疎名為適歴軍旅田獵平野民掌其禁令比敘其事而賞罰注平謂正其行列部伍也訓其事如旗鼓兵器之屬遂大夫各掌其遂之政令以嵗時稽其夫家之衆寡六畜田野辨其可任者與其可施舎者以教稼穡以稽功事掌其政令戒禁聽其治訟施鄭讀亦為弛注功事九職之事令為邑者嵗終則㑹政致事注不言其遂之吏而言為邑者容公邑及卿大夫王子弟之采邑政令戒禁遂大夫亦施焉正嵗簡稼器脩稼政注簡猶閱也稼器耒耜鎡基之屬稼政孟春之月令所云皆脩封疆審端經術善相丘陵阪險原隰土地所宜五穀所殖以教道民必躬親之三嵗大比則帥其吏而興甿明其有功者屬其地治者注興甿舉民賢者能者如六鄉之為也屬猶聚也又因舉吏治有功者而聚勑其餘以職事凡為邑者以四達戒其功事而誅賞廢興之注四達者治民之事大通者有四夫家衆寡也六畜車輦也稼穡耕耨也旗鼓兵革也縣正各掌其縣之政令徴比以頒田里以分職事掌其治訟趨其稼事而賞罰之趨如字本又作趣音促注徵召也比案也疏頒田里夫一廛田百畆是也職事九職之事若将用野民師田行役移執事則帥而至治其政令注移執事移用其民轉相佐助既役則稽功㑹事而誅賞鄙師各掌其鄙之政令祭祀注祭祀祭禜也疏六鄉黨祭禜鄙與黨同凡作民則掌其戒令注作民謂起役也以時數其衆庶而察其媺惡而誅賞嵗終則㑹其鄙之政而致事酇長各掌其酇之政令以時挍登其夫家比其衆寡以治其喪紀祭祀之事注挍猶數也疏喪紀謂民之喪紀祭祀若族祭酺之類若然縣當祭社與州同鄉遂互見為義也若作其民而用之則以旗鼓兵革帥而至若嵗時簡器與有司數之注簡器簡稼器也兵器亦存焉有司遂大夫凡嵗時之戒令皆聽之趨其耕耨稽其女功注聽之受而行之者里宰掌比其邑之衆寡與其六畜兵器治其政令注邑猶里也以嵗時合耦于鋤以治稼穡趨其耕耨行其秩敘以待有司之政令而徵斂其財賦注考工記曰耜廣五寸二耜為耦兩人相助耦而耕也鄭司農云耡讀為藉杜子春云耡讀為助謂相佐助也𤣥謂耡者里宰治處也於此合耦使相佐助因放而為名季冬月令命農計耦耕事脩耒耜其田器是其嵗時與秩敘受耦相佐助之次第疏有司徵斂謂縣師旅師也古時皆用人耦未有牛耦耕至漢搜粟都尉趙過始教民牛耕乃絶人耦鄰長掌相糾相受疏鄰長不命之士相受者宅舎有故使五家相容受凡邑中之政相贊注長短使相補助疏一里之内有上政令徵求五鄰共相贊助徙于他邑則從而授之注授猶付也旅師掌聚野之耡粟屋粟閒粟閒音開注野謂逺郊之外耡粟民相助作一井之中所出九夫之税粟也屋粟民有田不耕所罰三夫之税粟閒粟閒民無職事者所出一夫之征粟訓耡粟田賦屋粟曠土之税閒粟游民之税閒粟蓋閭師夫布是也粟布可通三農貢九穀或在耡粟之内其藪澤園圃工商嬪婦臣妾各以職為貢非粟布者見委人注而用之以質劑致民平頒其興積施其惠散其利而均其政令積子賜反注而讀為若聲之誤也若用之謂恤民之艱阨委積於野如遺人於鄉里也若質劑致民案入税者名㑹而貸之興積所興之積謂三者之粟也平頒之不得偏頗有多少縣官徵聚物曰興是粟縣師徵之旅師斂之而用之以賙衣食曰惠以作事業曰利均其政令者皆以國服為之息疏云賙衣食曰惠作事業曰利者衣食不生利故云惠作事業後即有利故云利訓下文凡新民之治皆聽之使無征役則是旅師雖掌聚斂亦均政役均其政令蓋是耶凡用粟春頒而秋斂之注困時施之饒時収之凡新甿之治皆聽之使無征役以地之媺惡為之等注新甿新徙來者也治謂有所求乞使無征役復之也王制曰自諸侯來徙家期不從政以地媺惡為之等七人以上授以上地六口授以中地五口以下授以下地與舊民同旅師掌斂地税而又惠施散利是以屬用新甿焉訓新甿之治蓋分田里制疆界之事以地媺惡為之等免其征役亦有差等地媺者復少年惡者復多年也復之年數蓋不易者一年一易者二年再易者三年稍人掌令丘乘之政令注丘乘四丘為甸甸讀與維禹敶之之敶同其訓曰乘由是改云若有㑹同師田行役之事則以縣師之灋作其同徒輂輦帥而以至治其政令以聽於司馬注有軍旅㑹同田役之戒縣師受法於司馬邦國都鄙稍甸郊里唯司馬所調以其法作其衆庶及馬牛車輦㑹其車人之卒伍使皆備旗鼓兵器以帥而至是以書令之耳同徒司馬所調之同凡用役者不必一時皆徧以人數調之使勞逸遞焉疏云凡用役不必一時已下釋同徒是同其勞逸也大喪帥蜃車與其役以至掌其政令以聽於司徒注蜃車及役遂人共之稍人者野監是以帥而致之既夕禮曰既正柩賓出遂匠納車於階間則天子以至於士柩路皆從遂來疏此經上舉天子既夕下舉士則其中諸侯卿大夫蜃車柩路皆從遂人而來訓稍人掌都鄙但言丘乘者出兵以丘乘為法也委人掌斂野之賦斂薪芻凡疏材木材凡畜聚之物斂力豔反畜勑六反注所斂野之賦謂野之園圃山澤之賦也疏材草木有實者也畜聚之物瓜瓠葵芋禦冬之具也野之農賦旅師斂之工商嬪婦遂師以入玉府其牧則遂師又以供野牲訓此蓋臣妾所貢者太宰職曰臣妾聚斂疎材以稍聚待賓客以甸聚待覉旅注聚凡畜聚之物也凡其余聚以待頒賜注余當為餘謂縣都畜聚之物以式灋共祭祀之薪蒸木材賓客共其芻薪喪紀共其薪蒸木材軍旅共其委積薪芻凡疎材共野委兵器與其野囿財用注式灋故事之多少也薪蒸給炊及燎麤者曰薪細者曰蒸木材給張事委積薪芻者委積之薪芻也軍旅又有疏材以助禾粟野委謂廬宿止之薪芻也兵器謂守衛陳兵之器野囿財用者苑囿藩蘿之材疏云木材給張事者案掌次云張大次小次并須木材云委積之薪芻者委積之中有牲牢米禾薪芻之等委人唯供薪芻也軍旅有疏材以助禾粟者疏材是百草根實可共馬牛助禾粟兵器承野委之下明同為賓客所用故知是守衛賓客陳兵之器也凡軍旅之賓客館焉注館舎也必舎此者就牛馬之用疏軍旅之賓客謂諸侯以兵助王征討者土均掌平土地之政以均地守以均地事以均地貢政音征注所平之税邦國都鄙也地守虞衡之屬地事農圃之職地貢諸侯九貢以和邦國都鄙之政令刑禁與其施舎禮俗喪紀祭祀皆以地媺惡為輕重之灋而行之掌其禁令注禮俗邦國都鄙民之所行先王舊禮也隨其土地厚薄為之制豐省之節訓和猶均也草人掌土化之灋以物地相其宜而為之種相息亮反種章勇反注土化之灋化之使媺以物地占其形色為之種黄白宜以種禾之屬凡糞種騂剛用牛赤緹用羊墳壤用麋渴澤用鹿鹹潟用貆勃壤用狐植壚用豕疆㯺用蕡輕爂用犬潟音昔一音鵲貆音暄又九歡二音埴音寔常職切壚音盧廣韻落胡切一音閭疆其兩反㯺本又作檻呼覽反劉音檻蕡扶云反爂孚照反玉篇匹姚切㶾同今亦作票廣韻音影撫招切注凡所以糞種皆謂煮取汁也騂剛地色赤而土剛強赤緹縓色也壤白色墳壤潤解渇澤故水處也潟鹵也貆貒也勃壤粉解者埴壚黏疏者疆㯺強堅者蕡麻也輕爂輕脆者稻人掌稼下地注以水澤之地種穀也謂之稼者有似嫁女相生以瀦畜水以防止水以溝蕩水以遂均水以列舎水以澮寫水以涉揚其芟作田寫戚如字劉殤故反芟所銜反注杜子春讀蕩為和蕩謂以溝行水也𤣥謂瀦者畜流水之波也防瀦旁隄也遂田首受水小溝也列田之畦㽟也澮田尾去水大溝作猶治也開遂舎水於列中因涉之揚去前年所芟之草而治田種稻凡稼澤夏以水殄草而芟夷之注将以澤地為稼者必於夏六月之時大雨時行以水病絶草之後生者至秋水涸芟之明年乃稼澤草所生種之芒種注鄭司農云澤草之所生其地可種芒種芒種稻麥也旱暵共其雩斂注稻人共雩斂稻急水者也鄭司農云雩事所發斂喪紀共其葦事注葦以闉壙禦濕之事土訓掌道地圖以詔地事注道説也道地圖九州形勢山川所宜告王以施其事若云荆揚宜稻幽并宜麻道地慝以辨地物而原其生以詔地求慝他得反注地慝若瘴蠱然也辨其物者别其所有所無原其生生有時也以此二者告王之求也地所無及物未生則不求也王巡守則夾王車誦訓掌道方志以詔觀事注説四方所識乆逺之事以詔王觀博古所識若魯有大庭之庫殽之二陵疏方志四方所記乆逺之事掌道方慝以詔辟忌以知地俗辟音避注方慝四方言語所惡也不辟其忌則其方以為苟於言語也王巡守則夾王車山虞掌山林之政令物為之厲而為之守禁注物為之厲毎物有藩界也為之守禁為守者設禁令也守者謂其地之民占伐林木者也鄭司農云厲遮列守之疏山林是山内之林下林衡所掌是竹木生平地者山内林木金玉錫石禽獸所有不同毎物各有藩界設禁仲冬斬陽木仲夏斬隂木注陽木生山南者隂木生山北者冬斬陽夏斬隂堅濡調凡服耜斬季材以時入之注季猶穉也服與耜宜用穉材尚柔忍也服牝服車之材疏時即仲冬仲夏之時令萬民時斬材有期日注時斬材斬材之時也有期日入出有日數為乆盡物訓此時蓋亦謂冬夏王制草木零落然後入山林當是夏殷之法凡邦工入山林而掄材不禁掄魯門反又音倫注掄猶擇也不禁者山林國之有不拘日也春秋之斬木不入禁注非冬夏之時不得入所禁之中斬木也斬四野之木可凡竊木者有刑罰若祭山林則為主而脩除且蹕注為主主辨䕶之也脩除治道路場壇疏辨䕶謂共時用相禮儀若大田獵則萊山田之野及弊田植虞旗于中致禽而珥焉植時力反又音值珥按易氏引劉中義云珥當為弭字之誤注萊除其草萊也弊田田者止也田上樹旗令獲者皆致其禽而校其耳以知獲數也山虞有旗以其主山得畫熊虎其􅌇數則短也鄭司農云珥者取禽左耳以效功也大司馬職云獲者取左耳疏植旗者使民得禽者望見之而致禽焉云除其草萊者謂於防南教戰之處芟去草萊南北二百五十步東西步數雖未聞廣狹當容六軍也案司常云師都建旗山虞是士以其主山山多熊虎故亦有旗禮緯旌旗之杠天子九仞諸侯七仞大夫五仞士三仞今山虞雖有旗仞數則短宜三仞林衡掌巡林麓之禁令而平其守麓音鹿注平其守者平其地之民守林麓之部分疏山足曰麓雖連於山山虞不掌以時計林麓而賞罰之注計林麓者計其守之功也林麓蕃茂民不竊盜則有賞不則罰之若斬木材則受灋于山虞而掌其政令注法萬民入出時日之期疏仲冬仲夏及春秋是時之期令萬民斬材有期日是日之期川衡掌巡川澤之禁令而平其守以時舎其守犯禁者執而誅罰之注舎其守者時案視守者於其舎申戒之疏澤與川相連則川衡兼掌之若濟水溢為滎滎濟連是也訓舎讀如施舎之舎以時舎其守謂以時開禁使萬民得取之祭祀賓客共川奠注川奠籩豆之實魚繡蜃蛤之屬澤虞掌國澤之政令為之厲禁使其地之人守其財物以時入之于玉府頒其餘于萬民注以時入之于玉府謂皮角珠貝也入之以當邦賦然後得取其餘以自為也入出亦有時日之期疏山虞川衡亦入玉府此是互見為義凡祭祀賓客共澤物之奠注澤物之奠亦籩豆之實芹茆蔆芡之屬喪紀共其葦蒲之事注葦以闉壙蒲以為席疏為席謂抗席若大田獵則萊澤野及弊田植虞旌以屬禽注澤虞主澤澤鳥所集故得注析羽疏屬禽謂百姓致禽訖虞人屬聚之别其類毎禽取三十焉山虞云致禽與此互見為義迹人掌邦田之地政為之厲禁而守之注田之地若今苑也凡田獵者受令焉注令謂時與處也禁麛卵者與其毒矢射者麛音迷卵力管反注麛麋鹿子卝人掌金玉錫石之地而為之厲禁以守之卝革猛反又虢猛反注錫鈏也若以時取之則物其地圖而授之注物地占其形色巡其禁令角人掌以時徵齒角凡骨物於山澤之農以當邦賦之政令疏自此以上不言以當邦賦者皆文不具以度量受之以共財用羽人掌以時徵羽翮之政于山澤之農以當邦賦之政令注翮羽本凡受羽十羽為審百羽為摶十摶為縳摶劉徒端反音團廣韻引周禮百羽為摶又有註上同亦作縳音篆持兗切玉篇縳直轉切引爾雅十羽謂之縳與同本文縳字劉音衮古本切廣韻百羽為摶十摶為緷以音證字則縳字當為緷字傳冩之訛緷音渾掌葛掌以時徵絺綌之材于山農凡葛征徵草貢之材于澤農以當邦賦之政令以權度受之訓受之謂官以權度受此物之入掌染草掌以春秋斂染草之物注染草茅蒐槖蘆豕首紫茢之屬疏茅蒐今之蒨也可以染絳槖蘆豕首未審可染何色紫茢可以染紫以權量受之以待時而頒之注時染夏之時疏天官染人秋染夏夏謂五色掌炭掌灰物炭物之徵令以時入之注灰炭皆山澤之農所出灰給澣練炭之所共甚多以權量受之以共邦之用凡炭灰之事掌荼掌以時聚荼以共喪事注共喪事者以著物也既夕禮曰茵著用荼疏案既夕禮為茵之法用淺黒布各一幅合縫著以荼未入壙時先陳於棺下乃下棺茵上徵野疏材之物以待邦事凡畜聚之物注徵者徵於山澤入於委人掌蜃掌斂互物蜃物以共闉壙之蜃注互物蚌蛤之屬闉猶塞也将井椁先塞下以蜃禦濕也春秋傳曰始用蜃炭言僭天子也祭祀共蜃器之蜃注飾祭器之屬也鬯人職曰凡四方山川用蜃器春秋定十四年秋天王使石尚來歸蜃蜃之器以蜃飾因名焉鄭司農云蜃可以白器令色白疏此經蜃器鄭總云祭器則宗廟社稷之器皆用蜃飾之故大行人云歸蜃以交諸侯之福是廟社皆用蜃飾器也共白盛之蜃注盛猶成也謂飾牆使白之蜃也囿人掌囿游之獸禁注囿游囿之離宫小苑觀處也疏囿游守門則是墨者故閽人云王宫毎門四人囿游亦如之牧百獸祭祀喪紀賓客共其生獸死獸之物訓獸人所獻者田獵之獸此是囿中所養之獸場人掌國之場圃而樹之果蓏珍異之物以時斂而藏之凡祭祀賓客共其果蓏享亦如之注享納牲疏此謂祭宗廟二灌後君迎牲后夫人薦朝事之豆籩中有果蓏之物故云享亦如之若然上言祭祀餘祭祀也訓既言祭祀賓客又言享蓋享耆老孤子與廩人掌九穀之數以待國之匪頒賙賜稍食注匪讀為分分頒謂委人之職諸委積也賙賜謂王所賜予給好用之式也稍食禄廩訓匪頒即百官之禄也稍食即百工之食也若專言稍食則亦可兼匪頒經中多有之賙賜即遺人所云是也好用蓋出於幣餘非此給也九賦九貢之入貨賄藏於内府珍玩藏於玉府泉布藏於外府米粟藏於廩人以嵗之上下數邦用以知足否以詔國用以治年之凶豐注數猶計也疏廩人以所得税物多少之帳計國用足否此則王制云制國用必於嵗之杪是也凡萬民之食食者人四鬴上也人三鬴中也人二鬴下也鬴音父扶雨反注此皆謂一月食米也六斗四升曰鬴疏食者謂民食國家糧食者訓此蓋庶人在官者與若食不能人二鬴則令邦移民就穀詔王殺邦用殺所界反注就穀就都鄙之有者凡邦有㑹同師役之事則治其糧與其食注行道曰糧糒也止居曰食米也大祭祀則共其接盛注接讀為一扱再祭之扱扱以授舂人舂之大祭祀之穀藉田之収藏於神倉者也不以給小用疏廩人兼掌御廩藉田之収舎人掌平宫中之政分其財守以灋掌其出入注政謂用穀之政分其財守者計其用穀之數分送宫正内宰使守而頒之也凡祭祀共簠簋實之陳之注方曰簠圓曰簋盛黍稷稻粱器疏言凡祭祀則天地宗廟大小祭祀皆有簠簋簠盛稻粱簋盛黍稷但外神用瓦簋宗廟當用木簠簋皆受斗二升賓客亦如之共其禮車米筥米芻禾筥姜吕反又音吕注禮致饔餼之禮喪紀共飯米熬穀飯扶晚反熬五羔反注飯所以實口君用粱大夫用稷士用粱皆四升熬穀錯于棺旁所以惑蚍蜉喪大記曰熬君四種八筐大夫三種六筐士二種四筐加魚腊焉疏知君飯用粱大夫用稷士用粱者據喪大記沐時所用但飯米沐米與重鬲所盛米皆同以嵗時縣穜稑之種以共王后之春獻種縣音𤣥注縣之者欲其風氣燥達也春王當耕于藉后則獻其種掌米粟之出入辨其物注九穀六米别為書疏九穀黍稷稻粱苽大豆六者皆有米麻小豆小麥三者無米故云九穀六米嵗終則㑹計其政注政用穀之多少倉人掌粟入之藏注九穀盡藏焉以粟為主疏粟是五穀之長謂稷辨九穀之物以待邦用若穀不足則止餘灋用有餘則藏之以待凶而頒之注止猶殺也殺餘法用謂道路之委積所以豐優賓客之屬訓餘恐殺字之誤止殺法用謂國家用穀或大事殺或小事止蓋法用不當但取委積一事且遺人所掌若老孤囏阨之屬在常時猶賙之况凶年乎凡國之大事共道路之穀積食飲之具注大事謂喪戎訓委積猶言委而積之也穀有餘則藏之也司禄闕司稼掌巡邦野之稼而辨穜稑之種周知其名與其所宜地以為灋而縣于邑閭巡野觀稼以年之上下出斂灋注斂法者豐年從正凶荒則損若今十傷二三實除減半疏云十傷二三實除減半者十傷二三餘有七八就七八為實在仍減半不税於半内税之掌均萬民之食而賙其急而平其興注均謂度其多少興所徵賦疏均減取多者給其困者舂人掌共米物祭祀共其齍盛之米疏器實曰齍黍稷稻粱麥苽是也在器曰盛簠簋是也賓客共其牢禮之米注謂可以實筐筥疏下别言饗食則此牢禮謂饔餼之米云實筐筥知非車米者車米多蓋出於民税若禹貢所云五百里米是也凡饗食共其食米注饗有食米則饗禮兼燕與食疏燕禮無食米食禮無飲酒饗禮兼有米酒掌凡米事􅐪人掌凡祭祀共盛注炊而共之共王及后之六食注六食六穀之飯凡賓客共其簠簋之實注謂致飱饔疏知是飱饔者以下云饗食亦如之饗食亦如之稾人掌共外内朝宂者之食宂玉篇如勇切廣韻而隴切注外朝司冦斷獄弊訟之朝内朝路門外之朝疏天子三朝路寢庭朝圖宗人嘉事太僕掌之路門外朝是常朝司士掌之外朝在臯門内庫門外朝士掌之宂散也散吏上直不歸家食稾人共之若饗耆老孤子士庶子共其食注士庶子卿大夫子弟宿衛王宫者疏春享孤子秋食耆老及士庶子掌豢祭祀之犬訓不言何神則凡祭皆用犬矣周禮纂訓卷八
