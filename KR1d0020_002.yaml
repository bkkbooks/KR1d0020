body:
  text: 周禮纂訓卷二安溪李鍾倫撰小宰之職掌建邦之宫刑以治王宫之政令凡宫之糾禁注宫刑在王宫中者之刑掌邦之六典八法八則之二以逆邦國都鄙官府之治執邦之九貢九賦九式之二以均財節邦用注逆迎受之鄭司農云二副也疏逆謂迎受勾考之使知功過所在也訓邦國都鄙官府之治有能否小宰考察之以告冢宰冢宰以詔王廢置均財者均其所入謂貢賦有恆經節用者節其所出謂式法有定制小宰稽其籍以詔冢宰量入為出制國用以官府之六敘正羣吏一曰以敘正其位二曰以敘進其治三曰以敘作其事四曰以敘制其食五曰以敘受其會六曰以敘聽其情注敘秩次也謂先尊後卑也治功狀也食祿之多少情爭訟之辭訓此六敘家君子謂即八法中官常是也以其官之尊卑秩次有常是之謂官常進如呼昭穆而進之之進進其治者進而授之以所治之職謂施法于官府之時六者皆先尊後卑所謂序也次位列者於朝頒治職者亦當於朝類也事以服勤食以報功類也會定功罪情弊曲直亦類也以官府之六屬舉邦治一曰天官其屬六十掌邦治大事則從其長小事則専達二曰地官其屬六十掌邦教大事則從其長小事則専達三曰春官其屬六十掌邦禮大事則從其長小事則専達四曰夏官其屬六十掌邦政大事則從其長小事則専達五曰秋官其屬六十掌邦刑大事則從其長小事則専達六曰冬官其屬六十掌邦事大事則從其長小事則専達注大事從其長若庖人內外饔與膳夫共王之食小事専達若宮人掌舍各為一官達千云達決也訓從謂共其使令聽其教戒官各有長總言之治官以太宰為長又分之食官以膳夫為長推此類可見以官府之六職辨邦治一曰治職以平邦國以均萬民以節財用二曰教職以安邦國以寧萬民以懷賓客三曰禮職以和邦國以諧萬民以事鬼神四曰政職以服邦國以正萬民以聚百物五曰刑職以詰邦國以糾萬民以除盜賊六曰事職以富邦國以養萬民以生百物注懷亦安也賓客來共其委積所以安之聚百物者司馬主九畿職方制其貢各以其所有訓司空主興事任力使土不曠民不遊則百物以生典王者所操職當官所掌故典言官府而職不言官府以其皆官府之事也平邦國謂執典法則以權衡中外均萬民謂均其賦貢其餘言邦國萬民雖文異而義同政典言均萬民而政職言正萬民均猶齊也正猶整也整齊一也節財用懷賓客以下典不言而職言之者典舉其義故其文括職主其辨故其事詳以官府之六聨合邦治一曰祭祀之聨事二曰賓客之聨事三曰喪荒之聨事四曰軍旅之聨事五曰田役之聨事六曰斂弛之聨事凡小事皆有聨弛尸氏反劉本作施音弛杜作施注鄭司農云大祭祀太宰贊玉幣司徒奉牛牲宗伯視滌濯涖玉鬯省牲鑊奉玉齍司馬羞魚牲奉馬牲司冦奉明水火大喪太宰贊贈玉含玉司徒帥六鄉之衆庶屬其六紖宗伯為上相司馬平士大夫司冦前王此所謂官聨杜子春弛讀為施玄謂荒政弛力役及國中貴者賢者服公事者老者疾者皆舍不以力役之事奉牲者其司空奉豕與疏大祭祀唯太宰尊不奉牲宗伯不言奉雞司馬直言奉馬不兼言奉羊司冦不言奉犬皆略不言可知以官府之八成經邦治一曰聽政役以比居二曰聽師田以簡稽三曰聽閭里以版圖四曰聽稱責以傅别五曰聽祿位以禮命六曰聽取豫以書契七曰聽賣買以質劑八曰聽出入以要會政鄭音征司農如字比毗志反注同稱昌證切傅音附别彼列反會古外反凡要會會計之字皆放此注鄭司農云政謂軍政役謂發兵起徒役比居謂伍籍簡閲也稽計也計其士之卒伍閲其兵器為之要簿也版户籍圖地圖聽人訟地以版圖決之稱責謂貸子傅别謂券書傅傅著約束於文書别别為兩兩家各得一也禮命謂九賜也書契符書也質劑謂市中平賈若今時月平要會謂計最之簿書玄謂政謂賦也其字或作正或作征傅别謂為大手書於一札中字别之書契謂出豫入受之凡要凡簿書之最目獄訟之要辭皆曰契質劑謂兩書一札同而别之長曰質短曰劑禮命禮之九命之差等疏稱責謂舉責生子即泉府職以國服為之息聽祿位以禮命者有人爭祿之多少位之前後則以禮命文書聽之取豫謂於官直貸不出子者出入是官內自用物有人爭此官物者則以要會簿書聽之傅别謂於券背上大作一手書中央破之為二段别之質劑前後作一劵中央破之兩家各得其一皆無手書字異於傅别訓聽謂聽其治或有獄訟則亦聽之聽祿位以禮命謂興賢能之時萬民中有德行道藝者進而禮命之若欲授祿制爵則以禮命之書考之家茂夫叔父謂取豫者嵗時之施惠在官為豫在民為取必以書契者防冒濫也出入者泉府之斂賒泉府所出廛人所入皆有要會相參考也泉府之貸於民有二有賒而不取息者有貸而取息者此泉府所出謂無息者與稱責異也以聽官府之六計弊羣吏之治一曰廉善二曰廉能三曰廉敬四曰廉正五曰廉法六曰亷辨注聽平治也平治官府之計有六事弊斷也既斷以六事又以廉為本善善其事有辭譽也能政令行也敬不解于位也正行無傾邪也法守法不失也辨辨然不疑惑也疏六者不同既以廉為本又計其功過多少而聽斷之故云六計弊羣吏之治也訓仁心為質之謂善材力可任之謂能畏威勤事之謂敬剛直不撓之謂正遵守成式之謂法審察精詳之謂辨敬與正皆善之類也法與辨亦能之屬也以法掌祭祀朝覲會同賓客之戒具軍旅田役喪荒亦如之七事者令百官府共其財用治其施舍聽其治訟共音恭注法謂其禮法也戒具戒官有事者所當共施舍不給役者疏七者皆是上六聨百官聨事通職者以其衆官共故云令百官府共其財用也訓共其財用治其施舍即六聨中斂弛之事此一節注疏以為八法中官法之事凡祭祀贊王幣爵之事祼將之事祼古亂反注又從太宰助王也將送也祼送送祼謂贊王酌鬱鬯以獻尸凡鬱鬯受祭之啐之奠之疏上太宰不言贊祼將則太宰不贊之故注直云小宰贊王酌鬱鬯也凡賓客贊祼凡受爵之事凡受幣之事注唯祼助宗伯其餘皆助太宰王不酌賓客而有受酢疏云其餘者謂受爵幣二者賓客酢王之時太宰於賓處受而授王王飲訖太宰受爵以授小宰受幣之時王親受受以授太宰太宰以授小宰也喪荒受其含襚幣玉之事襚音遂注凶荒有幣玉者賓客所賙委之禮疏喪謂王喪諸侯諸臣得致含襚幣玉上太宰不言是小宰専受之賙委謂諸侯賙委王家法也月終則以官府之敘受羣吏之要注主每月之小計疏月計曰要使官府致其簿書之要受之當先尊後卑也云小計對嵗會為大計也若大計則冢宰平之贊冢宰受嵗會嵗終則羣吏致事注使齎嵗盡文書來至若今上計正嵗帥治官之屬而觀治象之法徇以木鐸曰不用法者國有常刑徇音旬從徇非注正嵗謂夏之正月得四時之正以出教令者審也古者將有新令必奮木鐸以警衆以明聽也木鐸木舌也文事奮木鐸武事奮金鐸疏木鐸以木為舌金鐸以金為舌訓此治屬之官刑也乃退以宫刑憲禁于王宫注憲謂表縣之疏凡刑禁皆出秋官小宰得秋官刑禁文書表而縣之於宮內也訓此宮中之宮刑也以其王宮故但表縣之令于百官府曰各修乃職考乃法待乃事以聽王命其有不共則國有大刑訓當官所守謂之職國家所定謂之法此統六屬之官刑也此一節家君子以為八法中官刑之事小宰職二冢宰以贊王考核之事稽察之政而其職獨詳於治官府是故首言王宮之治其中掌宫正內宰所以弼王也次言典法則式賦貢之二其中掌司會大府所以佐冢宰也故為先六敘以下次列八法皆治官府之事官屬畢備則人足以任官也官職各辨則人各有専責也職事相聨則一屬一職之人所不能治者合之他屬他職以治之也此三者皆治人也官成者有已成之律令官計者有一定之功罪官法者有相循之禮儀比三者皆治法也一月之計小宰受之一嵗之會冢宰決之而小宰贊焉示之以法威之以刑此所以佐冢宰亮天工而熙庶職也或曰小宰陳列八法其序異於冢宰何也曰冢宰之治官府義主於邦治者也小宰之治官府義止於官府者也主於邦治則以設官分職為大主於官府則以序次尊卑為體故其序不同也官法之後於官計何也曰計所以考定功罪官成以上皆所當計也法也者先時以令于百姓當其事則訓其法百官廢法則有常刑不待稽察功過之日而始斷之故離而後之也終之以官刑何也曰經文凡有數可紀者皆在於前官刑無數可紀且其辭曰修乃職考乃法待乃事是不過取上文諸法而申警之亦如冢宰先次六典以至九兩正月以下則所以頒施前法者此周官立言之例也宰夫之職掌治朝之法以正王及三公九卿大夫羣吏之位掌其禁令注治朝在路門之外其位司士掌焉宰夫察其不如儀訓此所謂以敘正其位敘羣吏之治以待賓客之令諸臣之復萬民之逆注恆次敘諸吏之職事三者之來則應使辨理之復之言報也反也反報於王謂於朝廷奏事自下而上曰逆逆謂上書疏宰夫次敘羣吏諸臣等之治職即以待賓客以下三事賓客之令謂若大宗伯朝覲會同則為上相肆師大朝覲佐儐之屬諸臣之復謂若夏官小臣職云掌三公及孤卿之復逆太僕職云掌諸侯之復逆此諸臣中兼之萬民之逆謂御僕職掌羣吏庶民之復逆彼羣吏為府史以下與此羣吏别宰夫恆次敘諸官使辨理其事訓諸臣言復萬民言逆互文也賓客之令以下三者非宰夫親掌之次敘當職之官使掌之也此亦以敘作其事之類為其為治朝之法故遂言之掌百官府之徵令辨其八職一曰正掌官法以治要二曰師掌官成以治凡三曰司掌官法以治目四曰旅掌官常以治數五曰府掌官契以治藏六曰史掌官書以贊治七曰胥掌官敘以治敘八曰徒掌官令以徵令藏才浪反注治藏同注别異諸官之八職以備王之徵召所為正辟於治官則冢宰也治要若嵗計也師辟小宰宰夫也治凡若月計也司辟上士中士治目若今日計也旅辟下士也治數每事多少異也治藏藏文書及器物贊治若今起文書草也治敘次序官中如今侍曹伍伯傳吏朝也徵令趨走給召呼疏治敘涎序官中者謂官中須人驅役之處則次序其徒也云伍伯傳吏朝者漢時五人為伍伯長也傳吏朝者傳在朝羣吏諸官事務於朝胥為什長亦然舉漢法況之也訓此所謂以敘進其治正者卿長官法如治官有治象之法教官有教象之法是也六官之法皆六官之長主之官成謂官府之治績成效掌之者受而句考之也治目之官法如膳夫酒正之屬彼亦自為一官之長所掌者膳羞及酒漿之法度而不必親掌其物故曰法也推類可見旅曰官常者衆士官卑人執其職職分有常是曰官常要者事之綱領凡者事之撮括目者事之科條數者不一其事列而可數也八職之事尊者職要卑者職詳宰夫辨之以待王使令也辟音譬本亦作譬傳直専反掌治法以考百官府羣都縣鄙之治乘其財用之出入凡失財用物辟名者以官刑詔冢宰而誅之其足用長財善物者賞之辟徐芳石反劉芳益反于云不當也注羣都諸采邑也六遂五百家為鄙五鄙為縣言縣鄙而六鄉州黨亦存焉乘猶計也財泉穀也用貨賄也物畜獸也辟名詐為書以空作見文書與實不相應也疏宰夫是句考之官故以治法考百官府及羣都縣鄙鄉遂之內治功善惡也訓此一節佐小宰二典法則式賦貢之事小宰掌逆邦國都鄙官府之治宰夫卑故不及邦國治法亦謂典法則也財用入出亦謂式賦貢也乘其財用之其亦指官府縣都也以式法掌祭祀之戒具與其薦羞從大宰而視滌濯凡禮事贊小宰比官府之具注薦脯醢也羞庶羞內羞疏按儀禮諸單言薦者皆是脯醢故知薦脯醢也庶羞謂天子八豆諸侯六豆之等內羞謂祭祀食後所加少牢所謂房中之羞糗餌粉餈是也訓式法亦謂小宰官法也凡朝覲會同賓客以牢禮之法掌其牢禮委積膳獻飲食賓賜之飱牽與其陳數委於偽反積子賜反後二字相連皆同此音飲於鴆反食音嗣飱音孫注牢禮之法多少之差及其時也三牲牛羊豕具為一牢委積為牢米薪芻給賓客道用也膳獻禽羞俶獻也飲食燕饗也鄭司農云飱夕食也牽牲牢可牽而行者玄謂飱客始至所致禮凡此禮陳數存可見者唯有行人掌客及聘禮公食大夫疏掌其牢禮下别言委積之等則此牢禮謂饔餼之禮委積是賓未至時在道所設饔餼是朝日致之今在委積上者惟饔餼是禮之大者且委積非特賓來時共之賓去亦共之在下亦宜云膳獻禽羞俶獻者禽羞謂成熟有齊和者俶獻四時珍美新物也云飲食燕饗不解食為食禮者經中言食則食禮自明今云飲食燕饗止有飲入燕禮饗中又兼飲與食以其饗有米有酒也司農以飱為夕食解之按聘禮客始至大夫帥至于館宰夫朝服設飱但客至即設不要待夕故後鄭不從之也訓掌牢禮委積之等者供其物也掌其陳數者辨其多少隆殺凡皆牢禮之設所具委積在道所供飱牽始至所供饔餼膳獻飲食至後所供飱牽次在後者家茂夫叔父曰賓之飱牽所以待賓賜之飱牽以待羣介行人宰史然則飱牽中包待諸侯臣禮故在後也凡邦之弔事掌其戒令與其幣器財用凡所共者注弔事弔諸侯諸臣幣所用賻也器所致明器也凡喪始死弔而含襚葬而賵贈其間加恩厚則有􅉠焉疏弔謂王使人弔諸侯自弔諸臣從王行者並有贈喪之具百官當共即是凡所共者大喪小喪掌小官之戒令帥執事而治之注大喪王后世子小喪夫人以下小官士也其大官則冢宰掌其戒令治謂共辨訓鄭氏所以釋大喪為后世子小喪為夫人以下者蓋對下文三公六卿之喪及諸大夫之喪是外喪則此大喪小喪是內喪矣然大喪中亦兼王喪言執事者宫中之喪掌事者亦有內豎女御及內外宗之屬男女不等且客有無爵者故不可言官有司也三公六卿之喪與職喪帥官有司而治之凡諸大夫之喪使其旅帥有司而治之注旅冢宰下士訓此一節贊小宰治官法之事七事中闕師役凶荒者宰夫所職稽察朝儀居多師役凶荒是外禮故也歲終則令羣吏正嵗會月終則令正月要旬終則令正日成而以考其治治不以時舉者以告而誅之注嵗終自周季冬正猶定也治不時舉者謂違時令失期會疏治不時舉謂文書稽滯者訓上冢宰掌嵗會小宰掌月要則日成當宰夫自掌之此羣吏亦非止治官之屬正嵗則以法警戒羣吏令修宫中之職事書其能者與其良者而以告于上注良猶善也上謂小宰太宰也疏上云令修宫中之職事則此謂宫中諸吏也正嵗之正月則豫選之擬至嵗終當舉之也訓宰夫者佐小宰句考之官所職亦與小宰相侔但其治差狹小宰主治官府故凡官府之法無不關小宰者宰夫則於其中稽察朝儀校核功過而已故首言治朝之法次辨八職之治皆所以肅班行次尊卑而使之居其所以任其事即小宰所謂官常者此皆稽察禮儀之事也掌治法以考羣吏之治乘財用之出入而詔冢宰誅賞此皆糾核功過之事也以式法掌祭祀之戒具凡朝覲會同賓客之牢禮與夫弔事喪紀之戒令即小宰所謂官法者此又稽察禮儀之事也羣吏之治日入其成月進其要嵗獻其會宰夫令之以贊冢宰小宰而考治焉宫中之吏則有警戒之條賢能之書以訓迪職事而待上之舉焉此又糾核功過之事也故曰宰夫者贊小宰句考之官也宫正掌王宮之戒令糾禁以時比宮中之官府次舍之衆寡為之版以待夕擊柝而比之國有故則令宿其比亦如之比徐芳履反一音毗志反柝吐各反注比校次其人之在否官府之在宮中者若膳夫玉府內宰內史之屬次諸吏直宿舍其所居寺版其人之名籍待待戒令及比鄭司農故謂禍災玄謂故凡非常也文王世子曰公有出疆之政庶子以公族之無事者守於公宫正室守太廟諸父守貴宫貴室諸子諸孫守下宮下室此謂諸侯也王之庶子職掌國子之倅國有大事則帥國子而致於太子唯所用之者令宿之事蓋亦存焉疏云令宿之事蓋亦存焉者宿衛之事亦在惟所用中彼是甲兵不云宿衛故云亦存焉訓以時比之謂每夕則比國有故則比也衆寡士庶子之屬辨外內而時禁注鄭司農云分别外人內人禁其非時出入自內宰所掌以內為內以外為外稽其功緒糾其德行幾其出入均其稍食行下孟反注幾其出入若今時無引籍不得入宫司馬殿門也疏言引籍者有門籍及引人皆得出入也訓按功緒以其見于職事言也德行以其修於身言也此內兼治官府以下則治庶子及人徒去其淫怠與其竒邪之民邪似嗟反亦作邪注民宫中吏之家人也疏使之不為即是去也訓民中容有胥徒之屬在宫中者會其什伍而教之道藝注五人為伍二伍為什會之者使之輩作輩學相勸帥且寄宿衛之令疏會謂會合宫中子弟宫正掌宫中卿大夫士亦兼掌子弟月終則會其稍食嵗終則會其行事訓行事至嵗終乃會者防有黜陟總計一嵗功過多寡可以黜陟行事謂功緒德行道藝之屬凡邦之大事令于王宫之官府次舍無去守而聽政令注使居其處待所為訓大事與上有故異故是有警此大事則又廣矣如祭祀賓客會同喪紀之類其詳在諸子職言待所為其事不一非止於令宿也春秋以木鐸修火禁注火星以春出以秋入因天時而以戒疏春為季春秋為季秋此火謂陶冶鑄銅之火此火禁謂宫正施於宫中者凡邦之事蹕宫中廟中則執燭蹕音畢注事祭事也邦之祭社稷七祀於宫中祭先公先王於廟中𨽻僕掌蹕止行者宫正則執燭以為明疏云祭社稷七祀於宫中者宗廟社稷在宫中中門之外王出向二處當寢晨而行則宫正執燭為明也大喪則授廬舍辨其親疏貴賤之居注廬倚廬也舍堊室也親者貴者居倚廬疏者賤者居堊室雜記曰大夫居廬士居堊室疏大喪謂王喪臣子斬衰則同廬舍所居則異親者謂大功以上貴者謂大夫以上疏者謂小功緦麻賤謂士訓宫正一官首言比法次辨外內此所以治王宫之守也次而掌其稽功糾行之條與其幾察出入之務次而嚴其淫怠竒邪之禁與其什伍道藝之教此所以治宫中之人也月終會其稍食嵗終會其行事此所以結治宫中之人也有大事則令無去守此所以足守王宫之事也衛宫中者有官府及士庶子其比法與其戒令皆宫正統之宫正宫伯所掌無卿大夫之適子只是庶子適子使之入學司樂教之庶子使之宿衛諸子教之所謂士庶子者士謂官府庶子謂卿大夫之庶子也説見師氏保氏宫伯掌王宫之士庶子凡在版者注王宫之士謂王宫中諸吏之適子也庶子其支庶也疏宫伯掌宫中卿大夫之適子庶子士之適子也按大司馬王弔勞士庶子彼注士為卿大夫士庶子為卿大夫之子則兼適庶與此不同者彼更無弔勞卿大夫士身故士為卿大夫庶子中兼適庶是鄭望文以為義也掌其政令行其秩敘作其徒役之事注秩祿稟敘才等也作徒役之事太子所用訓行案行也秩祿之厚薄敘位之先後授八次八舍之職事若邦有大事作宫衆則令之月終則均秩嵗終則均敘注衛王宫者必居四角四中於徼候便也次其宿衛所在舍其休沐之處疏言四角四中者以其言八似若八方為四方四維故以四角四中解之訓家茂夫叔父曰授職事即掌其政令也令宫中即作其徒役也月終均秩嵗終均敘即行其秩敘也職事謂伺察守望也均亦會也徼古弔反以時頒其衣裘掌其誅賞訓宫伯之職以二宫正士庶子之治宫正亦兼掌之復専設宫伯一官者士庶子有起徒役之事徒役事繁不得兼職也葉氏曰宫正宫伯掌王宫者也在王宫者百官府有版士庶子亦有版百官府有次舍士庶子亦有次舍此皆郎衛也太僕司𨽻虎賁所掌皆兵衛也天子之衛有二其别有四卿大夫士之在宫中者宫正掌之士庶子之在宫中者宫伯掌之視朝則司士正其儀大事則諸子掌其政此守環列之衛也王視朝則前正位而退王出入則自左馭而前驅視朝則在路門之左太僕掌之小臣御僕屬焉此僕從侍御之衛也虎士八百人先後王而趨以卒伍視朝則在路門之右虎賁氏掌之旅賁氏屬焉此奔走先後之衛也居虎門之左使其屬帥四夷之𨽻各以其兵服守王之門外且蹕師氏掌之帥四翟之𨽻使服其邦之服執其邦之兵以守王宫司𨽻掌之此周防揵閉之衛也士庶子之在版者皆卿大夫士之子弟有諸子以考之成材者有司樂以合之宫伯惟均秩敘頒衣裘掌誅賞而已膳夫掌王之食飲膳羞以養王及后世子食音嗣注食飯也飲酒漿也膳牲肉也羞有滋味者凡養之具大略有四疏云養王及后世子者舉尊者言其實羣臣及三夫人以下亦養之食飲膳羞即下文食用六穀飲用六清等六清水漿醴䣼醫酏不言酒文略也下文仍有珍用八物醬用百有二十甕不言者此舉大者珍醬是饋之小者凡王之饋食用六穀膳用六牲飲用六清羞用百有二十品珍用八物醬用百有二十甕甕音甕屋貢反注進物於尊者曰饋此饋之盛者王舉之饌也六牲馬牛羊豕犬雞也羞出於牲及禽獸以備滋味謂之庶羞公食大夫禮內則下大夫十六上大夫二十其物數備焉天子諸侯有其數而物未得盡聞珍謂淳熬淳母炮豚炮牂搗珍漬熬肝膋也醬謂醯醢也鄭司農云六穀稌黍稷粱麥苽苽雕胡也六清水漿醴䣼醫酏疏云羞出於牲及禽獸者按公食大夫下大夫十六豆從膷臐膮以下皆出於牲不見有出禽獸上大夫加以雉兔鶉鴽此則出禽獸也云天子諸侯有其數者此經云天子百有二十掌客云公四十侯伯三十二子男二十四云物未得盡聞者謂少有聞其數皆從上大夫二十豆以上加之內則云牛修及爵鷃蜩范芝栭已下三十一物注云皆人君燕食所加庶羞也云珍謂淳熬已下是為八珍內則有糝與餰彼是羞豆之實非珍云醬謂醯醢者醬是總名經云百有二十甕醢人共醢六十甕醯人共醯六十甕故知醬中兼有醯醢也王日一舉鼎十有二物皆有俎注殺牲盛饌曰舉王曰一舉以朝食也后與王同庖鼎十有二牢鼎九陪鼎三物謂牢鼎之實亦九俎疏言王日一舉者謂一日一太牢云物皆有俎者俎據正鼎鼎各一俎鄭云王日一舉以朝食者按玉藻云皮辨以日視朝遂以食日中而餕餕者餕朝之餘明知先朝食次乃日中而餕云后與王同庖者玉藻云夫人與君同庖注云不特殺明后與王亦然云鼎十有二牢鼎九陪鼎三者按聘禮致饔餼注云飪一牢鼎十有二是也牢鼎九者牛羊豕魚臘腸胃同鼎膚鮮魚鮮臘陪鼎三者當內兼膷臐膮陪牛羊豕鼎後也云亦九俎者陪鼎三膷臐膮者為庶羞在於豆惟牢鼎之物在俎趙商問玉藻天子日食少牢朔月太牢與此不同鄭云禮記後人所集或以諸侯同天子或以天子與諸侯等難據為説當以經為正也以樂侑食膳夫授祭品嘗食王乃食注侑猶勸也祭謂刌肺脊也禮飲食必祭示有所先品者每物皆嘗之道尊者也疏殷祭肝周祭肺祭肺有二種一名舉肺亦名離肺此為食而有也二名祭肺亦名刌肺此為祭而有也舉肺離而不絶祭肺則絶之此為食而授云刌肺脊者以優至尊故與祭祀同也曲禮云殽之序遍祭之今徒言祭肺者略舉其首者也卒食以樂徹于造注造作也鄭司農云造謂食之故與居處也已食徹置故處疏造食處即厨是也內則云天子之閣左達五右達五亦是置食處此不徹於閣者閣內是置新饌故徹于造祭祀徹時歌雍此歌未聞王齊日三舉疏齊必變食故加牲體至三太牢按玉藻朔食加於日食一等則此朔食當兩太牢不言者文不具齊時不樂故不言以樂侑食也大喪則不舉大荒則不舉大札則不舉天地有災則不舉邦有大故則不舉札則八反徐音截災音災注大荒凶年大札疫癘天災日月晦食地災崩動也大故冦戎之事鄭司農云大故刑殺也春秋傳曰司冦行戮君為之不舉疏司冦行戮君為之不舉謂不舉樂此在膳夫食科之中不舉即是不殺牲引司農義在下者欲見大故中含刑殺不舉中含不舉樂也王燕食則奉膳贊祭注燕食謂日中與夕食奉膳奉朝之餘膳所祭者牢肉疏按玉藻天子云日中而餕諸侯云夕深衣祭牢肉鄭注云天子言日中諸侯言夕天子言餕諸侯言祭牢肉互相挾則天子諸侯朝皆祭肺日中與夕皆祭牢肉凡王祭祀賓客食則徹王之胙俎注膳夫親徹胙俎胙俎最尊也其餘則其屬徹之賓客食而王有胙俎王與賓客禮食主人飲食之俎皆為胙俎見於此矣疏云胙俎最尊者胙者酢也王與尸賓相答酢也云賓客食而王有胙俎是禮食者以其賓客與祭祀同科故知非凡平燕食按公食大夫主君與聘大夫禮食賓前有食君前無食今天子與諸侯禮食王前有食俎者天子於諸侯其禮異於諸侯與聘大夫也云主人飲食之俎皆為胙俎者按特牲少牢主人胙俎直是祭祀不兼賓客此則俱有也凡王之稍事設薦脯醢注鄭司農云稍事謂非日中大舉時而間食玄謂稍事有小事而飲酒疏先鄭意旦及日中食牲牢日中後空食脯醢後鄭不從者玉藻諸侯猶夕祭牢肉則天子夕食牢肉可知又脯醢是飲酒肴羞非食饌若大夫以下燕食有脯無膾設脯不嫌若王之日食不得空薦脯醢也王燕飲酒則為獻主注鄭司農云主人當獻賓則膳夫代王為主君不敵臣也掌后及世子之膳羞注亦主其饌之數不饋之耳疏上王日一舉注后與王同庖不言世子則世子别牲云不饋之者按上文膳夫饋王故云品嘗食按內饔共后及世子之膳羞則是后世子內饔饋之凡肉修之頒賜皆掌之凡祭祀之致福者受而膳之以摯見者亦如之注致福謂諸臣祭祀歸胙于王鄭司農云膳夫受之以給王膳疏云致福者凡祭主人受福若與王受福然知諸臣有致胙法者左傳子産云祭有受脤歸脤注云受脤謂公頒祭肉於大夫歸脤謂大夫歸胙于公嵗終則會唯王及后世子之膳不會注不會計多少優尊者其頒賜羣臣則計之疏此膳夫所掌膳羞是其正故世子亦不會庖人掌禽獻是其加故王及后不會世子則會之訓膳夫所掌飲食皆所以共王后世子者其米穀之物則取之舂人其禽獸之物則取之庖人其割烹之事則責之內饔其調和之宜則掌之食醫其酒醬醯醢之屬則取之酒人漿人醯人醢人膳夫蓋掌其陳數與凡禮儀是故每食則有授祭嘗食之節齋戒朔食則有加牢之文其或怪異災祲則有徹牲廢樂之事此一日一舉之常食也至于祭祀賓客之禮食非時小事之飲酒或與羣臣禮燕而示慈惠凡皆有王食之禮事焉膳夫皆親其薦徹代其獻酢若乃后世子之膳羞與夫諸臣之頒賜雖非王食之所關而或同君之庖或以餕君之惠則其儀亦不可以不備至於家祭之歸脤羣工之禽摯雖非食官之所共而或以明其受福或以享其臣人則亦可以佐珍羞之所不及此膳夫所以調燮王躬而為食官之長也燕食之列於祭祀賓客之上何也曰此日食之常也故因王日一舉之文而遂次之所以終日食之事耳庖人掌共六畜六獸六禽辨其名物凡其死生鮮薧之物以共王之膳與其薦羞之物及后世子之膳羞共祭祀之好羞共喪紀之庶羞賓客之禽獻鮮悉然反薧古老反好呼報反注六畜六牲也始養之曰畜將用之曰牲春秋傳曰卜曰曰牲鄭司農云六獸麋鹿熊麕野豕兔六禽雁鶉鷃雉鳩鴿玄謂獸人冬獻狼又內則無熊則六獸當有狼而熊不屬六禽於禽獻及六摯宜為羔豚犢麛雉雁凡鳥獸未孕曰禽薦亦進也備品物曰薦致滋味乃為羞王言薦者味以不褻為尊鄭司農云鮮謂生肉薧謂乾肉好羞若荆州之鮺魚青州之蟹胥雖非常物進之孝也喪紀之祭謂虞祔也禽獻獻禽于賓客疏云掌共六畜者馬牛羊犬豕雞謂夏官校人地官牛人春官雞人秋官犬人冬官豕人總送六畜與此庖人六獸六禽即下獸人送之庖人得之共與膳夫內外饔也云鳥獸未孕曰禽者欲見禽中不妨有羔豚犢麛據以禽作六摯禽中亦有羔是其未孕者也云備品物曰薦致滋味乃為羞者對后世子羞言膳即是致滋味之羞備品物者謂王舉則共醢六十甕共醯物六十甕及三牲之俎皆是致滋味乃為羞謂百有二十品者云祭祀之好羞則是非常之物尋常所共者在內外饔也云共喪紀庶羞者凡喪未葬以前無問朝夕奠及大奠皆為薦羞之法為虞祔之祭乃有庶羞虞後有卒哭祭明日乃祔今不言卒哭者卒哭亦共庶羞可知賓客之禽獻謂掌客所共乘禽是也訓名物謂畜獸禽各異也死生鮮薧謂畜獸禽或生或死或鮮或薧也言共喪紀之庶羞則薦羞亦共之矣凡令禽獻以法授之其出入亦如之注令令獸人也禽獸不可久處賓客至將獻之庖人乃令獸人取之必書所當獻之數與之及其來致禽亦以此書校數之至于獻賓客又以此書付使者展而行之掌客乘禽于諸侯各如其命之數聘禮乘禽於客日如其饔餼之數士中日則二雙疏云其出入亦如之者庖人以當獻之數令獸人是其法獸人依數以禽入庖人是入也庖人還依數付使者送賓館是出也鄭引掌客及聘禮者掌客乘禽各依命數是諸侯禮聘禮乘禽于諸侯之卿大夫不依命數如公侯伯之卿三命子男之卿再命爵皆卿也命數雖不同皆饔餼五牢乘禽日五雙故言日如其饔餼之數云士中日則二雙者謂士一日則一雙禽獻中間也問日則二雙也此所謂以法授之也訓注疏以此節専承賓客愚意上文王后世子之膳羞以至祭祀喪紀賓客皆用禽獸並有法以出入之則此似不得單言賓客也禽獻獻字當從故書作獸字凡用禽獻春行羔豚膳膏香夏行腒鱐膳膏臊秋行犢麛膳膏腥冬行鮮羽膳膏羶膏香禮記作薌音同腒其居反鱐所留反臊素刀反羶書然反注用禽獻謂煎和之以獻王鄭司農云膏香牛脂也腒乾雉鱐乾魚杜子春云膏臊犬膏膏腥豕膏鮮魚也羽雁也膏羶羊脂玄謂膏腥雞膏也羔豚物生而肥犢麛物成而充腒鱐暵熱而乾魚雁水涸而性定此八物者得四時之氣尤盛為人食之弗勝是以用休廢之脂膏煎和膳之牛屬司徒土也雞屬宗伯木也犬屬司冦金也羊屬司馬火也疏五行不言北方豕之脂膏者四時食法皆用死之脂膏殺其氣豕北方水土賊水但無中央食法故不言五行王相相刻春木王火相土死金囚水為休廢夏火王土相金死水囚木為休廢以下皆然王所勝者死相所勝者囚新謝者為休廢若然所膳脂膏並是死者云休廢者散文通也訓此亦通言用禽獸法嵗終則會唯王及后之膳禽不會訓庖人所掌無烹調之事但共其物以與膳夫內外饔即用禽獸亦謂共其物也鮮薧中兼有魚內饔掌王及后世子膳羞之割亨煎和之事辨體名肉物辨百品味之物亨普庚反注割肆解肉也亨煮也煎和齊以五味體名脊脅肩臂臑之屬肉物胾燔之屬百品味庶羞之屬疏云體名脊脅肩臂臑之屬者按少牢解羊豕前體肩臂臑後體膊骼又有正脊脡脊橫脊短脅正脅代脅為十一體云肉物胾燔之屬者按公食大夫十六豆有胾又少牢主婦獻尸以燔從切肉曰胾傅火曰燔訓體名肉物謂牛羊豕百品味謂醯醢羞珍皆是體名體各異名肉物即謂每體之肉物總之也體名肉物即下文所以實鼎俎者百品味即下文百羞醬物珍物也王舉則陳其鼎爼以牲體實之選百羞醬物珍物以俟饋注取於鑊以實鼎取於鼎以實俎實鼎曰脀實俎曰載選謂恆選擇其中御者疏百羞者庶羞百二十醬物者醬百二十甕珍物者諸八珍之類脀職升反共后及世子之膳羞注膳夫掌之是乃共之辨腥臊羶香之不可食者牛夜鳴則庮羊泠毛而毳羶犬赤股而躁臊鳥皫色而沙鳴貍豕盲視而交睫腥馬黑脊而般臂螻庮音由病也泠音零毳音脆此內切躁則到切皫本又作犥芳表反貍音鬱盲已亮反視音視睫音接般音班螻音樓注腥臊羶香可食者是别其不可食者則所謂者皆臭味也泠毛毛長總結也皫失色不澤美也沙澌也交睫腥腥當為星肉有如米者似星般臂臂毛有文鄭司農云庮朽木臭也螻螻蛄臭也杜子春云盲視當為望視疏鄭云腥臊羶香可食者即上庖人所云以腥臊羶香表牛羊豕雞也赤股股裏無毛凡宗廟之祭祀掌割亨之事凡燕飲食亦如之凡掌共羞修刑膴胖骨鱐以待共膳凡王之好賜肉修則饔人共之膴音無武夫切又火吳反胖普半反注掌共共當為具羞庶羞也修鍛脯也胖如脯而腥者刑鉶羮也膴䐑肉大臠所以祭者骨牲體也鱐乾魚好賜王所善而賜也疏內饔不掌外神故云宗廟之祭祀燕飲食謂王及后世子云修鍛脯者謂加薑桂鍛治之若不加薑桂不鍛治者謂之脯云胖如脯而腥者乾則為脯不乾為胖云膴䐑肉大臠所以祭者膴詁為大魚肉皆有之有司徹云主人一魚加膴祭于其上故云所以祭也訓凡燕飲食疑是內賓客如圖宗人於燕朝以飲食之禮親宗族兄弟是也外饔掌外祭祀之割亨共其脯修刑膴陳其鼎俎實之牲體魚臘凡賓客之飱饔饗食之事亦如之食音嗣注飱客始至之禮饔既將幣之禮致禮於客莫盛於饔疏外祭祀謂天地四望山川社稷五祀鄭云致禮於客莫盛於饔者饔有飪有腥有牽又有酒有米兼燕與食其中芻薪米禾又多也訓亦如之者謂掌割亨共脯修刑膴實牲體魚臘之事也其生牢當是庖人共與掌客其米與酒則舂人酒人共之也邦饗耆老孤子則掌其割亨之事饗士庶子亦如之注孤子者死王事者之子也士庶子衛王宫者若今之饗衛士矣王制曰周人養國老於東膠養庶老於虞庠疏云饗耆老者謂死事者之父祖兼有國老庶老師役則掌共其獻賜脯肉之事注獻謂酌其長帥疏獻謂獻酒非獻肉故鄭謂酌其長帥長帥軍將以下至伍長有功者饗獻之凡小喪紀陳其鼎俎而實之注謂喪事之奠祭疏小喪紀謂夫人以下之喪亨人掌共鼎鑊以給水火之齊職內外饔之爨亨煮辨膳羞之物齊才細反爨七亂反注鑊所以煮肉及魚臘之器既孰乃脀于鼎齊多少之量職主也爨今之竈主於其竈煮物疏案少牢大夫五鼎羊豕腸胃魚臘各異鑊鑊别一鼎鑊中肉孰各升一鼎水火之齊謂實水於鑊及爨之以火皆有多少之齊膳羞謂牢鼎之物是也祭祀共大羮鉶羮賓客亦如之注大羮肉湆鄭司農云大羮不致五味也鉶羮加鹽菜矣疏大羮鑊中煮肉汁一名湆盛於登不調以鹽菜五味鉶羮皆是陪鼎膷臐膮牛用藿羊用苦豕用薇調以五味盛於鉶謂之鉶羮若盛于豆即謂之庶羞賓客饗食亦應有大羮故云亦如之訓案陪鼎有二用在鉶為鉶羮在豆為庶羞見於此矣甸師掌帥其屬而耕耨王藉以時入之以共齍盛耨乃豆反藉同籍齍音資注其屬府史胥徒也耨藝芓也王以孟春躬耕帝藉天子三推三公五推卿諸侯九推庶人終於千畝庶人謂徒三百人疏天子藉田千畝在南郊藉田之穀衆神皆用獨言帝藉者舉尊言之云耨藝芓者藝莇子擁本也以時入之謂麥則夏熟禾黍秋熟以時送入地官神倉粢盛者六穀曰粢在器曰盛爾雅以稷為粢稷五穀長通而言之六穀皆是粢也祭祀共蕭茅共野果蓏之薦蓏力果反注杜子春云蕭香蒿也玄謂即詩云取蕭祭脂茅以共祭之苴亦以縮酒苴以藉祭縮酒泲酒也醴齊縮酌甸在逺郊之外郊外曰野果桃李之屬蓏瓜瓞之屬疏蕭茅蕭惟祭祀宗廟時有之茅則外內之神俱用案司巫云祭祀共蒩館謂甸師共茅與司巫司巫為苴以共之此據祭宗廟也鄉師云大祭祀共茅蒩據祭天時亦甸師送茅與鄉師為苴則甸師惟共茅不共苴也有核為果無核為蓏喪事代王受眚災眚生景反注粢盛者祭祀之主也今國遭大喪若云此黍稷不馨使鬼神不逞于王既殯太祝作禱辭授甸人使以禱藉田之神受眚災弭後殃疏知太祝作禱辭在既殯後者太祝職授甸人禱辭在大斂後大斂則殯也王之同姓有罪則死刑焉罪古罪字注鄭司農云文王世子曰公族有死罪則磬於甸人又曰公族無宫刑不踐其類也刑于隱者不與國人慮兄弟疏言同姓者絶服之外同姓姬者死刑焉謂死及肉刑司冦斷獄定罪訖適甸師氏而刑殺之不於市朝也案掌囚云凡有爵者與王之同族奉而適甸師氏以待刑殺此不言有爵者文不具帥其徒以薪蒸役外內饔之事注役為給役也木大曰薪小曰蒸疏其徒三百人耕藉田千畝其事至間故兼為外內饔所役一獸人掌罟田獸辨其名物注罟網也以網摶所當田之獸疏四時田獵春用火夏用車秋用羅冬用徒四時各有其一以為主無妨四時兼有罔取當田之獸冬獻狼夏獻麋春秋獻獸物注狼膏聚麋膏散聚則溫散則涼以救時之苦也獸物凡獸皆可獻也疏案內則取稻米為狼臅膏以為餰則狼之所用惟取膏若麋之所用則多矣春秋凡獸物皆可獻者以其寒溫適也時田則守罟及幣田令禽注于虞中注守罟備獸觸攫弊仆也仆而田止鄭司農云虞中謂虞人釐所田之野及弊田植虞旗於其中致禽而珥焉獸人主令田衆得禽者置虞人所立虞旗之中當以給四時社廟之祭故曰大獸公之小禽私之公之謂輸之於虞中珥焉者取左耳以致功若斬首折馘疏注猶聚也云致禽而珥焉謂大獸公之者已孕曰獸未孕曰禽凡祭祀喪紀賓客共其死獸生獸注共其完者訓生獸則獸人直供與庖人死獸則付之臘人或鮮之或乾之以共庖人之用也但言祭祀賓客喪紀等不言王膳者省文實王膳亦在其中也凡獸入于臘人皮毛筋角入于玉府筋音斤注當乾之訓入于臘人則是死獸也故取其皮毛筋角焉生獸雖非直共臘人及其用之亦必入臘人之手則其皮毛筋角亦皆均取之焉凡田獸者掌其政令訓凡田獸者謂卿大夫常田及百姓田獵是也政令者為之厲禁有時以取之有禮以限之亦或徵其皮角筋骨焉凡田獸者先受政令于獸人及田則迹人依政令而糾察之也漁人掌以時漁為梁注月令季冬命漁師為梁鄭司農云梁水偃也偃水為關空以笱承其空疏言以時漁為梁者謂一嵗三時取魚皆為梁以取之偃水為關空者偃水兩畔中央通水為關孔以笱承其空者笱者葦薄以薄承其關孔取魚也春獻王鮪注王鮪鮪之大者月令季春薦鮪于寢廟疏取魚之法嵗有五月令孟春云獺祭魚此時得取一也秋季薦鮪二也鱉人云秋獻龜魚三也王制云獺祭魚然後虞人入澤梁是十月四也季冬漁人始魚五也三時取魚唯夏不取案魯語云宣公夏濫於泗淵以其非時里革諫之辨魚物為鮮薧以共王膳羞薧本又作稿苦老反訓蓋共之庖人凡祭祀賓客喪紀共其魚之鮮薧凡漁者掌其政令凡漁征入于玉府疏此所共者共內外饔漁征謂近川澤之民於十月獺祭魚之時其民亦得取魚水族之類其中鬚骨堪飾器物故征之也鱉人掌取互物注鄭司農云互物謂有甲㒼胡龜鱉之屬㒼莫于反以時簎魚鱉龜蜃凡貍物簎音浞士角切蜃音腎時忍切貍莫皆反注蜃大蛤鄭司農云簎謂以杈刺泥中摶取之春獻鱉蜃秋獻龜魚注此其出在淺處可得之時魚亦謂自貍藏疏簎魚鱉據所取春鱉蜃秋龜魚據所獻其時一也鄭云魚亦謂自貍藏者若不自貍藏則在上漁人取之矣祭祀共蠯螺蚳以授醢人蠯薄隹反螺音裸郎果反蚳音墀直尼切注螺螔蝓鄭司農云蠯蛤也杜子春云蚌也蚳蛾子疏案醢人有蠯醢螺蚳醢故以此三者授之蛤即蚌一物也蛾子者謂蟻之子掌凡邦之簎事臘人掌乾肉凡田獸之脯臘膴胖之事注大物解肆乾之謂之乾肉薄析曰脯捶之而施薑桂曰鍛修臘小物全乾疏云小物全乾者案特牲云陳鼎于門外棜在其南南順實獸于上又云宗人舉獸尾告備蓋士用兔是小物全乾者少牢用麋不云舉獸尾則未全然則天子所用之獸必大亦必不全今云全者謂有全者耳趙商問臘人掌乾肉而有膴胖何鄭答雖鮮亦屬臘人訓言田獸别於牲也脯臘膴胖四名惟臘専是獸脯與膴胖牲亦有之凡祭祀共豆脯薦脯膴胖凡臘物豆音羞胖普半反杜音版注脯非豆實豆當為羞聲之誤也膴詁曰大謂䐑肉大臠胖宜為脯而腥胖之言片也析肉意也禮有腥腍爓皆先制乃烹疏知脯非豆實者案籩人職有栗脯則脯是籩實知豆當為羞者案籩人職云凡祭祀共其籩薦羞之實鄭云未飲未食曰薦已飲已食曰羞羞薦相對下既言薦脯明上當言羞脯也云胖宜為脯而腥謂肉薄不煮者云胖之言片析肉意者解胖是薄義云禮有腥腍爓皆先制乃烹者祭祀有薦腥薦爓薦熟王者皆當先制為胖也賓客喪紀共其脯臘凡乾肉之事疏此所共者共內外饔也訓不言膳羞者省文醫師掌醫之政令聚毒藥以共醫事注藥之物恆多毒疏共醫事謂共疾醫瘍醫等凡邦之有疾病者疕瘍者造焉則使醫分而治之疕音諀匹婢切瘍音羊造七報反注疕頭瘍亦謂秃也身傷曰瘍分之者醫各有能疏下有食醫獸醫亦屬醫師不來造醫師者食醫主齊和飲食不須造醫師獸醫掌畜獸之賤其畜獸便造獸醫故亦不須造醫師言疕頭瘍者案下瘍醫不言疕腫瘍等可以兼之醫各有能者疾醫不知瘍瘍醫不知疾故分而治之也嵗終則稽其醫事以制其食十全為上十失一次之十失二次之十失三次之十失四為下注食祿也以失四為下者五則半矣或不治自愈疏祿食有常今差為五等者但功適中者守本祿功髙者益之功下者損之訓程伊川曰十全為上非謂十人皆愈但知可治不可治者十人皆中即為上耳食醫掌和王之六食六飲六膳百羞百醬八珍之齊食音嗣齊才細反注和調也疏此等並是膳夫所掌食醫調和而已訓內饔所掌煎和専是牢鼎之物食醫則兼食飲諸物齊和之六膳即六牲凡食齊視春時羮齊視夏時醬齊視秋時飲齊視冬時視音視注飯宜溫羮宜熱醬宜涼飲宜寒疏羮謂大羮鉶羮菜羮等醬者食之主言醬則該諸豆實矣訓此以春夏秋冬表見溫熱涼寒也凡和春多酸夏多苦秋多辛冬多鹹調以滑甘和胡卧反注各尚其時味而甘以成之猶水火金木之載於土內則曰棗栗飴蜜以甘之堇荁枌榆免稿滫瀡以滑之疏春多酸者春時調和食物酸多於餘味一分也四時皆然訓上文是四時無異者此條是四時各異者凡會膳食之宜牛宜稌羊宜黍豕宜稷犬宜梁雁宜麥魚宜苽稌音杜苽音孤注會成也謂其味相成鄭司農云稌粳也爾雅曰稌稻苽雕胡也疏此膳食相宜之法依本草素問牛味甘平稻味苦而溫甘苦相成羊味甘熱黍味苦溫亦甘苦相成豭豕味酸牝豕味苦稷米味甘犬味酸而溫粱味甘而微寒雁味甘平大麥味酸而溫小麥味甘微寒俱是氣味相成魚族甚多寒熱酸苦兼有而云宜苽或同是水物相宜故云魚宜苽凡君子之食恆放焉疏上六食六飲一經據共王凡食齊已下雖以王為主君子大夫以上通依之也疾醫掌養萬民之疾病四時皆有癘疾春時有痟首疾夏時有癢疥疾秋時有瘧寒疾冬時有嗽上氣疾痟音消癢以掌反疥音介嗽西豆反注癘疾氣不和之疾痟酸削也首疾頭痛也嗽咳也上氣逆喘也疏云痟酸削者人患頭痛則有酸嘶而痛酸削則酸嘶也此直言萬民不言王與大夫醫師雖不言或可醫師治之以五味五穀五藥養其病注養猶治也病由氣勝負而生攻其贏養其不足者五味醯酒飴蜜薑鹽之屬五穀麻黍稷麥豆也五藥草木蟲石穀也疏氣勝負如體寒即是水水贏而勝火氣負而不足也五味醯酸酒苦飴蜜甘薑辛鹽鹹也五藥有穀者謂五穀之中麻豆之等有入藥分者是也訓凡人之病其於五味五穀亦各有宜有不宜者焉所宜者即可以養其病也以五氣五聲五色視其死生注三者劇易之徵見於外者五氣五藏所出氣也肺氣熱心氣次之肝氣涼脾氣溫腎氣寒五聲言語宫商角徵羽也五色面貌青赤黃白黑也察其盈虛休王吉凶可知疏劇易者人病在內見其聲色則知增劇及簡易云察其盈虛休王吉凶可知者假令冬時面色黑其氣寒聲應羽此是盈而王吉可知其色黃其氣熱聲應宫此得中央土來尅已此是虛而休凶可知若得東方青色等則子來助已亦吉訓氣謂冷熱之見於皮膚者也此溫熱寒涼之氣非五藏之常皆於病時察之驗其何氣則知其受病之處也五聲如肝聲呼心聲歎脾聲歌肺聲哭腎聲呻皆謂受病時聲以此氣聲色之發於外者占其病候又其甚者以知死生也兩之以九竅之變參之以九藏之動竅苦弔反注兩參之者以觀其死生之驗竅之變謂開閉非常陽竅七隂竅二藏之動謂脈至與不至正藏五又有胃膀胱大腸小腸疏陽竅七者在頭露見為陽隂竅二者在下不見為隂正藏五者肺心肝脾腎又有胃膀胱大小腸此乃六府中取出四者六府胃小腸大腸膀胱膽三焦以其受盛故謂之府亦有藏稱故入九藏案黃帝八十一難經胃為水穀之府小腸為受盛之府大腸為行道之府膀胱為津液之府此正府也故入九藏膽者清淨之府三焦為孤府非正府故不入九藏訓兩參俱承上文言皆所以視其死生五氣五聲五色一也九竅之變兩也九藏之動三也癘疾四者乃四時民病之凡五味五穀五藥乃隨時救病之具氣聲色其發見之最粗者九竅則較微矣九藏則尤微矣覩其外以知其內審其內以合其外皆所以為視病之方用藥之本者也凡民之有疾病者分而治之死終則各書其所以而入于醫師注少者曰死老者曰終所以謂治之不愈之狀也醫師得以制其祿且為後治之戒瘍醫掌腫瘍潰瘍金瘍折瘍之祝藥劀殺之齊折時設反劀音刮齊才細反注腫瘍癰而上生創者潰瘍癰而含膿血者金瘍刃瘡也折瘍踠跌者祝當為注注謂附著藥劀刮去膿血殺謂以藥食其惡肉疏齊者注藥於瘡乃後刮殺亦有齊量之宜癰而上生瘡者謂癰而有頭未潰者凡療瘍以五毒攻之注止病曰療五毒五藥之有毒者今醫方有五毒之藥作之合黃堥置石膽丹砂雄黃礜石慈石其中燒之三日三夜其煙上著以雞羽掃取之以注創惡肉破骨則盡出疏黃堥如今時和合丹藥用黃瓦缶為之亦名黃堥以五氣養之以五藥療之以五味節之注既刮殺而攻盡其宿肉乃養之也五氣當為五穀節節成其藥之力疏五穀五味皆當據病所宜云節成其藥之力者即下文以酸養骨之類是也訓五毒以攻其外五藥以療其內五穀以補五毒之傷五味以成五藥之效凡藥以酸養骨以辛養筋以鹹養脈以苦養氣以甘養肉以滑養竅注以類相養也酸木味木根立地中似骨辛金味金之纒合異物似根鹹水味水之流行地中似脈苦火味火出入無形似氣甘土味土含載四者似肉滑滑石也凡諸滑物通利往來似竅訓此謂藥之五味所養如此物之五味其所養亦如此故可以助成藥之功也凡有瘍者受其藥焉獸醫掌療獸病療獸瘍注畜獸之疾病及瘍療同醫疏此醫惟療家畜不療野獸但畜獸通耳凡療獸病灌而行之以節之以動其氣觀其所發而養之注療畜獸必灌行之者為其病狀難知灌以緩之且強其氣也節趨聚之節也氣謂脈氣既行之乃以脈視之以知所病訓灌謂灌之以藥也觀其所發大略亦不外於五氣五聲五色九竅之類凡療獸瘍灌而劀之以發其惡然後藥之養之食之食音嗣注亦先攻之而後養之凡獸之有病者有瘍者使療之死則計其數以進退之疏上醫師云十全為上惟據疾醫瘍醫不據獸醫故此云計其數以進退之所謂進退其祿也周禮纂訓卷二
